<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agnes Agent</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c5cff'/%3E%3Cstop offset='1' stop-color='%235a9cff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M10 21l6-10 6 10' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="app" class="theme-auto">

  <!-- ==================== 左侧边栏 ==================== -->
  <aside id="sidebar">
    <div class="sidebar-head">
      <div class="brand">
        <span class="brand-mark">
          <svg viewBox="0 0 32 32" width="22" height="22"><rect width="32" height="32" rx="8" fill="url(#brandGrad)"/><path d="M10 21l6-10 6 10" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <svg width="0" height="0"><defs><linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#5a9cff"/></linearGradient></defs></svg>
        </span>
        <span class="brand-name">Agnes Agent</span>
      </div>
      <button id="btnNewChat" class="btn-new" title="新建会话 (Ctrl+N)">
        <svg viewBox="0 0 16 16" width="14" height="14"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>新建会话</span>
      </button>
    </div>

    <div class="sidebar-search">
      <svg viewBox="0 0 16 16" width="14" height="14"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <input id="threadSearch" type="text" placeholder="搜索会话…" autocomplete="off">
    </div>

    <nav id="threadList" class="thread-list"></nav>

    <div class="sidebar-foot">
      <button id="sidebarModel" class="model-pill" title="切换模型（在调试面板中管理）"></button>
      <div class="side-actions">
        <button id="btnToggleTheme" class="icon-btn" title="切换主题">
          <svg class="ic-moon" viewBox="0 0 16 16" width="15" height="15"><path d="M13.5 9.5A5.5 5.5 0 1 1 6.5 2.5a4.5 4.5 0 0 0 7 7z" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linejoin="round"/></svg>
          <svg class="ic-sun" viewBox="0 0 16 16" width="15" height="15" style="display:none"><circle cx="8" cy="8" r="3.2" stroke="currentColor" stroke-width="1.3" fill="none"/><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M12.6 3.4l-1.1 1.1M4.5 11.5l-1.1 1.1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        </button>
        <button id="btnCollapseSidebar" class="icon-btn" title="折叠边栏">
          <svg viewBox="0 0 16 16" width="15" height="15"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- ==================== 主对话区 ==================== -->
  <main id="chat">
    <header id="topbar">
      <button id="btnSidebar" class="icon-btn" title="展开边栏">
        <svg viewBox="0 0 16 16" width="15" height="15"><path d="M1.5 3h13M1.5 8h13M1.5 13h13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <div class="topbar-title">
        <div id="chatTitle">新对话</div>
        <div id="chatMeta" class="topbar-meta"></div>
      </div>
      <div class="topbar-actions">
        <span id="liveBadge" class="live-badge hidden">
          <span class="live-dot"></span>运行中
        </span>
        <div class="approval-mode-bar" id="approvalModeBar" title="命令审批模式">
          <button class="approval-mode-btn" data-mode="per_ask">🔔 每次询问</button>
          <button class="approval-mode-btn" data-mode="session_allow">♻️ 本次会话允许</button>
          <button class="approval-mode-btn" data-mode="always_allow">🔓 永久允许</button>
        </div>
        <button id="btnClearLogs" class="btn-ghost" title="清空日志/事件">
          <svg viewBox="0 0 16 16" width="14" height="14"><path d="M2 4h12M6.5 4V2.8h3V4M4 4l.7 9h6.6l.7-9" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="btnDrawer" class="btn-ghost drawer-toggle" title="调试面板">
          <svg viewBox="0 0 16 16" width="14" height="14"><rect x="2" y="2.5" width="12" height="11" rx="2" stroke="currentColor" stroke-width="1.3" fill="none"/><path d="M2 6.5h12M9.5 2.5v11" stroke="currentColor" stroke-width="1.3"/></svg>
          <span>调试</span>
        </button>
      </div>
    </header>

    <!-- ==================== 任务待办面板 ==================== -->
    <div id="todoPanel" class="todo-panel hidden">
      <div class="todo-summary" id="todoSummary" onclick="toggleTodoPanel()">
        <span class="todo-badge" id="todoBadge">待办 0/0</span>
        <span class="todo-latest" id="todoLatest">暂无任务</span>
        <span class="todo-toggle" id="todoToggle">▾</span>
        <button class="todo-close" id="todoClose" onclick="event.stopPropagation();closeTodoPanel()" title="关闭">×</button>
      </div>
      <div class="todo-list" id="todoList"></div>
    </div>

    <div id="messages" class="messages"></div>

    <!-- ==================== 输入区 ==================== -->
    <footer id="composer">
      <div id="cmdMenu" class="cmd-menu hidden"></div>
      <div class="composer-box">
        <textarea id="chatInput" rows="1" placeholder="给 Agnes 发送消息…（Enter 发送 / Shift+Enter 换行）" autocomplete="off"></textarea>
        <button id="btnStop" class="btn-stop hidden" title="停止生成">
          <svg viewBox="0 0 16 16" width="13" height="13"><rect x="3.5" y="3.5" width="9" height="9" rx="1.5" fill="currentColor"/></svg>
          停止
        </button>
        <button id="btnSend" class="btn-send" title="发送">
          <svg viewBox="0 0 16 16" width="15" height="15"><path d="M2.5 8l11-5.5-3 5.5 3 5.5z" fill="currentColor"/></svg>
        </button>
      </div>
      <div class="composer-hint" id="composerHint">Enter 发送 · Shift+Enter 换行 · <code>/</code> 斜杠命令</div>
    </footer>
  </main>

  <!-- ==================== 右侧调试抽屉 ==================== -->
  <div id="drawerMask" class="drawer-mask hidden"></div>
  <aside id="drawer" class="drawer hidden">
    <div class="drawer-head">
      <span class="drawer-title">调试面板</span>
      <button id="btnDrawerClose" class="icon-btn" title="关闭">
        <svg viewBox="0 0 16 16" width="15" height="15"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </div>
    <nav id="drawerTabs" class="drawer-tabs"></nav>
    <div id="drawerBody" class="drawer-body"></div>
  </aside>

</div>

<div id="toast" class="toast"></div>

<script src="/static/marked.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
