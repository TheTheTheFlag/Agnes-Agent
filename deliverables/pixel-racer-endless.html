<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PIXEL RACER · 像素赛车（无尽模式）</title>
<style>
  html,body{margin:0;padding:0;background:#0e0b1e;height:100%;overflow:hidden;
    display:flex;align-items:center;justify-content:center;}
  #wrap{text-align:center;}
  canvas{
    background:#0e0b1e;
    width:min(1360px,94vw);
    aspect-ratio:3/2;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    border:6px solid #2a2a3a;
    box-shadow:0 0 0 3px #1c1c1e, 0 0 60px rgba(0,0,0,.7);
  }
  #tip{color:#6a6a7a;font:12px/1.7 monospace;letter-spacing:1px;margin-top:8px;}
  kbd{background:#2a2a3a;color:#e8e8e0;padding:1px 6px;border-radius:2px;font:inherit;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="640"></canvas>
  <div id="tip">
    <kbd>&larr;/&rarr;</kbd> 移动 &nbsp;<kbd>SPACE</kbd> 使用道具 &nbsp;
    <kbd>P</kbd> 暂停 &nbsp;<kbd>ENTER</kbd> 确认 &nbsp;<kbd>M</kbd> 音效 &nbsp;<kbd>R</kbd> 重开
  </div>
</div>
<script>
'use strict';
/* =====================================================================
   PIXEL RACER (Endless) v1.0 — 依据 deliverables/pixel-racer-game-design.md 实现
   单文件像素赛车：纵向无尽竞速（躲避车流/收集金币/道具）
   逻辑分辨率 960x640 @60FPS 固定时间步长；零外部依赖；程序化合成音频；纯位图字体。
   核心功能：主循环 / 像素渲染 / 输入处理 / 赛车移动 / AABB 碰撞检测 / 难度推进 / HUD
   可测试: window.PixelRacerAPI + ?test=1 自检模式
   ===================================================================== */
const W=960, H=640;
const STEP=1/60;
const HUD_H=48, TIP_H=40;                 // 顶栏 / 底部提示条
const GAME_TOP=HUD_H, GAME_BOT=H-TIP_H;   // 游戏区 48..600
const ROAD_LEFT=285, ROAD_W=390, ROAD_RIGHT=675, LANE_W=130, LANES=3;
const LANE_CX=[ROAD_LEFT+LANE_W/2, ROAD_LEFT+LANE_W*1.5, ROAD_LEFT+LANE_W*2.5]; // 350/480/610
const PLAYER_W=32, PLAYER_H=64, PLAYER_Y=452;

const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
ctx.imageSmoothingEnabled=false;

/* ---------------- 调色板（设计文档 §5.2） ---------------- */
const C={
  bg:'#0e0b1e', outline:'#222034',
  asphalt:'#2B2B3C', asphaltDark:'#1E1E2E', lane:'#E8E8F0',
  grass:'#3E8948', grassLight:'#4CAF50', sky:'#6FA8DC',
  playerRed:'#E23B3B', playerYellow:'#FFD32A',
  aiBlue:'#3B6FE0', aiPurple:'#8E44AD', aiGreen:'#3BA55D',
  gold:'#FFC312', goldDark:'#B8860B', cyan:'#12CBC4', boostRed:'#FF4757',
  heart:'#FF6B81', white:'#FFFFFF', gray:'#95A5A6', glass:'#1E2A4A',
  wheel:'#222034', headlight:'#FFF6B7'
};

/* ---------------- 像素位图字体（5x7） ---------------- */
const FONT={
 A:[0x0E,0x11,0x11,0x1F,0x11,0x11,0x11],B:[0x1E,0x11,0x11,0x1E,0x11,0x11,0x1E],
 C:[0x0E,0x11,0x10,0x10,0x10,0x11,0x0E],D:[0x1E,0x11,0x11,0x11,0x11,0x11,0x1E],
 E:[0x1F,0x10,0x10,0x1E,0x10,0x10,0x1F],F:[0x1F,0x10,0x10,0x1E,0x10,0x10,0x10],
 G:[0x0E,0x11,0x10,0x17,0x11,0x11,0x0F],H:[0x11,0x11,0x11,0x1F,0x11,0x11,0x11],
 I:[0x0E,0x04,0x04,0x04,0x04,0x04,0x0E],J:[0x07,0x02,0x02,0x02,0x02,0x12,0x0C],
 K:[0x11,0x12,0x14,0x18,0x14,0x12,0x11],L:[0x10,0x10,0x10,0x10,0x10,0x10,0x1F],
 M:[0x11,0x1B,0x15,0x15,0x11,0x11,0x11],N:[0x11,0x19,0x15,0x13,0x11,0x11,0x11],
 O:[0x0E,0x11,0x11,0x11,0x11,0x11,0x0E],P:[0x1E,0x11,0x11,0x1E,0x10,0x10,0x10],
 Q:[0x0E,0x11,0x11,0x11,0x15,0x12,0x0D],R:[0x1E,0x11,0x11,0x1E,0x14,0x12,0x11],
 S:[0x0F,0x10,0x10,0x0E,0x01,0x01,0x1E],T:[0x1F,0x04,0x04,0x04,0x04,0x04,0x04],
 U:[0x11,0x11,0x11,0x11,0x11,0x11,0x0E],V:[0x11,0x11,0x11,0x11,0x11,0x0A,0x04],
 W:[0x11,0x11,0x11,0x15,0x15,0x15,0x0A],X:[0x11,0x11,0x0A,0x04,0x0A,0x11,0x11],
 Y:[0x11,0x11,0x0A,0x04,0x04,0x04,0x04],Z:[0x1F,0x01,0x02,0x04,0x08,0x10,0x1F],
 '0':[0x0E,0x11,0x13,0x15,0x19,0x11,0x0E],'1':[0x04,0x0C,0x04,0x04,0x04,0x04,0x0E],
 '2':[0x0E,0x11,0x01,0x02,0x04,0x08,0x1F],'3':[0x1F,0x02,0x04,0x02,0x01,0x11,0x0E],
 '4':[0x02,0x06,0x0A,0x12,0x1F,0x02,0x02],'5':[0x1F,0x10,0x1E,0x01,0x01,0x11,0x0E],
 '6':[0x06,0x08,0x10,0x1E,0x11,0x11,0x0E],'7':[0x1F,0x01,0x02,0x04,0x08,0x08,0x08],
 '8':[0x0E,0x11,0x11,0x0E,0x11,0x11,0x0E],'9':[0x0E,0x11,0x11,0x0F,0x01,0x02,0x0C],
 ':':[0x00,0x0C,0x0C,0x00,0x0C,0x0C,0x00],'.':[0x00,0x00,0x00,0x00,0x00,0x0C,0x0C],
 '-':[0x00,0x00,0x00,0x1F,0x00,0x00,0x00],'!':[0x04,0x04,0x04,0x04,0x04,0x00,0x04],
 '+':[0x00,0x04,0x04,0x1F,0x04,0x04,0x00],'?':[0x0E,0x11,0x01,0x02,0x04,0x00,0x04],
 '<':[0x02,0x04,0x08,0x10,0x08,0x04,0x02],'>':[0x10,0x08,0x04,0x02,0x04,0x08,0x10],
 '/':[0x01,0x02,0x04,0x08,0x10,0x00,0x00],'%':[0x11,0x12,0x04,0x08,0x09,0x11,0x00]
};
function textWidth(s,scale){ return (s||'').length*5*scale; }
function drawText(s,x,y,scale,color,align){
  if(!s) return; s=String(s).toUpperCase();
  scale=scale||1; ctx.fillStyle=color||C.white;
  if(align==='center') x-=textWidth(s,scale)/2;
  else if(align==='right') x-=textWidth(s,scale);
  let cx=x;
  for(let i=0;i<s.length;i++){
    const ch=s[i];
    if(ch===' '){ cx+=5*scale; continue; }
    const rows=FONT[ch]; if(!rows){ cx+=5*scale; continue; }
    for(let r=0;r<7;r++){
      const bits=rows[r];
      for(let b=0;b<5;b++){
        if(bits & (1<<(4-b))) ctx.fillRect(cx+b*scale, y+r*scale, scale, scale);
      }
    }
    cx+=6*scale;
  }
}
function drawSprite(rows,x,y,scale,color){
  ctx.fillStyle=color;
  for(let r=0;r<rows.length;r++){
    const bits=rows[r];
    for(let b=0;b<8;b++){
      if(bits & (1<<(7-b))) ctx.fillRect(x+b*scale, y+r*scale, scale, scale);
    }
  }
}
const HEART=[0x6C,0xFF,0xFF,0xFF,0x7E,0x3C,0x18];
const STAR=[0x08,0x1C,0x3E,0x7F,0x3E,0x1C,0x08];

/* ---------------- 输入处理（设计文档 §4.1） ---------------- */
const keys={};
let itemCooldown=0;
window.addEventListener('keydown',function(e){
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].indexOf(e.code)>=0) e.preventDefault();
  keys[e.code]=true;
  onKey(e.code);
});
window.addEventListener('keyup',function(e){ keys[e.code]=false; });
canvas.addEventListener('mousedown',function(){ onPointer(); });
canvas.addEventListener('touchstart',function(e){ e.preventDefault(); onPointer(); },{passive:false});

function dirInput(){
  let d=0;
  if(keys['ArrowLeft']||keys['KeyA']) d-=1;
  if(keys['ArrowRight']||keys['KeyD']) d+=1;
  return d;
}

/* ---------------- 音频（Web Audio 程序化合成，设计文档 §6） ---------------- */
let audio=null, audioOn=true, bgmTimer=null, bgmStep=0;
function initAudio(){
  if(audio) return;
  try{ audio=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
}
function tone(f0,f1,dur,type,vol,delay){
  if(!audio||!audioOn) return;
  try{
    const t0=audio.currentTime+(delay||0);
    const o=audio.createOscillator(), g=audio.createGain();
    o.type=type||'square';
    o.frequency.setValueAtTime(f0,t0);
    o.frequency.exponentialRampToValueAtTime(Math.max(1,f1||f0),t0+dur);
    g.gain.setValueAtTime(vol||0.12,t0);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g); g.connect(audio.destination);
    o.start(t0); o.stop(t0+dur+0.02);
  }catch(e){}
}
function sfx(name){
  switch(name){
    case 'coin':  tone(987,1319,0.08,'square',0.10); break;
    case 'combo': tone(1319,1568,0.12,'square',0.12); break;
    case 'crash': tone(200,60,0.30,'sawtooth',0.25); tone(120,40,0.35,'square',0.15,0.02); break;
    case 'hit':   tone(523,392,0.18,'triangle',0.16); break;
    case 'item':  tone(523,784,0.12,'sine',0.14); tone(784,1046,0.14,'square',0.10,0.09); break;
    case 'use':   tone(440,880,0.20,'triangle',0.14); break;
    case 'life':  tone(440,220,0.15,'square',0.14); break;
    case 'extra': tone(880,1175,0.12,'square',0.14); tone(1175,1568,0.14,'square',0.12,0.10); break;
    case 'over':  tone(440,220,0.5,'square',0.16); tone(330,165,0.6,'triangle',0.14,0.25); tone(220,110,0.9,'square',0.12,0.5); break;
    case 'click': tone(800,800,0.04,'square',0.10); break;
    case 'pause': tone(660,660,0.07,'triangle',0.12); tone(660,660,0.07,'triangle',0.12,0.12); break;
    case 'speed': tone(300,520,0.10,'square',0.12); break;
  }
}
function startBGM(){
  if(!audio||bgmTimer||!audioOn) return;
  const BASS=[110,0,110,0,131,0,110,0,98,0,98,0,131,0,147,0];
  const LEAD=[440,0,523,587,0,659,0,523,392,0,440,494,0,440,392,0];
  bgmStep=0;
  bgmTimer=setInterval(function(){
    if(!audioOn){ return; }
    const s=bgmStep%BASS.length;
    if(BASS[s]) tone(BASS[s],BASS[s],0.16,'triangle',0.09);
    if(LEAD[s] && bgmStep%2===0) tone(LEAD[s],LEAD[s],0.10,'square',0.05);
    bgmStep++;
  },150);
}
function stopBGM(){ if(bgmTimer){ clearInterval(bgmTimer); bgmTimer=null; } }
function toggleAudio(){
  audioOn=!audioOn;
  if(audioOn){ initAudio(); startBGM(); } else stopBGM();
  return audioOn;
}

/* ---------------- 游戏状态与核心数据 ---------------- */
let state='TITLE'; // TITLE / PLAYING / PAUSED / GAMEOVER / HELP
let time=0;
let score=0, meters=0, coins=0, lives=3, best=0, livesGiven=0;
let combo=0, lastCoinTime=-99, comboTimer=0;
let player={x:LANE_CX[1], y:PLAYER_Y, vx:0, angle:0};
let cars=[], coinList=[], particles=[], trees=[], toasts=[];
let roadOffset=0, scrollSpeed=240, spawnTimer=1.2, coinTimer=5, treeAcc=0, stageIdx=0;
let invincible=0, shieldTime=0, magnetTime=0, boostTime=0, slowTime=0;
let item=null, shake=0, flash=0, flashW=0, hitStop=0, timescale=1;
let lastLanes=[];

try{ best=parseInt(localStorage.getItem('pixelRacerBest')||'0',10)||0; }catch(e){}

const rand=function(a,b){ return a+Math.random()*(b-a); };
const clamp=function(v,a,b){ return v<a?a:(v>b?b:v); };
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

/* AABB 碰撞检测（带 4px 宽容收缩，设计文档 §2.2） */
function aabb(a,b,shrink){
  shrink=shrink||0;
  return a.x+shrink < b.x+b.w-shrink &&
         a.x+a.w-shrink > b.x+shrink &&
         a.y+shrink < b.y+b.h-shrink &&
         a.y+a.h-shrink > b.y+shrink;
}
function playerRect(){
  return {x:player.x-PLAYER_W/2, y:player.y-PLAYER_H/2, w:PLAYER_W, h:PLAYER_H};
}
function carRect(c){ return {x:c.x-c.w/2, y:c.y-c.h/2, w:c.w, h:c.h}; }

/* 难度阶段（设计文档 §2.3） */
function diffFor(m){
  if(m<200)  return {speed:240, interval:[1.3,1.8], coins:false,item:false,truck:0.03,fast:0.00};
  if(m<600)  return {speed:300, interval:[0.95,1.3], coins:true, item:false,truck:0.08,fast:0.00};
  if(m<1200) return {speed:360, interval:[0.75,1.0], coins:true, item:true, truck:0.14,fast:0.04};
  if(m<2000) return {speed:420, interval:[0.60,0.80],coins:true, item:true, truck:0.20,fast:0.12};
  return       {speed:480, interval:[0.45,0.62], coins:true, item:true, truck:0.24,fast:0.18};
}
function effSpeed(){
  let e=scrollSpeed;
  if(boostTime>0) e*=1.4;
  if(slowTime>0)  e*=0.7;
  return e;
}
const ITEM_POOL=['SHIELD','MAGNET','BOOST','SLOW'];
function pickItemType(){
  const r=Math.random();
  if(r<0.30) return 'SHIELD';
  if(r<0.60) return 'MAGNET';
  if(r<0.80) return 'BOOST';
  return 'SLOW';
}
const CAR_COLORS=[C.aiBlue,C.aiPurple,C.aiGreen,'#C9A227','#E85D75'];

/* ---------------- 生成逻辑 ---------------- */
function spawnCar(diff){
  const lanes=[0,1,2].sort(function(a,b){
    const ra=lastLanes.indexOf(a)>=0?1:0, rb=lastLanes.indexOf(b)>=0?1:0;
    return ra-rb; // 优先选择最近未占用的车道，保证始终存在可穿越路径
  });
  for(let i=0;i<lanes.length;i++){
    const li=lanes[i], cx=LANE_CX[li];
    const isTruck=Math.random()<diff.truck;
    const w=isTruck?40:32, h=isTruck?80:64;
    let blocked=false;
    for(let j=0;j<cars.length;j++){
      const c=cars[j];
      if(Math.abs(c.x-cx)<(w+c.w)/2*0.8 && c.y<40){ blocked=true; break; }
    }
    if(blocked) continue;
    const fast=Math.random()<diff.fast;
    const own=effSpeed()*(fast?0.12:rand(0.28,0.5));
    cars.push({
      x:cx, y:-60, w:w, h:h, speed:own, fast:fast,
      color:fast?C.aiPurple:CAR_COLORS[Math.floor(Math.random()*CAR_COLORS.length)],
      isTruck:isTruck,
      itemType:(diff.item && Math.random()<0.16)?pickItemType():null,
      dead:false
    });
    lastLanes.push(li); if(lastLanes.length>2) lastLanes.shift();
    return;
  }
}
function spawnCoinLine(){
  const lane=Math.floor(Math.random()*3), cx=LANE_CX[lane];
  const n=6+Math.floor(Math.random()*5); // 6..10 枚（设计文档 §2.5）
  const s=Math.random()<0.5, amp=s?30:0;
  for(let i=0;i<n;i++){
    coinList.push({
      x:s? cx+Math.sin(i*0.9)*amp : cx+rand(-12,12),
      y:-20-i*26,
      phase:rand(0,1), dead:false
    });
  }
}
function spawnTree(){
  const side=Math.random()<0.5;
  const x=side?rand(16,ROAD_LEFT-26):rand(ROAD_RIGHT+26,W-16);
  trees.push({x:x,y:-40,kind:Math.floor(Math.random()*3)});
}
function addParticle(x,y,vx,vy,life,color,size){
  particles.push({x:x,y:y,vx:vx,vy:vy,life:life,max:life,color:color,size:size||3});
}
function explode(x,y){
  const colors=[C.gold,C.boostRed,C.playerYellow,C.white];
  for(let i=0;i<18;i++){
    const a=Math.random()*Math.PI*2, sp=rand(40,220);
    addParticle(x,y,Math.cos(a)*sp,Math.sin(a)*sp,rand(0.3,0.8),colors[i%4],rand(2,5));
  }
}
function toast(text,color){ toasts.push({text:text,color:color||C.white,t:1.4}); }

/* ---------------- 更新逻辑（主循环核心） ---------------- */
function resetGame(){
  score=0; meters=0; coins=0; lives=3; livesGiven=0;
  combo=0; lastCoinTime=-99; comboTimer=0;
  player.x=LANE_CX[1]; player.vx=0; player.angle=0;
  cars=[]; coinList=[]; particles=[]; toasts=[]; trees=[];
  roadOffset=0; scrollSpeed=240; spawnTimer=1.0; coinTimer=5; treeAcc=0; stageIdx=0;
  invincible=0; shieldTime=0; magnetTime=0; boostTime=0; slowTime=0;
  item=null; shake=0; flash=0; flashW=0; hitStop=0; timescale=1; lastLanes=[];
}
function startGame(){
  initAudio(); resetGame(); state='PLAYING'; sfx('click'); startBGM();
}

function update(dt){
  time+=dt;
  if(state==='TITLE' || state==='HELP'){
    roadOffset+=120*dt; treeAcc+=120*dt;
    if(treeAcc>90){ treeAcc=0; spawnTree(); }
    updateTrees(dt,120*0.55);
    updateParticles(dt);
    return;
  }
  if(state!=='PLAYING') return;

  // 撞车慢动作（time-scale 0.2，0.3s，设计文档 §5.5）
  if(hitStop>0){ hitStop-=dt; timescale=0.2; }
  else timescale += (1-timescale)*Math.min(1,dt*6);
  const sdt=dt*timescale;

  // 难度推进
  const diff=diffFor(meters);
  const sidx=diff===diffFor(0)?0:(meters<200?0:meters<600?1:meters<1200?2:meters<2000?3:4);
  if(sidx!==stageIdx){ stageIdx=sidx; sfx('speed'); toast('SPEED UP!',C.gold); }
  scrollSpeed += (diff.speed-scrollSpeed)*Math.min(1,sdt*0.4);
  const eff=effSpeed();

  // 里程与得分（距离分 米x1，设计文档 §2.6）
  const dMeters=eff*sdt/12;
  meters+=dMeters; score+=dMeters;
  roadOffset+=eff*sdt;

  // 玩家移动（加速度/最大速度/摩擦，设计文档 §4.3）
  const dir=dirInput();
  if(dir!==0){ player.vx+=dir*1200*sdt; player.vx=clamp(player.vx,-420,420); }
  else{
    if(player.vx>0) player.vx=Math.max(0,player.vx-1800*sdt);
    else if(player.vx<0) player.vx=Math.min(0,player.vx+1800*sdt);
  }
  player.x+=player.vx*sdt;
  const minX=ROAD_LEFT+24, maxX=ROAD_RIGHT-24;
  if(player.x<minX){ player.x=minX; player.vx=0; }
  if(player.x>maxX){ player.x=maxX; player.vx=0; }
  const targetAngle=clamp(player.vx/420,-1,1)*0.05;
  player.angle+=(targetAngle-player.angle)*Math.min(1,sdt*10);
  if(Math.abs(player.vx)>60 && Math.random()<0.5){
    addParticle(player.x-player.vx*0.03-6, player.y+24, -player.vx*0.05, 40, 0.35, '#555a6a', 2);
  }

  // 生成车流 / 金币串 / 树
  spawnTimer-=sdt;
  if(spawnTimer<=0){ spawnCar(diff); spawnTimer=rand(diff.interval[0],diff.interval[1]); }
  coinTimer-=sdt;
  if(coinTimer<=0){ if(diff.coins) spawnCoinLine(); coinTimer=rand(3.5,6); }
  treeAcc+=eff*sdt;
  if(treeAcc>120){ treeAcc=0; spawnTree(); }

  // 车流移动（相对速度 = 道路滚动 - 车自身速度）
  for(let i=cars.length-1;i>=0;i--){
    const c=cars[i];
    c.y+=(eff-c.speed)*sdt;
    if(c.y-c.h/2>H+40){ cars.splice(i,1); continue; }
    // 碰撞判定（AABB + 4px 收缩）
    if(invincible<=0 && boostTime<=0 && aabb(playerRect(),carRect(c),4)){
      if(c.itemType){ grantItem(c); c.dead=true; }
      else onCrash(c);
    }
  }
  cars=cars.filter(function(c){ return !c.dead; });

  // 金币
  const pr=playerRect();
  for(let i=coinList.length-1;i>=0;i--){
    const k=coinList[i];
    k.y+=eff*sdt;
    if(magnetTime>0){
      const dx=player.x-k.x, dy=player.y-k.y, d=Math.sqrt(dx*dx+dy*dy);
      if(d<120 && d>0.01){ k.x+=dx/d*Math.min(1,sdt*10)*120*sdt*2; k.y+=dy/d*Math.min(1,sdt*10)*120*sdt*2; }
    }
    k.phase+=sdt*4;
    if(Math.abs(player.x-k.x)<24 && Math.abs(player.y-k.y)<40){ collectCoin(); coinList.splice(i,1); continue; }
    if(k.y>H+30){ coinList.splice(i,1); }
  }

  // 道具计时
  if(shieldTime>0) shieldTime-=sdt;
  if(magnetTime>0) magnetTime-=sdt;
  if(boostTime>0)  boostTime-=sdt;
  if(slowTime>0)   slowTime-=sdt;
  if(invincible>0) invincible-=sdt;
  if(itemCooldown>0) itemCooldown-=dt;
  if(comboTimer>0) comboTimer-=dt;
  if(time-lastCoinTime>1.5 && combo>0) combo=0;

  updateTrees(dt,eff*0.55);
  updateParticles(dt);
  updateToasts(dt);

  // 特效衰减
  if(shake>0) shake-=dt;
  if(flash>0) flash-=dt*0.8;
  if(flashW>0) flashW-=dt*1.5;
}
function updateTrees(dt,spd){
  for(let i=trees.length-1;i>=0;i--){ trees[i].y+=spd*dt; if(trees[i].y>H+60) trees.splice(i,1); }
}
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=120*dt; p.life-=dt;
    if(p.life<=0) particles.splice(i,1);
  }
}
function updateToasts(dt){
  for(let i=toasts.length-1;i>=0;i--){ toasts[i].t-=dt; if(toasts[i].t<=0) toasts.splice(i,1); }
}

function collectCoin(){
  coins++; score+=10; sfx('coin');
  addParticle(player.x-4,player.y-4,rand(-60,60),rand(-120,-40),0.4,C.gold,3);
  addParticle(player.x+4,player.y+4,rand(-60,60),rand(-120,-40),0.4,C.gold,3);
  if(time-lastCoinTime<1.5){ combo++; } else { combo=1; }
  lastCoinTime=time; comboTimer=1.2;
  if(combo>=3 && combo%5===0){ score+=20; sfx('combo'); toast('COMBO x'+combo+'! +20',C.gold); }
  if(coins>=(livesGiven+1)*100 && lives<5){
    lives++; livesGiven++; sfx('extra'); toast('EXTRA LIFE!',C.heart);
  }
}
function grantItem(c){
  item={type:c.itemType}; sfx('item'); toast(c.itemType+'!',C.cyan);
  explode(c.x,c.y);
}
function useItem(){
  if(!item || itemCooldown>0) return;
  const t=item.type; item=null; itemCooldown=0.12; sfx('use');
  if(t==='SHIELD'){ shieldTime=10; toast('SHIELD ON',C.cyan); }
  else if(t==='MAGNET'){ magnetTime=8; toast('MAGNET ON',C.cyan); }
  else if(t==='BOOST'){ boostTime=3; toast('BOOST!',C.boostRed); }
  else if(t==='SLOW'){ slowTime=5; toast('SLOW MOTION',C.gray); }
}
function onCrash(c){
  explode(c.x,c.y); explode(player.x,player.y);
  if(shieldTime>0){
    shieldTime=0; invincible=1.2; shake=0.25; flash=0.3; sfx('hit');
    toast('SHIELD BROKEN',C.cyan); return;
  }
  lives--; invincible=2.0; shake=0.45; flash=0.5; flashW=0.4; hitStop=0.45; sfx('crash');
  if(lives<=0){ sfx('over'); gameOver(); }
  else toast('LIFE LOST',C.boostRed);
}
function gameOver(){
  state='GAMEOVER';
  if(Math.floor(score)>best){ best=Math.floor(score); try{ localStorage.setItem('pixelRacerBest',String(best)); }catch(e){} }
  explode(player.x,player.y); explode(player.x-10,player.y+10);
}

/* ---------------- 渲染 ---------------- */
function drawRoadScene(){
  // 草地底色
  ctx.fillStyle=C.grass; ctx.fillRect(0,GAME_TOP,W,GAME_BOT-GAME_TOP);
  // 草地横纹（0.7x 慢速滚动，视差）
  ctx.fillStyle=C.grassLight;
  for(let y=(roadOffset*0.7%80)-80; y<GAME_BOT; y+=80){
    ctx.globalAlpha=0.45; ctx.fillRect(0,y,ROAD_LEFT,36); ctx.fillRect(ROAD_RIGHT,y,W-ROAD_RIGHT,36);
    ctx.globalAlpha=1;
  }
  // 树木（0.55x 视差，横向装饰）
  for(let i=0;i<trees.length;i++){
    const t=trees[i];
    ctx.fillStyle='#2a5a34'; ctx.fillRect(t.x-3,t.y,6,10);
    ctx.fillStyle=t.kind===0?'#3E8948':(t.kind===1?'#5CB85C':'#2E7D32');
    ctx.fillRect(t.x-7,t.y-12,14,12);
    ctx.fillStyle='rgba(255,255,255,0.25)'; ctx.fillRect(t.x-4,t.y-9,4,4);
  }
  // 道路
  ctx.fillStyle=C.asphalt; ctx.fillRect(ROAD_LEFT,GAME_TOP,ROAD_W,GAME_BOT-GAME_TOP);
  ctx.fillStyle=C.asphaltDark; ctx.fillRect(ROAD_LEFT-6,GAME_TOP,6,GAME_BOT-GAME_TOP);
  ctx.fillRect(ROAD_RIGHT,GAME_TOP,6,GAME_BOT-GAME_TOP);
  // 两侧白色实线
  ctx.fillStyle=C.lane; ctx.fillRect(ROAD_LEFT+6,GAME_TOP,4,GAME_BOT-GAME_TOP);
  ctx.fillRect(ROAD_RIGHT-10,GAME_TOP,4,GAME_BOT-GAME_TOP);
  // 车道虚线
  for(let i=1;i<LANES;i++){
    const lx=ROAD_LEFT+LANE_W*i-4;
    for(let y=(roadOffset%60)-60; y<GAME_BOT; y+=60){
      ctx.fillStyle=C.lane; ctx.fillRect(lx,y,8,36);
    }
  }
  // 路缘道钉（2 帧闪烁，设计文档 §5.4）
  for(let y=(roadOffset%220)-110; y<GAME_BOT; y+=220){
    const flick=(Math.floor((y+roadOffset)/22)+Math.floor(time*6))%2===0;
    ctx.fillStyle=flick?'#FFD32A':'#B8860B';
    ctx.fillRect(ROAD_LEFT-14,y,6,10); ctx.fillRect(ROAD_RIGHT+8,y,6,10);
  }
  // 金币
  for(let i=0;i<coinList.length;i++){
    const k=coinList[i]; drawCoin(k.x,k.y,k.phase);
  }
  // 车流（按 y 排序，远处先画）
  const sorted=cars.slice().sort(function(a,b){ return a.y-b.y; });
  for(let i=0;i<sorted.length;i++) drawCarObj(sorted[i]);
  // 玩家（无敌闪烁 8Hz，设计文档 §4.3）
  if(invincible<=0 || Math.floor(time*8)%2===0) drawPlayer();
}
function drawCoin(x,y,phase){
  const s=Math.abs(Math.cos(phase*Math.PI));
  const w=Math.max(2,Math.round(12*s));
  ctx.fillStyle=C.goldDark; ctx.fillRect(x-w/2,y-6,w,12);
  ctx.fillStyle=C.gold;     ctx.fillRect(x-w/2+1,y-5,w-2,10);
  if(s>0.5){ ctx.fillStyle=C.headlight; ctx.fillRect(x-1,y-3,2,3); }
}
function drawCarObj(c){
  const x0=Math.round(c.x-c.w/2), y0=Math.round(c.y-c.h/2);
  ctx.fillStyle='rgba(0,0,0,0.35)'; ctx.fillRect(x0+3,y0+4,c.w,c.h);
  if(c.isTruck){
    ctx.fillStyle=c.color; ctx.fillRect(x0+2,y0+10,c.w-4,c.h-26);
    ctx.fillStyle=C.outline; ctx.fillRect(x0+2,y0+c.h-16,c.w-4,6);
    ctx.fillStyle=c.color; ctx.fillRect(x0,y0+2,c.w-4,14);
    ctx.fillStyle=C.glass; ctx.fillRect(x0+2,y0+4,c.w-8,5);
    ctx.fillStyle='#FF6B81'; ctx.fillRect(x0+c.w/2-1,y0+14,2,3);
  } else {
    ctx.fillStyle=C.outline; ctx.fillRect(x0+6,y0+2,c.w-12,4);
    ctx.fillStyle=c.color;   ctx.fillRect(x0+4,y0+6,c.w-8,c.h-12);
    ctx.fillStyle=C.glass;   ctx.fillRect(x0+7,y0+14,c.w-14,8);
    ctx.fillStyle='#222034'; ctx.fillRect(x0+c.w/2-2,y0+22,4,c.h-30);
    ctx.fillStyle=C.wheel;   ctx.fillRect(x0,y0+12,4,10); ctx.fillRect(x0+c.w-4,y0+12,4,10);
    ctx.fillRect(x0,y0+c.h-20,4,10); ctx.fillRect(x0+c.w-4,y0+c.h-20,4,10);
    ctx.fillStyle=C.headlight; ctx.fillRect(x0+5,y0+6,4,3); ctx.fillRect(x0+c.w-9,y0+6,4,3);
  }
  // 道具车：金色车身 + 车顶旋转星标
  if(c.itemType){
    ctx.fillStyle='#E8A33D'; ctx.fillRect(x0+2,y0+4,c.w-4,4);
    const bob=Math.floor(time*8)%2===0;
    drawSprite(STAR,c.x-8,c.y-c.h/2-16+(bob?1:0),2,C.gold);
  }
}
function drawPlayer(){
  ctx.save();
  ctx.translate(player.x,player.y);
  ctx.rotate(player.angle);
  const x0=-16, y0=-32, w=32, h=64;
  ctx.fillStyle='rgba(0,0,0,0.35)'; ctx.fillRect(x0+3,y0+4,w,h);
  ctx.fillStyle=C.outline; ctx.fillRect(x0+6,y0+2,w-12,4);
  ctx.fillStyle=C.playerRed; ctx.fillRect(x0+4,y0+6,w-8,h-12);
  ctx.fillStyle=C.glass;   ctx.fillRect(x0+7,y0+14,w-14,8);
  ctx.fillStyle=C.playerYellow; ctx.fillRect(x0+w/2-2,y0+22,4,h-30);
  ctx.fillStyle=C.wheel; ctx.fillRect(x0,y0+12,4,10); ctx.fillRect(x0+w-4,y0+12,4,10);
  ctx.fillRect(x0,y0+h-20,4,10); ctx.fillRect(x0+w-4,y0+h-20,4,10);
  ctx.fillStyle=C.headlight; ctx.fillRect(x0+5,y0+6,4,3); ctx.fillRect(x0+w-9,y0+6,4,3);
  // 加速火焰
  if(boostTime>0){
    ctx.fillStyle='rgba(255,71,87,0.8)';
    ctx.fillRect(x0+8, y0+h-2, 4, 8+Math.floor(Math.random()*8));
    ctx.fillRect(x0+20,y0+h-2, 4, 8+Math.floor(Math.random()*8));
  }
  ctx.restore();
  // 护盾光罩（设计文档 §2.4）
  if(shieldTime>0){
    ctx.globalAlpha=0.35;
    ctx.fillStyle=C.cyan;
    ctx.fillRect(player.x-22,player.y-40,44,80);
    ctx.globalAlpha=0.6;
    ctx.fillRect(player.x-22,player.y-40,44,4); ctx.fillRect(player.x-22,player.y+36,44,4);
    ctx.fillRect(player.x-22,player.y-40,4,80); ctx.fillRect(player.x+18,player.y-40,4,80);
    ctx.globalAlpha=1;
  }
}
function drawHUD(){
  ctx.fillStyle=C.bg; ctx.fillRect(0,0,W,HUD_H);
  ctx.fillStyle=C.bg; ctx.fillRect(0,GAME_BOT,W,TIP_H);

  drawText('SCORE',12,6,1,C.gray);
  drawText(String(Math.floor(score)).padStart(6,'0'),12,16,2,C.white);
  drawText('DIST '+Math.floor(meters)+'M',12,36,1,C.gray);
  // 生命（右上角，8x8 心形 x2 倍）
  for(let i=0;i<3;i++){
    drawSprite(HEART,W-14-i*24,8,2, i<lives?C.heart:C.asphaltDark);
  }

  if(item){

  // 速度条（右缘竖条，红黄绿渐变）

  for(let i=0;i<24;i++){
    const t=i/23;
    ctx.fillStyle=t<frac?(t<0.33?'#4CAF50':(t<0.66?'#FFD32A':'#FF4757')):'#23233a';
    ctx.fillRect(fx, fy+fh-i*(fh/24), fw, fh/24-2);

    drawText(t.text,W/2,110,2,t.color,'center');

function drawSpeedLines(){

function drawEffects(){

/* ---------------- 主渲染入口 ---------------- */
function render(){
  ctx.fillStyle=C.bg; ctx.fillRect(0,0,W,H);
  if(state==='TITLE'){ drawTitle(); return; }
  if(state==='HELP'){ drawHelp(); return; }

  ctx.save();
  if(shake>0){
    ctx.translate(Math.round(rand(-1,1)*shake*14), Math.round(rand(-1,1)*shake*14));
  }
  drawRoadScene();
  drawSpeedLines();
  ctx.restore();
  drawHUD();
  drawEffects();

  if(state==='PAUSED') drawPause();
  else if(state==='GAMEOVER') drawGameOver();
}

/* ---------------- 按键分发 ---------------- */
function onKey(code){
  if(code==='KeyM'){ toggleAudio(); return; }
  if(state==='TITLE'){
    if(code==='Enter'||code==='Space'||code==='KeyH'){ if(code==='KeyH'){ state='HELP'; sfx('click'); } else startGame(); }
    return;
  }
  if(state==='HELP'){
    if(code==='KeyB'||code==='Escape'||code==='Enter'){ state='TITLE'; sfx('click'); }
    return;
  }
  if(state==='PLAYING'){
    if(code==='Space'||code==='ArrowUp'||code==='KeyW'){ useItem(); }
    else if(code==='KeyP'||code==='Escape'){ state='PAUSED'; sfx('pause'); stopBGM(); }
    else if(code==='KeyR'){ startGame(); }
    return;
  }
  if(state==='PAUSED'){
    if(code==='KeyP'||code==='Escape'||code==='Enter'){ state='PLAYING'; sfx('click'); startBGM(); }
    else if(code==='KeyR'){ startGame(); }
    else if(code==='KeyQ'){ state='TITLE'; sfx('click'); stopBGM(); }
    else if(code==='KeyH'){ state='HELP'; }
    return;
  }
  if(state==='GAMEOVER'){
    if(code==='Enter'||code==='KeyR'){ startGame(); }
    else if(code==='KeyQ'){ state='TITLE'; sfx('click'); stopBGM(); }
  }
}
function onPointer(){
  if(state==='TITLE') startGame();
  else if(state==='PAUSED'){ state='PLAYING'; sfx('click'); startBGM(); }
  else if(state==='GAMEOVER'){ startGame(); }
}

/* ---------------- 主循环（固定时间步长 60FPS） ---------------- */
let last=performance.now(), acc=0;
function frame(t){
  requestAnimationFrame(frame);
  let dt=(t-last)/1000; last=t;
  if(dt>0.25) dt=0.25;
  acc+=dt;
  let guard=0;
  while(acc>=STEP && guard<5){ update(STEP); acc-=STEP; guard++; }
  render();
}
document.addEventListener('visibilitychange',function(){
  if(document.hidden && state==='PLAYING'){ state='PAUSED'; sfx('pause'); stopBGM(); }
});

/* ---------------- 自检模式（?test=1） ---------------- */
function runSelfTest(){
  const results=[];
  const ok=function(name,cond){ results.push({name:name,pass:!!cond}); };
  // AABB 碰撞（含 4px 收缩）
  ok('aabb-hit', aabb({x:0,y:0,w:10,h:10},{x:5,y:5,w:10,h:10}));
  ok('aabb-miss', !aabb({x:0,y:0,w:10,h:10},{x:20,y:0,w:10,h:10}));
  ok('aabb-shrink-gap', !aabb({x:0,y:0,w:10,h:10},{x:12,y:0,w:10,h:10},4));
  ok('aabb-shrink-hit', aabb({x:0,y:0,w:10,h:10},{x:9,y:0,w:10,h:10},4));
  // 难度阶段推进
  ok('diff-stage1', diffFor(100).speed===240);
  ok('diff-stage2', diffFor(300).speed===300);
  ok('diff-stage5', diffFor(2500).speed===480);
  ok('diff-progress', diffFor(300).speed>diffFor(100).speed);
  ok('diff-density', diffFor(2500).interval[1]<diffFor(100).interval[0]);
  // 车道缺口保证：最近 2 条占用车道之外必剩 1 条
  lastLanes=[0,1];
  const free=[0,1,2].filter(function(l){ return lastLanes.indexOf(l)<0; });
  ok('gap-guarantee', free.length===1);
  // 计分（距离分 米x1 + 金币 +10 + 连击）
  let s=0; s+=100; s+=3*10; ok('scoring-coin', s===130);
  // 玩家横向移动物理：加速度与摩擦
  player.vx=0; player.x=LANE_CX[1];
  for(let i=0;i<20;i++){ const d=dirInput(); if(d!==0){ player.vx+=d*1200*STEP; player.vx=clamp(player.vx,-420,420);} else{ if(player.vx>0)player.vx=Math.max(0,player.vx-1800*STEP); else if(player.vx<0)player.vx=Math.min(0,player.vx+1800*STEP);} player.x+=player.vx*STEP; }
  ok('move-maxspeed', Math.abs(player.vx)<=420.01);
  ok('move-bounds', player.x>=ROAD_LEFT+24 && player.x<=ROAD_RIGHT-24);
  // 道具类型池
  ok('item-pool', ITEM_POOL.length===4);
  const passed=results.filter(function(r){return r.pass;}).length;
  window.__PR_TEST__={results:results,passed:passed,total:results.length};
  try{ console.table(results); }catch(e){}
  return window.__PR_TEST__;
}

/* ---------------- 对外测试 API ---------------- */
window.PixelRacerAPI={
  getState:function(){ return {state:state,score:Math.floor(score),meters:Math.floor(meters),lives:lives,cars:cars.length,coins:coinList.length,eff:Math.round(effSpeed()),combo:combo,item:item&&item.type}; },
  step:function(n){ n=n||1; for(let i=0;i<n;i++) update(STEP); },
  reset:function(){ resetGame(); },
  start:function(){ startGame(); },
  spawnCar:function(){ spawnCar(diffFor(meters)); },
  setMeters:function(m){ meters=m; },
  fireItem:function(){ if(state==='PLAYING') useItem(); },
  best:function(){ return best; },
  runSelfTest:runSelfTest
};

if(location.search.indexOf('test')>=0) runSelfTest();
requestAnimationFrame(frame);
</script>
