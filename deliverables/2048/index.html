<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- 响应式：移动端适配 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2048 - 网页版</title>
<style>
  /* ============ 全局样式 ============ */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #faf8ef;
    color: #776e65;
    font-family: "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    /* 阻止触摸时的页面滚动/回弹 */
    overscroll-behavior: none;
    touch-action: manipulation;
    user-select: none;
  }

  /* max-width 居中容器，适配移动端与桌面 */
  .container {
    max-width: 500px;
    margin: 0 auto;
    padding: 12px;
  }

  /* ============ 顶部信息区 ============ */
  header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
  }

  h1 {
    font-size: 2.4rem;
    margin: 0;
    font-weight: 800;
    letter-spacing: -1px;
    line-height: 1;
  }

  .subtitle {
    width: 100%;
    font-size: 0.8rem;
    color: #9d948c;
    margin: 2px 0 8px;
  }

  .scores {
    display: flex;
    gap: 8px;
  }

  .score-box {
    background: #bbada0;
    color: #f9f6f2;
    border-radius: 6px;
    padding: 6px 14px;
    text-align: center;
    min-width: 74px;
  }
  .score-box .label {
    display: block;
    font-size: 0.66rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #eee4da;
  }
  .score-box .value {
    display: block;
    font-size: 1.15rem;
    font-weight: 800;
    line-height: 1.2;
  }

  /* 分数增加浮动提示 */
  .score-addition {
    position: absolute;
    font-weight: 800;
    color: rgba(119,110,101,.9);
    font-size: 1.1rem;
    animation: score-pop 0.6s ease-in forwards;
    pointer-events: none;
  }
  @keyframes score-pop {
    0%   { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-30px); }
  }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 10px 0;
  }

  button.btn {
    background: #8f7a66;
    color: #f9f6f2;
    border: none;
    border-radius: 6px;
    padding: 10px 16px;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button.btn:hover { background: #9f8b77; }
  button.btn:active { background: #7f6a56; }

  /* ============ 棋盘 ============ */
  .board-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #bbada0;
    border-radius: 8px;
    padding: 10px;
    /* 棋盘网格：4 列 x 4 行 */
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 10px;
  }

  /* 底层格子的占位背景 */
  .cell-bg {
    background: rgba(238, 228, 218, 0.35);
    border-radius: 6px;
  }

  /* 方块层：绝对定位覆盖在棋盘上，便于动画 */
  .tile-layer {
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;
    bottom: 10px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 10px;
    pointer-events: none;
  }
  .tile-layer > * { min-width: 0; min-height: 0; }

  .tile {
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    font-weight: 800;
    font-size: clamp(1.1rem, 7vw, 2.1rem);
    background: #eee4da;
    color: #776e65;
    transition: transform 0.08s ease;
  }

  /* 出现动画（新方块） */
  @keyframes tile-appear {
    0%   { opacity: 0; transform: scale(0.1); }
    100% { opacity: 1; transform: scale(1); }
  }
  .tile.appear { animation: tile-appear 0.18s ease; }

  /* 合并动画（合并后的方块） */
  @keyframes tile-merge {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.22); }
    100% { transform: scale(1); }
  }
  .tile.merge { animation: tile-merge 0.18s ease; }

  /* 不同数值配色 */
  .tile[data-v="2"]    { background: #eee4da; color: #776e65; }
  .tile[data-v="4"]    { background: #ede0c8; color: #776e65; }
  .tile[data-v="8"]    { background: #f2b179; color: #f9f6f2; }
  .tile[data-v="16"]   { background: #f59563; color: #f9f6f2; }
  .tile[data-v="32"]   { background: #f67c5f; color: #f9f6f2; }
  .tile[data-v="64"]   { background: #f65e3b; color: #f9f6f2; }
  .tile[data-v="128"]  { background: #edcf72; color: #f9f6f2; font-size: clamp(1rem, 6vw, 1.8rem); }
  .tile[data-v="256"]  { background: #edcc61; color: #f9f6f2; font-size: clamp(1rem, 6vw, 1.8rem); }
  .tile[data-v="512"]  { background: #edc850; color: #f9f6f2; font-size: clamp(1rem, 6vw, 1.8rem); }
  .tile[data-v="1024"] { background: #edc53f; color: #f9f6f2; font-size: clamp(0.85rem, 5vw, 1.5rem); }
  .tile[data-v="2048"] { background: #edc22e; color: #f9f6f2; font-size: clamp(0.85rem, 5vw, 1.5rem); box-shadow: 0 0 24px rgba(237,194,46,.7); }
  /* 大于 2048 的方块 */
  .tile.big           { background: #3c3a32; color: #f9f6f2; font-size: clamp(0.8rem, 4.5vw, 1.4rem); }

  /* ============ 遮罩提示（胜利 / 结束） ============ */
  .overlay {
    position: absolute;
    inset: 0;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    background: rgba(238, 228, 218, 0.75);
    z-index: 10;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .overlay.win  { background: rgba(237, 194, 46, 0.72); color: #f9f6f2; }
  .overlay.lose { background: rgba(238, 228, 218, 0.82); color: #776e65; }
  .overlay .title { font-size: 2rem; font-weight: 800; }
  .overlay .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .overlay .actions button { background: #8f7a66; color: #f9f6f2; }
  .overlay.win .actions button.primary { background: #f9f6f2; color: #776e65; }

  /* 操作说明 */
  .help {
    font-size: 0.78rem;
    color: #9d948c;
    line-height: 1.5;
    margin: 12px 0 0;
  }
  .help b { color: #776e65; }
</style>
</head>
<body>
  <div class="container">
    <header>
      <h1>2048</h1>
      <div class="scores">
        <div class="score-box">
          <span class="label">得分</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="score-box">
          <span class="label">最高分</span>
          <span class="value" id="best">0</span>
        </div>
      </div>
      <div class="subtitle">合并相同数字，凑出 2048！</div>
    </header>

    <div class="toolbar">
      <button class="btn" id="new-game">重新开始</button>
    </div>

    <div class="board-wrap" id="board">
      <!-- 底层 16 个背景格（JS 生成亦可，这里静态写出更直观） -->
      <div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div>
      <div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div>
      <div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div>
      <div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div><div class="cell-bg"></div>

      <!-- 方块渲染层 -->
      <div class="tile-layer" id="tile-layer"></div>

      <!-- 胜利/结束遮罩 -->
      <div class="overlay" id="overlay">
        <div class="title" id="overlay-title"></div>
        <div class="actions">
          <button class="btn primary" id="overlay-primary"></button>
          <button class="btn" id="overlay-secondary">重新开始</button>
        </div>
      </div>
    </div>

    <p class="help">
      <b>操作：</b>使用 方向键 或 <b>W A S D</b> 移动方块；在移动设备上直接<b>滑动屏幕</b>。<br>
      相同数字在移动方向上碰撞时会合并为它们的和，每次合并只发生一次。
    </p>
  </div>

<script>
(function () {
  "use strict";

  /* ==================== 常量与状态 ==================== */
  const SIZE = 4;                 // 4x4 棋盘
  const WIN_VALUE = 2048;         // 胜利目标
  const STORAGE_KEY = "game2048_best";  // localStorage 键名

  // 棋盘：二维数组 grid[r][c] = 数值，0 表示空
  let grid;
  let score = 0;
  let best = 0;
  let won = false;        // 是否已达成 2048
  let keepPlaying = false; // 胜利后是否选择继续游戏
  let over = false;       // 游戏是否结束
  let busy = false;       // 动画期间避免连续操作导致错乱

  /* ==================== DOM 引用 ==================== */
  const tileLayer = document.getElementById("tile-layer");
  const scoreEl   = document.getElementById("score");
  const bestEl    = document.getElementById("best");
  const boardWrap = document.getElementById("board");
  const overlay   = document.getElementById("overlay");
  const ovTitle   = document.getElementById("overlay-title");
  const ovPrimary = document.getElementById("overlay-primary");
  const ovSecondary = document.getElementById("overlay-secondary");
  const newGameBtn = document.getElementById("new-game");

  /* ==================== 工具函数 ==================== */

  // 深拷贝一个空棋盘
  function emptyGrid() {
    return Array.from({ length: SIZE }, () => new Array(SIZE).fill(0));
  }

  // 读取本地最高分
  function loadBest() {
    try {
      const v = parseInt(localStorage.getItem(STORAGE_KEY), 10);
      best = Number.isFinite(v) && v > 0 ? v : 0;
    } catch (e) {
      best = 0; // localStorage 不可用时（如隐私模式）静默降级
    }
    bestEl.textContent = best;
  }

  // 写入本地最高分
  function saveBest() {
    try {
      localStorage.setItem(STORAGE_KEY, String(best));
    } catch (e) { /* 忽略写入失败 */ }
  }

  // 所有空格坐标
  function emptyCells() {
    const list = [];
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (grid[r][c] === 0) list.push({ r, c });
      }
    }
    return list;
  }

  // 在随机空格生成一个新方块：90% 为 2，10% 为 4
  // 返回新方块坐标（供动画标记），无空格时返回 null
  function addRandomTile() {
    const cells = emptyCells();
    if (cells.length === 0) return null;
    const { r, c } = cells[Math.floor(Math.random() * cells.length)];
    grid[r][c] = Math.random() < 0.9 ? 2 : 4;
    return { r, c };
  }

  /* ==================== 渲染 ==================== */

  // 根据当前 grid 重绘方块层
  // newTiles: 需要播放"出现"动画的坐标数组
  // mergeTiles: 需要播放"合并"动画的坐标数组
  function render(newTiles, mergeTiles) {
    const isNew = (r, c) => (newTiles || []).some(p => p.r === r && p.c === c);
    const isMerge = (r, c) => (mergeTiles || []).some(p => p.r === r && p.c === c);

    tileLayer.innerHTML = "";
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const v = grid[r][c];
        const cell = document.createElement("div");
        if (v === 0) {
          // 空位：保留一个占位 div，维持 grid 单元格对齐
          cell.className = "tile-empty";
          tileLayer.appendChild(cell);
          continue;
        }
        cell.className = "tile";
        cell.dataset.v = v;
        if (v > WIN_VALUE) cell.classList.add("big"); // 超过 2048 的方块样式
        cell.textContent = v;
        if (isNew(r, c))   cell.classList.add("appear");
        if (isMerge(r, c)) cell.classList.add("merge");
        tileLayer.appendChild(cell);
      }
    }

    scoreEl.textContent = score;
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      saveBest();
    }
  }

  // 分数增加浮动提示
  function showScoreAddition(amount) {
    if (!amount) return;
    const el = document.createElement("div");
    el.className = "score-addition";
    el.textContent = "+" + amount;
    const rect = scoreEl.getBoundingClientRect();
    el.style.left = (rect.left + rect.width / 2 - 12) + "px";
    el.style.top  = (rect.top - 4) + "px";
    el.style.position = "fixed";
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 600);
  }

  /* ==================== 核心逻辑：移动与合并 ==================== */

  // 把一维数组（一行/一列，按移动方向排列）向左压缩合并
  // 规则：同值相邻合并一次，不重复合并；返回 {line, gained, merges}
  // merges 为发生合并后新方块在该方向队列中的索引集合
  function slideAndMerge(line) {
    // 1) 去掉 0（压缩）
    const arr = line.filter(v => v !== 0);
    const result = [];
    const merges = [];
    let gained = 0;

    // 2) 从左到右合并相邻相同值，每个元素最多参与一次合并
    for (let i = 0; i < arr.length; i++) {
      if (i < arr.length - 1 && arr[i] === arr[i + 1]) {
        const merged = arr[i] * 2;
        merges.push(result.length); // 合并后方块落在 result 的当前尾部索引
        result.push(merged);
        gained += merged;
        i++; // 跳过被合并掉的下一个
      } else {
        result.push(arr[i]);
      }
    }

    // 3) 右侧补 0 到长度 4
    while (result.length < SIZE) result.push(0);
    return { line: result, gained, merges };
  }

  /**
   * 执行一次移动。
   * dir: "left" | "right" | "up" | "down"
   * 返回是否有任何方块发生了移动或合并
   */
  function move(dir) {
    // 复制一份用于判断"是否真的有变化"
    const before = grid.map(row => row.slice());

    let gainedTotal = 0;
    const mergePositions = []; // 需要播放合并动画的 {r,c}

    // 逐行/逐列处理
    for (let i = 0; i < SIZE; i++) {
      // 取出一整条线，并按移动方向排序：保证"朝着方向的最前方"位于数组头部
      let line = [];
      const coords = []; // 该 line 中每个元素对应的棋盘坐标
      for (let j = 0; j < SIZE; j++) {
        let r, c;
        if (dir === "left")  { r = i; c = j; }
        else if (dir === "right") { r = i; c = SIZE - 1 - j; }
        else if (dir === "up")    { r = j; c = i; }
        else /* down */           { r = SIZE - 1 - j; c = i; }
        coords.push({ r, c });
        line.push(grid[r][c]);
      }

      // 压缩合并（统一按"向左"逻辑处理，因为 line 已按方向排好序）
      const { line: newLine, gained, merges } = slideAndMerge(line);
      gainedTotal += gained;

      // 写回棋盘，并记录合并位置
      for (let j = 0; j < SIZE; j++) {
        const { r, c } = coords[j];
        grid[r][c] = newLine[j];
      }
      merges.forEach(idx => {
        const { r, c } = coords[idx];
        mergePositions.push({ r, c });
      });
    }

    // 判断棋盘是否发生变化
    let changed = false;
    for (let r = 0; r < SIZE && !changed; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (grid[r][c] !== before[r][c]) { changed = true; break; }
      }
    }

    if (!changed) return false; // 无效移动：不生成新方块、不加分

    // 累计得分
    score += gainedTotal;
    showScoreAddition(gainedTotal);

    // 移动后补充一个新方块
    const newTile = addRandomTile();

    render(newTile ? [newTile] : [], mergePositions);
    checkGameState();
    return true;
  }

  /* ==================== 胜负判定 ==================== */

  // 只要存在空格，或存在任意一对相邻同值方块，就还能继续
  function canMove() {
    if (emptyCells().length > 0) return true;
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const v = grid[r][c];
        if (c + 1 < SIZE && grid[r][c + 1] === v) return true;
        if (r + 1 < SIZE && grid[r + 1][c] === v) return true;
      }
    }
    return false;
  }

  // 检查是否胜利 / 失败，并弹出相应遮罩
  function checkGameState() {
    // 胜利：首次达到 2048（选择继续后不再弹出）
    if (!won && !keepPlaying) {
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (grid[r][c] >= WIN_VALUE) {
            won = true;
            showOverlay("win");
            return;
          }
        }
      }
    }

    // 失败：棋盘满且无法合并
    if (!canMove()) {
      over = true;
      showOverlay("lose");
    }
  }

  function showOverlay(type) {
    if (type === "win") {
      overlay.classList.add("win");
      overlay.classList.remove("lose");
      ovTitle.textContent = "🎉 你赢了！";
      ovPrimary.textContent = "继续挑战";
      ovPrimary.style.display = "";
    } else {
      overlay.classList.add("lose");
      overlay.classList.remove("win");
      ovTitle.textContent = "游戏结束";
      ovPrimary.style.display = "none";
    }
    overlay.classList.add("show");
  }

  function hideOverlay() {
    overlay.classList.remove("show", "win", "lose");
  }

  /* ==================== 游戏开始 / 重置 ==================== */

  function newGame() {
    grid = emptyGrid();
    score = 0;
    won = false;
    keepPlaying = false;
    over = false;
    busy = false;
    hideOverlay();

    // 初始生成两个方块
    const a = addRandomTile();
    const b = addRandomTile();
    render([a, b].filter(Boolean), []);
  }

  function restart() {
    newGame();
  }

  /* ==================== 输入：键盘 ==================== */

  const KEY_MAP = {
    ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down",
    a: "left", d: "right", w: "up", s: "down",
    A: "left", D: "right", W: "up", S: "down"
  };

  function handleKey(e) {
    const dir = KEY_MAP[e.key];
    if (!dir) return;
    e.preventDefault(); // 阻止方向键滚动页面
    doMove(dir);
  }

  // 统一的移动入口：处理结束/胜利继续等状态
  function doMove(dir) {
    if (busy) return;
    if (over) return;
    if (overlay.classList.contains("show") && overlay.classList.contains("win") && !keepPlaying) {
      // 胜利遮罩显示中：等待玩家选择继续后再操作
      return;
    }
    move(dir);
  }

  /* ==================== 输入：触摸滑动 ==================== */

  const SWIPE_THRESHOLD = 24; // 最小滑动像素阈值，防止误触
  let touchStartX = 0, touchStartY = 0, touchActive = false;

  function onTouchStart(e) {
    if (e.touches.length !== 1) return; // 多指忽略
    touchActive = true;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }

  function onTouchMove(e) {
    // 阻止页面滚动/下拉刷新
    if (touchActive && e.cancelable) e.preventDefault();
  }

  function onTouchEnd(e) {
    if (!touchActive) return;
    touchActive = false;
    const t = e.changedTouches && e.changedTouches[0];
    if (!t) return;

    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    const absX = Math.abs(dx), absY = Math.abs(dy);

    // 未超过阈值：视为点击，忽略
    if (Math.max(absX, absY) < SWIPE_THRESHOLD) return;

    // 判断主轴方向
    let dir;
    if (absX > absY) dir = dx > 0 ? "right" : "left";
    else             dir = dy > 0 ? "down" : "up";

    doMove(dir);
  }

  /* ==================== 事件绑定 ==================== */

  document.addEventListener("keydown", handleKey);

  // 在棋盘区域监听触摸（passive:false 才能 preventDefault）
  boardWrap.addEventListener("touchstart", onTouchStart, { passive: true });
  boardWrap.addEventListener("touchmove",  onTouchMove,  { passive: false });
  boardWrap.addEventListener("touchend",   onTouchEnd,   { passive: false });

  // 阻断棋盘区域的右键与拖拽，避免干扰
  boardWrap.addEventListener("contextmenu", e => e.preventDefault());

  // 遮罩按钮
  ovPrimary.addEventListener("click", () => {
    if (overlay.classList.contains("win")) {
      // 选择继续挑战：关闭遮罩，保持当前局面
      keepPlaying = true;
      hideOverlay();
    }
  });
  ovSecondary.addEventListener("click", restart);
  newGameBtn.addEventListener("click", restart);

  /* ==================== 启动 ==================== */
  loadBest();
  newGame();

  // 供调试/自动化测试使用（不影响游戏本身）
  window.game2048 = {
    newGame, move, slideAndMerge, canMove, checkGameState,
    get grid() { return grid; },
    set grid(g) { grid = g; },
    get score() { return score; },
    set score(s) { score = s; },
    get over() { return over; },
    reset() { newGame(); }
  };
})();
</script>
