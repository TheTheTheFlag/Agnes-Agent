{% extends "base.html" %}

{% block title %}{% if post %}编辑{% else %}写文章{% endif %} - {{ config.BLOG_TITLE }}{% endblock %}

{% block content %}
<div class="editor-container">
    <h1>{% if post %}编辑文章{% else %}写新文章{% endif %}</h1>
    
    <form id="postForm" class="editor-form">
        <div class="form-group">
            <label for="title">标题</label>
            <input type="text" id="title" name="title" required value="{{ post.title if post else '' }}">
        </div>
        
        <div class="form-group">
            <label for="author">作者</label>
            <input type="text" id="author" name="author" required value="{{ post.author if post else '博主' }}">
        </div>
        
        <div class="form-group">
            <label for="tags">标签（用逗号分隔）</label>
            <input type="text" id="tags" name="tags" placeholder="Python, Flask, 教程" value="{{ post.tags|join(', ') if post else '' }}">
        </div>
        
        <div class="form-group">
            <label for="content">内容（支持Markdown）</label>
            <textarea id="content" name="content" rows="20" required>{{ post.content if post else '' }}</textarea>
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">保存</button>
            <a href="{{ url_for('blog.index') }}" class="btn">取消</a>
        </div>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
const form = document.getElementById('postForm');
const postId = '{{ post.id if post else "" }}';

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const tags = document.getElementById('tags').value
        .split(',')
        .map(t => t.trim())
        .filter(t => t);
    
    const data = {
        title: document.getElementById('title').value,
        author: document.getElementById('author').value,
        content: document.getElementById('content').value,
        tags: tags
    };
    
    try {
        const url = postId ? `/api/posts/${postId}` : '/api/posts';
        const method = postId ? 'PUT' : 'POST';
        
        const res = await fetch(url, {
            method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        
        if (res.ok) {
            window.location.href = postId 
                ? `/post/${postId}` 
                : '{{ url_for("blog.index") }}';
        }
    } catch (e) {
        alert('保存失败');
    }
});
</script>
{% endblock %}
