<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宝石消消乐</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            --gem0: #ff6b6b; --gem1: #4ecdc4; --gem2: #ffe66d;
            --gem3: #a8e6cf; --gem4: #fd79a8; --gem5: #74b9ff;
            --gem6: #fdcb6e;
        }
        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            overflow: hidden;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255,107,107,0.5);
            letter-spacing: 2px;
        }
        .stats-bar {
            display: flex;
            gap: 30px;
            margin-bottom: 12px;
            font-size: 1rem;
        }
        .stats-bar span { background: rgba(255,255,255,0.1); padding: 6px 18px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.15); }
        .stats-bar strong { color: var(--gem2); }
        #board {
            display: grid;
            gap: 4px;
            padding: 14px;
            background: rgba(255,255,255,0.07);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.12);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            position: relative;
        }
        .cell {
            width: 52px; height: 52px;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s, opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            user-select: none;
            position: relative;
        }
        .cell:hover { transform: scale(1.08); z-index: 2; }
        .cell.selected {
            transform: scale(1.12);
            box-shadow: 0 0 0 3px #fff, 0 0 18px rgba(255,255,255,0.6);
            z-index: 3;
        }
        .cell.matched {
            animation: pop 0.3s forwards;
        }
        .cell.falling {
            transition: transform 0.25s ease-in;
        }
        @keyframes pop {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.7; }
            100% { transform: scale(0); opacity: 0; }
        }
        @keyframes fall {
            0% { transform: translateY(-60px); opacity: 0.5; }
            60% { transform: translateY(8px); }
            100% { transform: translateY(0); opacity: 1; }
        }
        .btn {
            margin-top: 14px;
            padding: 10px 32px;
            font-size: 1rem;
            font-weight: 700;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            background: linear-gradient(135deg, #ff6b6b, #a855f7);
            color: #fff;
            box-shadow: 0 4px 16px rgba(168,85,247,0.4);
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(168,85,247,0.55); }
        .hint-text {
            margin-top: 8px;
            font-size: 0.85rem;
            color: rgba(255,255,255,0.5);
        }
        .combo-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--gem2);
            text-shadow: 0 0 30px rgba(255,230,109,0.8);
            pointer-events: none;
            animation: comboAnim 0.9s forwards;
            z-index: 100;
        }
        @keyframes comboAnim {
            0% { opacity: 1; transform: translate(-50%,-50%) scale(0.5); }
            50% { opacity: 1; transform: translate(-50%,-50%) scale(1.2); }
            100% { opacity: 0; transform: translate(-50%,-70%) scale(1); }
        }
        @media (max-width: 600px) {
            .cell { width: 40px; height: 40px; font-size: 20px; }
            #board { gap: 3px; padding: 10px; }
            h1 { font-size: 1.4rem; }
        }
    </style>
</head>
<body>
    <h1>💎 宝石消消乐</h1>
    <div class="stats-bar">
        <span>得分：<strong id="score">0</strong></span>
        <span>步数：<strong id="moves">0</strong></span>
        <span>连击：<strong id="combo">0</strong>x</span>
    </div>
    <div id="board"></div>
    <button class="btn" id="newBtn">🔄 新游戏</button>
    <p class="hint-text">点击相邻宝石交换，连成3个或以上即可消除</p>

    <script>
        const ROWS = 8, COLS = 8, NUM_GEMS = 6;
        const EMOJIS = ['🔴','🟢','🔵','🟡','🟣','⚪'];
        let board = [], selected = null, score = 0, moves = 0, combo = 0;
        let locked = false;

        const boardEl = document.getElementById('board');
        boardEl.style.gridTemplateColumns = `repeat(${COLS}, 52px)`;

        function rand(n) { return Math.floor(Math.random() * n); }
        function initBoard() {
            board = [];
            for (let r = 0; r < ROWS; r++) {
                board[r] = [];
                for (let c = 0; c < COLS; c++) {
                    let gem;
                    do { gem = rand(NUM_GEMS); }
                    while ((c >= 2 && board[r][c-1] === gem && board[r][c-2] === gem)
                        || (r >= 2 && board[r-1][c] === gem && board[r-2][c] === gem));
                    board[r][c] = gem;
                }
            }
        }

        function render(animate = false) {
            boardEl.innerHTML = '';
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.r = r;
                    cell.dataset.c = c;
                    if (board[r][c] !== -1) {
                        cell.textContent = EMOJIS[board[r][c]];
                    }
                    if (animate && board[r][c] !== -1) {
                        cell.style.animation = `fall ${0.2 + r * 0.04}s ease-out forwards`;
                    }
                    cell.addEventListener('click', () => onCellClick(r, c));
                    boardEl.appendChild(cell);
                }
            }
        }

        function getCell(r, c) { return boardEl.children[r * COLS + c]; }

        function onCellClick(r, c) {
            if (locked) return;
            if (selected === null) {
                selected = {r, c};
                getCell(r, c).classList.add('selected');
            } else {
                const dr = Math.abs(selected.r - r), dc = Math.abs(selected.c - c);
                if ((dr === 1 && dc === 0) || (dr === 0 && dc === 1)) {
                    getCell(selected.r, selected.c).classList.remove('selected');
                    trySwap(selected.r, selected.c, r, c);
                } else {
                    getCell(selected.r, selected.c).classList.remove('selected');
                    if (r !== selected.r || c !== selected.c) {
                        selected = {r, c};
                        getCell(r, c).classList.add('selected');
                    } else {
                        selected = null;
                    }
                }
            }
        }

        async function trySwap(r1, c1, r2, c2) {
            locked = true;
            swap(r1, c1, r2, c2);
            render();
            const matches = findMatches();
            if (matches.length > 0) {
                moves++;
                document.getElementById('moves').textContent = moves;
                await cascade(matches);
            } else {
                // 还原
                swap(r1, c1, r2, c2);
                render();
                getCell(r2, c2).classList.add('selected');
                setTimeout(() => getCell(r2, c2).classList.remove('selected'), 200);
                selected = null;
                locked = false;
            }
        }

        function swap(r1, c1, r2, c2) {
            [board[r1][c1], board[r2][c2]] = [board[r2][c2], board[r1][c1]];
        }

        function findMatches() {
            const matched = new Set();
            // 横向
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c <= COLS - 3; c++) {
                    if (board[r][c] !== -1 && board[r][c] === board[r][c+1] && board[r][c] === board[r][c+2]) {
                        let end = c + 2;
                        while (end + 1 < COLS && board[r][end+1] === board[r][c]) end++;
                        for (let i = c; i <= end; i++) matched.add(r * COLS + i);
                    }
                }
            }
            // 纵向
            for (let c = 0; c < COLS; c++) {
                for (let r = 0; r <= ROWS - 3; r++) {
                    if (board[r][c] !== -1 && board[r][c] === board[r+1][c] && board[r][c] === board[r+2][c]) {
                        let end = r + 2;
                        while (end + 1 < ROWS && board[end+1][c] === board[r][c]) end++;
                        for (let i = r; i <= end; i++) matched.add(i * COLS + c);
                    }
                }
            }
            return [...matched].map(v => ({r: Math.floor(v/COLS), c: v%COLS}));
        }

        async function cascade(matches) {
            combo++;
            document.getElementById('combo').textContent = combo;
            if (combo > 1) showCombo(combo);
            const pts = matches.length * 10 * combo;
            score += pts;
            document.getElementById('score').textContent = score;

            // 消除动画
            matches.forEach(({r,c}) => {
                getCell(r,c).classList.add('matched');
                board[r][c] = -1;
            });
            await sleep(300);

            // 下落
            for (let c = 0; c < COLS; c++) {
                let write = ROWS - 1;
                for (let r = ROWS - 1; r >= 0; r--) {
                    if (board[r][c] !== -1) {
                        board[write][c] = board[r][c];
                        if (write !== r) board[r][c] = -1;
                        write--;
                    }
                }
                for (let r = write; r >= 0; r--) {
                    board[r][c] = rand(NUM_GEMS);
                }
            }
            render(true);
            await sleep(300);

            const newMatches = findMatches();
            if (newMatches.length > 0) {
                await cascade(newMatches);
            } else {
                combo = 0;
                document.getElementById('combo').textContent = 0;
                selected = null;
                locked = false;
                if (!hasValidMoves()) showHint();
            }
        }

        function hasValidMoves() {
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (c + 1 < COLS) {
                        swap(r,c,r,c+1);
                        if (findMatches().length > 0) { swap(r,c,r,c+1); return true; }
                        swap(r,c,r,c+1);
                    }
                    if (r + 1 < ROWS) {
                        swap(r,c,r+1,c);
                        if (findMatches().length > 0) { swap(r,c,r+1,c); return true; }
                        swap(r,c,r+1,c);
                    }
                }
            }
            return false;
        }

        function showCombo(n) {
            const el = document.createElement('div');
            el.className = 'combo-popup';
            el.textContent = `${n}x 连击！`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 900);
        }

        function showHint() {
            // 高亮一个可行移动
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (c + 1 < COLS) {
                        swap(r,c,r,c+1);
                        if (findMatches().length > 0) {
                            getCell(r,c).style.boxShadow = '0 0 12px 4px #ffd166';
                            getCell(r,c+1).style.boxShadow = '0 0 12px 4px #ffd166';
                            setTimeout(() => {
                                getCell(r,c).style.boxShadow = '';
                                getCell(r,c+1).style.boxShadow = '';
                            }, 1500);
                            swap(r,c,r,c+1);
                            return;
                        }
                        swap(r,c,r,c+1);
                    }
                }
            }
        }

        function newGame() {
            score = 0; moves = 0; combo = 0;
            document.getElementById('score').textContent = 0;
            document.getElementById('moves').textContent = 0;
            document.getElementById('combo').textContent = 0;
            selected = null; locked = false;
            initBoard();
            render();
        }

        function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

        document.getElementById('newBtn').addEventListener('click', newGame);
        newGame();
    </script>
</body>
</html>
