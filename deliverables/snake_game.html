<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇游戏</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        .bg-particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .particle { position: absolute; width: 4px; height: 4px; background: rgba(255,255,255,0.3); border-radius: 50%; animation: float 15s infinite; }
        @keyframes float {
            0%, 100% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
        }
        .game-container {
            text-align: center;
            background: rgba(255,255,255,0.05);
            padding: 30px;
            border-radius: 25px;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
            position: relative;
            z-index: 1;
            border: 1px solid rgba(255,255,255,0.1);
        }
        h1 { color: #fff; margin-bottom: 15px; font-size: 2.8em; text-shadow: 0 0 20px rgba(102,126,234,0.8), 2px 2px 4px rgba(0,0,0,0.3); letter-spacing: 3px; }
        h1 span { color: #4ecdc4; }
        
        /* 开始界面 */
        .start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.88); border-radius: 25px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 10; transition: opacity 0.5s ease;
        }
        .start-screen.hidden { opacity: 0; pointer-events: none; }
        .start-screen h2 { color: #4ecdc4; font-size: 2.2em; margin-bottom: 25px; text-shadow: 0 0 15px rgba(78,205,196,0.6); }
        .instructions { color: rgba(255,255,255,0.85); font-size: 1em; line-height: 2.2; margin-bottom: 30px; text-align: left; padding: 0 20px; }
        .instructions p { margin: 6px 0; }
        .key-hint {
            display: inline-block; background: linear-gradient(145deg,rgba(255,255,255,0.2),rgba(255,255,255,0.1));
            padding: 5px 14px; border-radius: 8px; margin: 0 4px; font-weight: bold;
            color: #4ecdc4; border: 1px solid rgba(78,205,196,0.3); font-size: 0.9em;
        }
        
        /* 分数板 */
        .score-board { display: flex; justify-content: space-around; margin-bottom: 20px; gap: 15px; }
        .score-item {
            background: linear-gradient(145deg, rgba(255,255,255,0.12), rgba(255,255,255,0.05));
            padding: 14px 25px; border-radius: 15px; color: #fff; font-size: 1.1em;
            border: 1px solid rgba(255,255,255,0.1); min-width: 120px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .score-item .label { color: rgba(255,255,255,0.6); font-size: 0.8em; display: block; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px; }
        .score-item .value { font-size: 1.6em; font-weight: bold; color: #4ecdc4; text-shadow: 0 0 10px rgba(78,205,196,0.5); }
        .score-item.high-score .value { color: #ffd93d; text-shadow: 0 0 10px rgba(255,217,61,0.5); }
        
        /* 画布 */
        canvas {
            border: 3px solid rgba(255,255,255,0.2); border-radius: 15px;
            background: #0a0a14;
            box-shadow: 0 0 40px rgba(78,205,196,0.15), inset 0 0 60px rgba(0,0,0,0.5);
            display: block; margin: 0 auto;
        }
        
        /* 按钮 */
        .controls { margin-top: 20px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff; border: none; padding: 14px 32px; font-size: 1.1em;
            border-radius: 30px; cursor: pointer; transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102,126,234,0.4); font-weight: 600; letter-spacing: 1px;
        }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(102,126,234,0.6); }
        .btn:active { transform: translateY(0); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
        .btn.primary { background: linear-gradient(135deg, #4ecdc4 0%, #44a08d 100%); box-shadow: 0 4px 15px rgba(78,205,196,0.4); }
        .btn.primary:hover { box-shadow: 0 8px 25px rgba(78,205,196,0.6); }
        
        /* 暂停覆盖层 */
        .pause-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
            background: rgba(0,0,0,0.85); color: #fff; padding: 35px 55px;
            border-radius: 20px; font-size: 2.2em; font-weight: bold;
            display: none; z-index: 5; border: 2px solid rgba(78,205,196,0.5);
            box-shadow: 0 0 40px rgba(78,205,196,0.3); animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0%,100% { box-shadow: 0 0 30px rgba(78,205,196,0.3); } 50% { box-shadow: 0 0 50px rgba(78,205,196,0.6); } }
        
        /* 游戏结束界面 */
        .game-over {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92); border-radius: 25px;
            display: none; flex-direction: column; justify-content: center; align-items: center;
            z-index: 10; animation: fadeIn 0.5s ease;
        }
        .game-over.show { display: flex; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .game-over h2 { font-size: 2.8em; margin-bottom: 8px; color: #ff6b6b; text-shadow: 0 0 25px rgba(255,107,107,0.7); animation: shake 0.5s ease; }
        @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-12px); } 75% { transform: translateX(12px); } }
        .game-over .emoji { font-size: 4em; margin-bottom: 10px; }
        .score-display { margin: 15px 0; padding: 20px 45px; background: rgba(255,255,255,0.08); border-radius: 15px; border: 1px solid rgba(255,255,255,0.15); }
        .score-display .label { color: rgba(255,255,255,0.6); font-size: 0.9em; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 2px; }
        .score-display .final-score { font-size: 3.2em; font-weight: bold; color: #ffd93d; text-shadow: 0 0 20px rgba(255,217,61,0.6); }
        .new-record { color: #4ecdc4; font-size: 1.3em; margin-bottom: 10px; animation: blink 1s infinite; font-weight: bold; }
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
        .stats { color: rgba(255,255,255,0.6); margin-bottom: 25px; font-size: 0.95em; }
        
        .hint { margin-top: 15px; font-size: 0.85em; color: rgba(255,255,255,0.5); }
        
        .mobile-controls { display: none; margin-top: 20px; }
        @media (max-width: 600px) {
            .mobile-controls { display: grid; grid-template-columns: repeat(3,60px); grid-template-rows: repeat(3,60px); justify-content: center; margin-top: 15px; }
            .mobile-controls .btn { padding: 15px; font-size: 1.5em; margin: 0; }
            .mobile-controls .up { grid-column: 2; grid-row: 1; }
            .mobile-controls .left { grid-column: 1; grid-row: 2; }
            .mobile-controls .right { grid-column: 3; grid-row: 2; }
            .mobile-controls .down { grid-column: 2; grid-row: 3; }
        }
    </style>
</head>
<body>
    <div class="bg-particles" id="particles"></div>
    
    <div class="game-container">
        <h1>🐍 贪吃蛇<span>游戏</span></h1>
        
        <!-- 开始界面 -->
        <div class="start-screen" id="startScreen">
            <h2>🎮 准备好了吗？</h2>
            <div class="instructions">
                <p>🎯 <span class="key-hint">↑</span><span class="key-hint">↓</span><span class="key-hint">←</span><span class="key-hint">→</span> 或 <span class="key-hint">W</span><span class="key-hint">A</span><span class="key-hint">S</span><span class="key-hint">D</span> 控制方向</p>
                <p>⏸️ <span class="key-hint">空格</span> 暂停 / 继续</p>
                <p style="margin-top:15px; color:#4ecdc4; text-align:center;">🍎 吃食物得分 · ⚡ 速度会逐渐加快</p>
                <p style="color:#ff6b6b; text-align:center;">⚠️ 别撞墙！也别咬到自己！</p>
            </div>
            <button class="btn primary" id="startBtn" style="font-size:1.3em; padding:16px 50px;">🚀 开始游戏</button>
        </div>
        
        <!-- 分数板 -->
        <div class="score-board">
            <div class="score-item">
                <span class="label">当前得分</span>
                <span class="value" id="score">0</span>
            </div>
            <div class="score-item high-score">
                <span class="label">最高记录</span>
                <span class="value" id="highScore">0</span>
            </div>
        </div>
        
        <!-- 游戏画布 -->
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        
        <!-- 控制按钮 -->
        <div class="controls">
            <button class="btn primary" id="startBtn2">🚀 开始</button>
            <button class="btn" id="pauseBtn" disabled>⏸ 暂停</button>
        </div>
        
        <!-- 移动端控制 -->
        <div class="mobile-controls">
            <button class="btn up" id="btnUp">↑</button>
            <button class="btn left" id="btnLeft">←</button>
            <button class="btn right" id="btnRight">→</button>
            <button class="btn down" id="btnDown">↓</button>
        </div>
        
        <div class="hint">按空格键暂停 | 方向键控制移动</div>
        
        <!-- 暂停覆盖层 -->
        <div class="pause-overlay" id="pauseOverlay">⏸ 已暂停</div>
        
        <!-- 游戏结束界面 -->
        <div class="game-over" id="gameOver">
            <div class="emoji">💀</div>
            <h2>游戏结束!</h2>
            <div class="new-record" id="newRecord" style="display:none;">🎉 新纪录！</div>
            <div class="score-display">
                <div class="label">最终得分</div>
                <div class="final-score" id="finalScore">0</div>
            </div>
            <div class="stats" id="stats"></div>
            <button class="btn primary" id="restartBtn" style="font-size:1.2em; padding:16px 50px;">🔄 再来一局</button>
        </div>
    </div>

    <script>
        // ===== 背景粒子 =====
        (function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.animationDelay = Math.random() * 15 + 's';
                p.style.animationDuration = (10 + Math.random() * 10) + 's';
                container.appendChild(p);
            }
        })();

        // ===== 游戏配置 =====
        const CANVAS_SIZE = 400;
        const GRID_SIZE = 20;
        const CELL_SIZE = CANVAS_SIZE / GRID_SIZE;
        const BASE_SPEED = 150;
        const MIN_SPEED = 60;
        const SPEED_INCREMENT = 3; // 每吃一个食物速度加快

        // ===== 游戏状态 =====
        let snake = [];
        let food = null;
        let direction = 'right';
        let nextDirection = 'right';
        let score = 0;
        let highScore = parseInt(localStorage.getItem('snakeHighScore')) || 0;
        let gameRunning = false;
        let gamePaused = false;
        let gameLoop = null;
        let foodsEaten = 0;
        let currentSpeed = BASE_SPEED;

        // ===== DOM 元素 =====
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('highScore');
        const startBtn = document.getElementById('startBtn');
        const startBtn2 = document.getElementById('startBtn2');
        const pauseBtn = document.getElementById('pauseBtn');
        const gameOverDiv = document.getElementById('gameOver');
        const finalScoreElement = document.getElementById('finalScore');
        const newRecordEl = document.getElementById('newRecord');
        const statsEl = document.getElementById('stats');
        const restartBtn = document.getElementById('restartBtn');
        const pauseOverlay = document.getElementById('pauseOverlay');
        const startScreen = document.getElementById('startScreen');

        highScoreElement.textContent = highScore;

        // ===== 初始化游戏 =====
        function initGame() {
            snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
            direction = 'right';
            nextDirection = 'right';
            score = 0;
            foodsEaten = 0;
            currentSpeed = BASE_SPEED;
            scoreElement.textContent = score;
            spawnFood();
            draw();
        }

        // ===== 生成食物 =====
        function spawnFood() {
            let newFood;
            do {
                newFood = {
                    x: Math.floor(Math.random() * GRID_SIZE),
                    y: Math.floor(Math.random() * GRID_SIZE)
                };
            } while (isSnakeAt(newFood.x, newFood.y));
            food = newFood;
        }

        // ===== 检查蛇位置 =====
        function isSnakeAt(x, y) {
            return snake.some(s => s.x === x && s.y === y);
        }

        // ===== 移动蛇 =====
        function moveSnake() {
            direction = nextDirection;
            const head = { ...snake[0] };
            switch (direction) {
                case 'up': head.y -= 1; break;
                case 'down': head.y += 1; break;
                case 'left': head.x -= 1; break;
                case 'right': head.x += 1; break;
            }
            if (checkCollision(head)) {
                gameOver();
                return;
            }
            snake.unshift(head);
            if (food && head.x === food.x && head.y === food.y) {
                score += 10;
                foodsEaten++;
                scoreElement.textContent = score;
                // 加速
                currentSpeed = Math.max(MIN_SPEED, BASE_SPEED - foodsEaten * SPEED_INCREMENT);
                if (gameLoop) clearInterval(gameLoop);
                gameLoop = setInterval(gameStep, currentSpeed);
                spawnFood();
            } else {
                snake.pop();
            }
        }

        // ===== 碰撞检测 =====
        function checkCollision(head) {
            if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) return true;
            for (let i = 0; i < snake.length; i++) {
                if (snake[i].x === head.x && snake[i].y === head.y) return true;
            }
            return false;
        }

        // ===== 绘制游戏 =====
        function draw() {
            // 背景
            ctx.fillStyle = '#0a0a14';
            ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
            
            // 网格
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.06)';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= GRID_SIZE; i++) {
                ctx.beginPath(); ctx.moveTo(i * CELL_SIZE, 0); ctx.lineTo(i * CELL_SIZE, CANVAS_SIZE); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i * CELL_SIZE); ctx.lineTo(CANVAS_SIZE, i * CELL_SIZE); ctx.stroke();
            }
            
            // 蛇身
            snake.forEach((segment, index) => {
                const x = segment.x * CELL_SIZE;
                const y = segment.y * CELL_SIZE;
                const gradient = ctx.createRadialGradient(x + CELL_SIZE/2, y + CELL_SIZE/2, 0, x + CELL_SIZE/2, y + CELL_SIZE/2, CELL_SIZE/2);
                if (index === 0) {
                    gradient.addColorStop(0, '#4ecdc4');
                    gradient.addColorStop(1, '#44a08d');
                } else {
                    const opacity = Math.max(0.5, 1 - (index / snake.length) * 0.5);
                    gradient.addColorStop(0, `rgba(108, 92, 231, ${opacity})`);
                    gradient.addColorStop(1, `rgba(162, 155, 254, ${opacity})`);
                }
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.roundRect(x + 1, y + 1, CELL_SIZE - 2, CELL_SIZE - 2, 5);
                ctx.fill();
                
                // 蛇头眼睛
                if (index === 0) {
                    ctx.fillStyle = '#fff';
                    let eye1X, eye1Y, eye2X, eye2Y;
                    const eyeSize = 3;
                    switch (direction) {
                        case 'right': eye1X = x+CELL_SIZE*0.7; eye1Y = y+CELL_SIZE*0.3; eye2X = x+CELL_SIZE*0.7; eye2Y = y+CELL_SIZE*0.7; break;
                        case 'left': eye1X = x+CELL_SIZE*0.3; eye1Y = y+CELL_SIZE*0.3; eye2X = x+CELL_SIZE*0.3; eye2Y = y+CELL_SIZE*0.7; break;
                        case 'up': eye1X = x+CELL_SIZE*0.3; eye1Y = y+CELL_SIZE*0.3; eye2X = x+CELL_SIZE*0.7; eye2Y = y+CELL_SIZE*0.3; break;
                        case 'down': eye1X = x+CELL_SIZE*0.3; eye1Y = y+CELL_SIZE*0.7; eye2X = x+CELL_SIZE*0.7; eye2Y = y+CELL_SIZE*0.7; break;
                    }
                    ctx.beginPath(); ctx.arc(eye1X, eye1Y, eyeSize, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(eye2X, eye2Y, eyeSize, 0, Math.PI*2); ctx.fill();
                }
            });
            
            // 食物（苹果）
            if (food) {
                const x = food.x * CELL_SIZE;
                const y = food.y * CELL_SIZE;
                const centerX = x + CELL_SIZE/2;
                const centerY = y + CELL_SIZE/2;
                const foodGradient = ctx.createRadialGradient(centerX-3, centerY-3, 0, centerX, centerY, CELL_SIZE/2 - 2);
                foodGradient.addColorStop(0, '#ff8a80');
                foodGradient.addColorStop(1, '#ee5a5a');
                ctx.fillStyle = foodGradient;
                ctx.beginPath();
                ctx.arc(centerX, centerY, CELL_SIZE/2 - 2, 0, Math.PI*2);
                ctx.fill();
                // 高光
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.beginPath();
                ctx.arc(centerX - 3, centerY - 3, 3, 0, Math.PI*2);
                ctx.fill();
                // 叶子
                ctx.fillStyle = '#4caf50';
                ctx.beginPath();
                ctx.ellipse(centerX + 2, centerY - CELL_SIZE/2 + 4, 4, 2, Math.PI/4, 0, Math.PI*2);
                ctx.fill();
            }
        }

        // ===== 游戏步进 =====
        function gameStep() {
            if (!gameRunning || gamePaused) return;
            moveSnake();
            draw();
        }

        // ===== 开始游戏 =====
        function startGame() {
            if (gameRunning) return;
            gameRunning = true;
            gamePaused = false;
            initGame();
            startScreen.classList.add('hidden');
            gameOverDiv.classList.remove('show');
            pauseOverlay.style.display = 'none';
            gameLoop = setInterval(gameStep, currentSpeed);
            startBtn2.disabled = true;
            pauseBtn.disabled = false;
            pauseBtn.textContent = '⏸ 暂停';
        }

        // ===== 暂停/继续 =====
        function togglePause() {
            if (!gameRunning) return;
            gamePaused = !gamePaused;
            if (gamePaused) {
                clearInterval(gameLoop);
                pauseBtn.textContent = '▶ 继续';
                pauseOverlay.style.display = 'block';
            } else {
                gameLoop = setInterval(gameStep, currentSpeed);
                pauseBtn.textContent = '⏸ 暂停';
                pauseOverlay.style.display = 'none';
            }
        }

        // ===== 游戏结束 =====
        function gameOver() {
            gameRunning = false;
            clearInterval(gameLoop);
            let isNewRecord = false;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
                highScoreElement.textContent = highScore;
                isNewRecord = true;
            }
            finalScoreElement.textContent = score;
            newRecordEl.style.display = isNewRecord ? 'block' : 'none';
            statsEl.textContent = `吃到 ${foodsEaten} 个食物 | 蛇长 ${snake.length} 格`;
            gameOverDiv.classList.add('show');
            startBtn2.disabled = false;
            pauseBtn.disabled = true;
        }

        // ===== 键盘控制 =====
        document.addEventListener('keydown', (e) => {
            // 阻止滚动
            if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) {
                e.preventDefault();
            }
            // 空格暂停
            if (e.key === ' ') {
                if (gameRunning) togglePause();
                return;
            }
            // 方向键/WASD 控制
            const keyMap = {
                'ArrowUp': 'up', 'w': 'up', 'W': 'up',
                'ArrowDown': 'down', 's': 'down', 'S': 'down',
                'ArrowLeft': 'left', 'a': 'left', 'A': 'left',
                'ArrowRight': 'right', 'd': 'right', 'D': 'right'
            };
            if (keyMap[e.key]) {
                const newDir = keyMap[e.key];
                // 游戏未开始时，按方向键开始
                if (!gameRunning) {
                    startGame();
                }
                // 防止180度转向
                const opposites = { up: 'down', down: 'up', left: 'right', right: 'left' };
                if (opposites[newDir] !== direction) {
                    nextDirection = newDir;
                }
            }
        });

        // ===== 按钮事件 =====
        startBtn.addEventListener('click', startGame);
        startBtn2.addEventListener('click', startGame);
        pauseBtn.addEventListener('click', togglePause);
        restartBtn.addEventListener('click', () => {
            gameOverDiv.classList.remove('show');
            startGame();
        });

        // ===== 移动端按钮 =====
        document.getElementById('btnUp').addEventListener('click', () => handleMobileDir('up'));
        document.getElementById('btnDown').addEventListener('click', () => handleMobileDir('down'));
        document.getElementById('btnLeft').addEventListener('click', () => handleMobileDir('left'));
        document.getElementById('btnRight').addEventListener('click', () => handleMobileDir('right'));

        function handleMobileDir(dir) {
            if (!gameRunning) {
                startGame();
                return;
            }
            const opposites = { up: 'down', down: 'up', left: 'right', right: 'left' };
            if (opposites[dir] !== direction) {
                nextDirection = dir;
            }
        }

        // ===== 初始化 =====
        initGame();
    </script>
</body>
</html>
