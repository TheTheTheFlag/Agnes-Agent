<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇小游戏</title>
    <style>
        /* ============ 全局重置 ============ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        /* ============ 主体背景（深色渐变 + 动态光斑） ============ */
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
            background:
                radial-gradient(circle at 20% 20%, rgba(120, 80, 220, 0.35) 0%, transparent 45%),
                radial-gradient(circle at 80% 30%, rgba(255, 100, 150, 0.25) 0%, transparent 45%),
                radial-gradient(circle at 50% 80%, rgba(80, 200, 255, 0.25) 0%, transparent 45%),
                linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #e2e8f0;
            padding: 20px;
            user-select: none;
            -webkit-user-select: none;
        }

        /* ============ 顶部标题 ============ */
        .title {
            font-size: 42px;
            font-weight: 700;
            background: linear-gradient(90deg, #a78bfa, #f472b6, #38bdf8);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 4px;
            margin-bottom: 6px;
            text-shadow: 0 0 30px rgba(167, 139, 250, 0.3);
            animation: titleGlow 3s ease-in-out infinite alternate;
        }

        @keyframes titleGlow {
            from { filter: drop-shadow(0 0 8px rgba(167, 139, 250, 0.4)); }
            to   { filter: drop-shadow(0 0 20px rgba(244, 114, 182, 0.6)); }
        }

        .subtitle {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 22px;
            letter-spacing: 1.5px;
        }

        /* ============ 游戏容器 ============ */
        .game-container {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(148, 163, 184, 0.15);
            border-radius: 20px;
            padding: 24px;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }

        /* ============ 信息栏（分数/最高分/状态） ============ */
        .info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            gap: 18px;
            flex-wrap: wrap;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 90px;
            padding: 8px 14px;
            background: rgba(30, 41, 59, 0.6);
            border-radius: 12px;
            border: 1px solid rgba(148, 163, 184, 0.1);
        }

        .info-item .label {
            font-size: 11px;
            color: #94a3b8;
            letter-spacing: 1.5px;
            margin-bottom: 2px;
        }

        .info-item .value {
            font-size: 22px;
            font-weight: 700;
            color: #f8fafc;
            font-family: 'Consolas', 'Monaco', monospace;
        }

        .info-item.score .value  { color: #fbbf24; }
        .info-item.best  .value  { color: #34d399; }
        .info-item.speed .value  { color: #38bdf8; }
        .info-item.status .value { color: #a78bfa; font-size: 16px; }

        /* ============ 画布 ============ */
        .canvas-wrap {
            position: relative;
            border-radius: 14px;
            overflow: hidden;
            box-shadow:
                0 0 0 1px rgba(148, 163, 184, 0.2),
                0 10px 40px rgba(0, 0, 0, 0.4);
        }

        #gameCanvas {
            display: block;
            background: #0b1220;
            background-image:
                linear-gradient(rgba(148, 163, 184, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(148, 163, 184, 0.06) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* ============ 控制按钮 ============ */
        .controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 18px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 22px;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
            font-family: inherit;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        .btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-start   { background: linear-gradient(135deg, #10b981, #059669); }
        .btn-pause   { background: linear-gradient(135deg, #f59e0b, #d97706); }
        .btn-reset   { background: linear-gradient(135deg, #ef4444, #dc2626); }
        .btn-easy    { background: linear-gradient(135deg, #38bdf8, #0284c7); }
        .btn-medium  { background: linear-gradient(135deg, #a78bfa, #7c3aed); }
        .btn-hard    { background: linear-gradient(135deg, #f472b6, #db2777); }

        .btn-active {
            outline: 3px solid #fff;
            outline-offset: 2px;
        }

        /* ============ 操作提示 ============ */
        .tips {
            margin-top: 16px;
            text-align: center;
            font-size: 12px;
            color: #94a3b8;
            line-height: 1.8;
        }

        .tips kbd {
            display: inline-block;
            padding: 2px 8px;
            margin: 0 2px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 11px;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.3);
            border-radius: 4px;
            color: #e2e8f0;
            box-shadow: 0 1px 0 rgba(148, 163, 184, 0.2);
        }

        /* ============ 移动端方向键 ============ */
        .mobile-pad {
            display: none;
            margin-top: 18px;
            grid-template-columns: 60px 60px 60px;
            grid-template-rows: 60px 60px 60px;
            gap: 6px;
            justify-content: center;
        }

        .pad-btn {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 10px;
            color: #e2e8f0;
            font-size: 22px;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pad-btn:active {
            background: rgba(99, 102, 241, 0.5);
            transform: scale(0.95);
        }

        .pad-up    { grid-column: 2; grid-row: 1; }
        .pad-left  { grid-column: 1; grid-row: 2; }
        .pad-down  { grid-column: 2; grid-row: 3; }
        .pad-right { grid-column: 3; grid-row: 2; }

        @media (max-width: 640px) {
            .mobile-pad { display: grid; }
            .title { font-size: 32px; }
        }

        /* ============ 弹窗（游戏结束 / 暂停） ============ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: linear-gradient(135deg, #1e1b4b, #0f172a);
            border: 1px solid rgba(167, 139, 250, 0.4);
            border-radius: 18px;
            padding: 36px 44px;
            text-align: center;
            min-width: 320px;
            max-width: 90vw;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.6),
                0 0 40px rgba(167, 139, 250, 0.3);
            transform: scale(0.85);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .modal-overlay.show .modal {
            transform: scale(1);
        }

        .modal-icon {
            font-size: 60px;
            margin-bottom: 8px;
        }

        .modal-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
            background: linear-gradient(90deg, #f472b6, #a78bfa);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .modal-score {
            font-size: 16px;
            color: #cbd5e1;
            margin-bottom: 6px;
        }

        .modal-score strong {
            color: #fbbf24;
            font-size: 24px;
            font-family: 'Consolas', monospace;
        }

        .modal-best {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 24px;
        }

        .modal-best.new {
            color: #34d399;
            font-weight: 700;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <h1 class="title">🐍 贪吃蛇</h1>
    <div class="subtitle">CLASSIC SNAKE GAME</div>

    <div class="game-container">
        <!-- 信息栏 -->
        <div class="info-bar">
            <div class="info-item score">
                <span class="label">SCORE</span>
                <span class="value" id="score">0</span>
            </div>
            <div class="info-item best">
                <span class="label">BEST</span>
                <span class="value" id="best">0</span>
            </div>
            <div class="info-item speed">
                <span class="label">SPEED</span>
                <span class="value" id="speedLabel">普通</span>
            </div>
            <div class="info-item status">
                <span class="label">STATUS</span>
                <span class="value" id="status">未开始</span>
            </div>
        </div>

        <!-- 画布 -->
        <div class="canvas-wrap">
            <canvas id="gameCanvas" width="600" height="600"></canvas>
        </div>

        <!-- 难度选择 -->
        <div class="controls">
            <button class="btn btn-easy"   data-speed="180" data-label="简单">简单</button>
            <button class="btn btn-medium btn-active" data-speed="120" data-label="普通">普通</button>
            <button class="btn btn-hard"   data-speed="70"  data-label="困难">困难</button>
        </div>

        <!-- 主控制 -->
        <div class="controls">
            <button class="btn btn-start" id="btnStart">▶ 开始</button>
            <button class="btn btn-pause" id="btnPause" disabled>⏸ 暂停</button>
            <button class="btn btn-reset" id="btnReset">🔄 重玩</button>
        </div>

        <!-- 操作提示 -->
        <div class="tips">
            使用 <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> 或 <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> 控制方向 ·
            <kbd>空格</kbd> 暂停/继续 · <kbd>R</kbd> 重新开始
        </div>

        <!-- 移动端方向键 -->
        <div class="mobile-pad">
            <button class="pad-btn pad-up"    data-dir="up">▲</button>
            <button class="pad-btn pad-left"  data-dir="left">◀</button>
            <button class="pad-btn pad-down"  data-dir="down">▼</button>
            <button class="pad-btn pad-right" data-dir="right">▶</button>
        </div>
    </div>

    <!-- 弹窗 -->
    <div class="modal-overlay" id="modal">
        <div class="modal">
            <div class="modal-icon" id="modalIcon">💀</div>
            <div class="modal-title" id="modalTitle">游戏结束</div>
            <div class="modal-score">本局得分：<strong id="modalScore">0</strong></div>
            <div class="modal-best" id="modalBest">历史最高：0</div>
            <div class="modal-buttons">
                <button class="btn btn-start" id="modalRestart">🔄 再来一局</button>
                <button class="btn btn-pause" id="modalClose">关闭</button>
            </div>
        </div>
    </div>

    <script>
    (function() {
        'use strict';

        // ==================== 配置 ====================
        const GRID_SIZE = 20;            // 网格大小（像素）
        const GRID_COUNT = 30;           // 网格数量（30 x 30）
        const CANVAS_SIZE = GRID_SIZE * GRID_COUNT;

        // ==================== DOM ====================
        const canvas       = document.getElementById('gameCanvas');
        const ctx          = canvas.getContext('2d');
        const scoreEl      = document.getElementById('score');
        const bestEl       = document.getElementById('best');
        const speedLabelEl = document.getElementById('speedLabel');
        const statusEl     = document.getElementById('status');
        const btnStart     = document.getElementById('btnStart');
        const btnPause     = document.getElementById('btnPause');
        const btnReset     = document.getElementById('btnReset');
        const modal        = document.getElementById('modal');
        const modalIcon    = document.getElementById('modalIcon');
        const modalTitle   = document.getElementById('modalTitle');
        const modalScore   = document.getElementById('modalScore');
        const modalBest    = document.getElementById('modalBest');
        const modalRestart = document.getElementById('modalRestart');
        const modalClose   = document.getElementById('modalClose');

        canvas.width  = CANVAS_SIZE;
        canvas.height = CANVAS_SIZE;

        // ==================== 游戏状态 ====================
        const STATE = {
            IDLE:    'idle',
            RUNNING: 'running',
            PAUSED:  'paused',
            OVER:    'over'
        };

        const game = {
            snake: [],          // [{x, y}, ...] 头部在 [0]
            direction: { x: 1, y: 0 },
            nextDirection: { x: 1, y: 0 },
            food: { x: 0, y: 0 },
            score: 0,
            best: parseInt(localStorage.getItem('snake_best') || '0', 10),
            state: STATE.IDLE,
            speed: 120,         // 移动间隔（毫秒），越小越快
            timer: null,
            growthPending: 0    // 待增长的节数
        };

        // ==================== 初始化 ====================
        function init() {
            game.snake = [
                { x: 14, y: 15 },
                { x: 13, y: 15 },
                { x: 12, y: 15 }
            ];
            game.direction     = { x: 1, y: 0 };
            game.nextDirection = { x: 1, y: 0 };
            game.score = 0;
            game.growthPending = 0;
            spawnFood();
            updateUI();
            draw();
        }

        // ==================== 随机生成食物 ====================
        function spawnFood() {
            const available = [];
            for (let x = 0; x < GRID_COUNT; x++) {
                for (let y = 0; y < GRID_COUNT; y++) {
                    if (!game.snake.some(s => s.x === x && s.y === y)) {
                        available.push({ x, y });
                    }
                }
            }
            if (available.length === 0) {
                // 蛇占满整张地图（理论上不可能）
                win();
                return;
            }
            game.food = available[Math.floor(Math.random() * available.length)];
        }

        // ==================== 移动一步 ====================
        function step() {
            // 应用下一帧方向（防止一帧内连续反向）
            if (!isOpposite(game.direction, game.nextDirection)) {
                game.direction = game.nextDirection;
            }

            const head = game.snake[0];
            const newHead = {
                x: head.x + game.direction.x,
                y: head.y + game.direction.y
            };

            // 撞墙检测
            if (newHead.x < 0 || newHead.x >= GRID_COUNT ||
                newHead.y < 0 || newHead.y >= GRID_COUNT) {
                gameOver('撞墙了！');
                return;
            }

            // 撞自身检测（注意：尾部这一帧会移开，除非刚吃了食物）
            const willEat = (newHead.x === game.food.x && newHead.y === game.food.y);
            const bodyToCheck = willEat ? game.snake : game.snake.slice(0, -1);
            if (bodyToCheck.some(s => s.x === newHead.x && s.y === newHead.y)) {
                gameOver('咬到自己了！');
                return;
            }

            // 移动
            game.snake.unshift(newHead);
            if (willEat) {
                game.score += 10;
                game.growthPending = 1;  // 不删尾即增长
                spawnFood();
            }
            if (game.growthPending > 0) {
                game.growthPending--;
            } else {
                game.snake.pop();
            }

            updateUI();
            draw();
        }

        // ==================== 判断方向是否相反 ====================
        function isOpposite(a, b) {
            return a.x === -b.x && a.y === -b.y;
        }

        // ==================== 游戏循环 ====================
        function startLoop() {
            stopLoop();
            game.timer = setInterval(step, game.speed);
        }

        function stopLoop() {
            if (game.timer) {
                clearInterval(game.timer);
                game.timer = null;
            }
        }

        // ==================== 状态切换 ====================
        function start() {
            if (game.state === STATE.RUNNING) return;
            if (game.state === STATE.OVER || game.state === STATE.IDLE) {
                init();
            }
            game.state = STATE.RUNNING;
            startLoop();
            updateUI();
        }

        function pause() {
            if (game.state !== STATE.RUNNING) return;
            game.state = STATE.PAUSED;
            stopLoop();
            updateUI();
        }

        function resume() {
            if (game.state !== STATE.PAUSED) return;
            game.state = STATE.RUNNING;
            startLoop();
            updateUI();
        }

        function reset() {
            stopLoop();
            init();
            game.state = STATE.IDLE;
            hideModal();
            updateUI();
            draw();
        }

        function gameOver(reason) {
            stopLoop();
            game.state = STATE.OVER;

            // 更新最高分
            const isNewBest = game.score > game.best;
            if (isNewBest) {
                game.best = game.score;
                localStorage.setItem('snake_best', String(game.best));
            }

            updateUI();
            showModal({
                icon: isNewBest ? '🏆' : '💀',
                title: reason || '游戏结束',
                isNewBest: isNewBest
            });
        }

        function win() {
            stopLoop();
            game.state = STATE.OVER;
            const isNewBest = game.score > game.best;
            if (isNewBest) {
                game.best = game.score;
                localStorage.setItem('snake_best', String(game.best));
            }
            updateUI();
            showModal({
                icon: '🎉',
                title: '恭喜通关！',
                isNewBest: isNewBest
            });
        }

        // ==================== UI 更新 ====================
        function updateUI() {
            scoreEl.textContent = game.score;
            bestEl.textContent  = game.best;

            const statusMap = {
                [STATE.IDLE]:    '未开始',
                [STATE.RUNNING]: '进行中',
                [STATE.PAUSED]:  '已暂停',
                [STATE.OVER]:    '已结束'
            };
            statusEl.textContent = statusMap[game.state] || '-';

            btnStart.disabled = (game.state === STATE.RUNNING);
            btnPause.disabled = (game.state !== STATE.RUNNING && game.state !== STATE.PAUSED);
            btnPause.textContent = (game.state === STATE.PAUSED) ? '▶ 继续' : '⏸ 暂停';
        }

        // ==================== 弹窗 ====================
        function showModal({ icon, title, isNewBest }) {
            modalIcon.textContent  = icon;
            modalTitle.textContent = title;
            modalScore.textContent = game.score;
            modalBest.textContent  = isNewBest
                ? `🎉 新纪录！历史最高：${game.best}`
                : `历史最高：${game.best}`;
            modalBest.classList.toggle('new', !!isNewBest);
            modal.classList.add('show');
        }

        function hideModal() {
            modal.classList.remove('show');
        }

        // ==================== 绘制 ====================
        function draw() {
            // 清空
            ctx.fillStyle = '#0b1220';
            ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

            // 边框光晕
            const grad = ctx.createLinearGradient(0, 0, CANVAS_SIZE, CANVAS_SIZE);
            grad.addColorStop(0, 'rgba(167, 139, 250, 0.15)');
            grad.addColorStop(1, 'rgba(244, 114, 182, 0.15)');
            ctx.strokeStyle = grad;
            ctx.lineWidth = 2;
            ctx.strokeRect(1, 1, CANVAS_SIZE - 2, CANVAS_SIZE - 2);

            drawFood();
            drawSnake();
        }

        function drawFood() {
            const cx = game.food.x * GRID_SIZE + GRID_SIZE / 2;
            const cy = game.food.y * GRID_SIZE + GRID_SIZE / 2;
            const r  = GRID_SIZE / 2 - 2;

            // 光晕
            const glow = ctx.createRadialGradient(cx, cy, 1, cx, cy, r + 6);
            glow.addColorStop(0, 'rgba(244, 114, 182, 0.6)');
            glow.addColorStop(1, 'rgba(244, 114, 182, 0)');
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(cx, cy, r + 6, 0, Math.PI * 2);
            ctx.fill();

            // 食物本体
            const foodGrad = ctx.createRadialGradient(cx - 3, cy - 3, 1, cx, cy, r);
            foodGrad.addColorStop(0, '#fda4af');
            foodGrad.addColorStop(1, '#e11d48');
            ctx.fillStyle = foodGrad;
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.fill();

            // 高光
            ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.beginPath();
            ctx.arc(cx - r / 3, cy - r / 3, r / 4, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawSnake() {
            game.snake.forEach((seg, i) => {
                const x = seg.x * GRID_SIZE;
                const y = seg.y * GRID_SIZE;
                const isHead = (i === 0);

                // 渐变颜色（头亮尾暗）
                const t = i / Math.max(game.snake.length - 1, 1);
                const r = Math.round(52  + (16  - 52)  * t);
                const g = Math.round(211 + (185 - 211) * t);
                const b = Math.round(153 + (129 - 153) * t);

                // 节段矩形（圆角）
                const pad = 1;
                const size = GRID_SIZE - pad * 2;
                roundRect(ctx, x + pad, y + pad, size, size, 4);

                const segGrad = ctx.createLinearGradient(x, y, x + GRID_SIZE, y + GRID_SIZE);
                if (isHead) {
                    segGrad.addColorStop(0, '#86efac');
                    segGrad.addColorStop(1, '#22c55e');
                } else {
                    segGrad.addColorStop(0, `rgb(${Math.min(r+30,255)}, ${g}, ${b})`);
                    segGrad.addColorStop(1, `rgb(${r}, ${g}, ${b})`);
                }
                ctx.fillStyle = segGrad;
                ctx.fill();

                // 头部：眼睛
                if (isHead) {
                    drawEyes(x, y);
                }
            });
        }

        function drawEyes(x, y) {
            const dir = game.direction;
            // 根据方向调整眼睛位置
            const offset = 5;
            let e1x, e1y, e2x, e2y;
            if (dir.x === 1) {        // 右
                e1x = x + GRID_SIZE - offset; e1y = y + offset;
                e2x = x + GRID_SIZE - offset; e2y = y + GRID_SIZE - offset;
            } else if (dir.x === -1) { // 左
                e1x = x + offset; e1y = y + offset;
                e2x = x + offset; e2y = y + GRID_SIZE - offset;
            } else if (dir.y === 1) {  // 下
                e1x = x + offset;           e1y = y + GRID_SIZE - offset;
                e2x = x + GRID_SIZE - offset; e2y = y + GRID_SIZE - offset;
            } else {                    // 上
                e1x = x + offset;           e1y = y + offset;
                e2x = x + GRID_SIZE - offset; e2y = y + offset;
            }

            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(e1x, e1y, 2.5, 0, Math.PI * 2);
            ctx.arc(e2x, e2y, 2.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.arc(e1x + dir.x * 0.5, e1y + dir.y * 0.5, 1.2, 0, Math.PI * 2);
            ctx.arc(e2x + dir.x * 0.5, e2y + dir.y * 0.5, 1.2, 0, Math.PI * 2);
            ctx.fill();
        }

        function roundRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        // ==================== 输入处理 ====================
        function setDirection(dx, dy) {
            if (game.state === STATE.IDLE || game.state === STATE.OVER) {
                start();
            }
            if (game.state !== STATE.RUNNING) return;
            const newDir = { x: dx, y: dy };
            // 禁止直接反向
            if (isOpposite(game.direction, newDir)) return;
            game.nextDirection = newDir;
        }

        document.addEventListener('keydown', (e) => {
            const key = e.key;
            // 方向控制
            if (key === 'ArrowUp'    || key === 'w' || key === 'W') { setDirection(0, -1); e.preventDefault(); }
            else if (key === 'ArrowDown'  || key === 's' || key === 'S') { setDirection(0,  1); e.preventDefault(); }
            else if (key === 'ArrowLeft'  || key === 'a' || key === 'A') { setDirection(-1, 0); e.preventDefault(); }
            else if (key === 'ArrowRight' || key === 'd' || key === 'D') { setDirection( 1, 0); e.preventDefault(); }
            // 空格：暂停/继续
            else if (key === ' ' || key === 'Spacebar') {
                e.preventDefault();
                togglePause();
            }
            // R：重玩
            else if (key === 'r' || key === 'R') {
                reset();
            }
        }, { passive: false });

        // 移动端方向键
        document.querySelectorAll('.pad-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const d = btn.dataset.dir;
                if (d === 'up')         setDirection(0, -1);
                else if (d === 'down')  setDirection(0,  1);
                else if (d === 'left')  setDirection(-1, 0);
                else if (d === 'right') setDirection( 1, 0);
            });
        });

        // 按钮
        function togglePause() {
            if (game.state === STATE.RUNNING) pause();
            else if (game.state === STATE.PAUSED) resume();
        }

        btnStart.addEventListener('click', () => {
            hideModal();
            start();
        });

        btnPause.addEventListener('click', togglePause);

        btnReset.addEventListener('click', reset);

        // 难度选择
        document.querySelectorAll('[data-speed]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('[data-speed]').forEach(b => b.classList.remove('btn-active'));
                btn.classList.add('btn-active');
                game.speed = parseInt(btn.dataset.speed, 10);
                speedLabelEl.textContent = btn.dataset.label;
                // 如果正在游戏中，重启循环以应用新速度
                if (game.state === STATE.RUNNING) {
                    startLoop();
                }
            });
        });

        // 弹窗按钮
        modalRestart.addEventListener('click', () => {
            hideModal();
            start();
        });

        modalClose.addEventListener('click', hideModal);

        // 阻止方向键滚动页面
        window.addEventListener('keydown', (e) => {
            if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) {
                e.preventDefault();
            }
        }, { passive: false });

        // ==================== 启动 ====================
        bestEl.textContent = game.best;
        init();
        game.state = STATE.IDLE;
        updateUI();
        draw();

    })();
    </script>
</body>
</html>
