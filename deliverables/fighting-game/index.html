<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web Fighter · 网页版格斗游戏</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #10131a; color: #e8e8e8;
         font-family: system-ui, "Microsoft YaHei", sans-serif;
         display: flex; flex-direction: column; align-items: center; }
  #wrap { position: relative; width: 960px; max-width: 100vw; }
  #stage { display: block; width: 100%; height: auto; background: #1b2233;
           border: 2px solid #2a3350; border-radius: 6px; }
  #hud { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
  .bar { position: relative; flex: 1; height: 26px; background: #333b52;
         border: 1px solid #55607f; border-radius: 4px; overflow: hidden; }
  .fill { height: 100%; width: 100%; background: linear-gradient(#7ee787, #2ea043); transition: width .08s linear; }
  .name { width: 96px; text-align: center; font-weight: bold; }
  #timer { width: 64px; text-align: center; font-size: 26px; font-weight: bold; }
  #overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
             font-size: 56px; font-weight: 900; color: #ffd34d; text-shadow: 0 0 16px #000, 0 0 8px #000;
             pointer-events: none; }
  #controls { display: flex; gap: 8px; margin: 10px 0 24px; flex-wrap: wrap; justify-content: center; }
  button { padding: 6px 14px; background: #2a3350; color: #e8e8e8; border: 1px solid #55607f;
           border-radius: 4px; cursor: pointer; font-size: 14px; }
  button:hover { background: #3a4670; }
  button.active { background: #2ea043; border-color: #7ee787; }
  .hint { color: #9aa4c0; font-size: 13px; }
</style>
</head>
<body>
  <h1 style="font-size:20px;margin:14px 0 6px">Web Fighter · 网页版格斗</h1>

  <div id="hud">
    <div class="name" id="name1">隆</div>
    <div class="bar"><div class="fill" id="hp1"></div></div>
    <div id="timer">99</div>
    <div class="bar"><div class="fill" id="hp2" style="background:linear-gradient(#ff9a8b,#d1342f)"></div></div>
    <div class="name" id="name2">铁拳</div>
  </div>

  <div id="wrap">
    <canvas id="stage" width="960" height="540"></canvas>
    <div id="overlay"></div>
  </div>

  <div id="controls">
    <button data-char="balanced">选：均衡型·隆</button>
    <button data-char="heavy">选：重击型·铁拳</button>
    <button data-char="speed">选：速攻型·春丽</button>
    <button id="btnStart">开始对战</button>
    <button id="btnRestart">重新开始</button>
  </div>
  <p class="hint">P1：A/D 移动 · W 跳 · S 蹲/防御 · J 轻拳 · K 重拳 · L 踢腿 · U 必杀</p>

  <script src="js/engine.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
