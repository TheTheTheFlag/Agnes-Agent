<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="description" content="像素飙车 Pixel Racer - 单文件像素风格赛车小游戏，无需安装，双击即可在浏览器中运行。">
<title>像素飙车 · Pixel Racer</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body {
    background:#101018;
    color:#e8e8e8;
    font-family:"Courier New", Consolas, Menlo, monospace;
    height:100%;
    display:flex; flex-direction:column; align-items:center;
    justify-content:flex-start;
    overflow-x:hidden;
  }
  header { padding:14px 10px 6px; text-align:center; }
  header h1 {
    font-size:26px; letter-spacing:4px; color:#ffd23f;
    text-shadow:3px 3px 0 #b3541e, 6px 6px 0 rgba(0,0,0,.6);
  }
  header .sub { font-size:12px; color:#9aa; letter-spacing:2px; margin-top:2px; }
  #wrap { position:relative; padding:10px; }
  canvas {
    display:block;
    width:min(94vw, 480px);
    height:auto;
    background:#2d7a3a;
    border:4px solid #2a2a35;
    border-radius:6px;
    box-shadow:0 0 0 2px #111, 0 10px 30px rgba(0,0,0,.55);
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    touch-action:none;
  }
  #hint {
    max-width:520px; margin:12px auto 26px; padding:0 14px;
    font-size:12px; line-height:1.9; color:#9aa;
    text-align:center;
  }
  #hint b { color:#ffd23f; font-weight:bold; }
  #hint .kbd {
    display:inline-block; background:#23233a; border:1px solid #44445e;
    border-bottom-width:3px; border-radius:4px; padding:0 6px; margin:0 2px;
    font-size:11px; color:#fff;
  }
  footer { padding:10px; font-size:11px; color:#667; text-align:center; }
  @media (max-width:520px){ header h1{ font-size:20px; letter-spacing:2px; } }
</style>
</head>
<body>
<header>
  <h1>🏁 像素飙车</h1>
  <div class="sub">PIXEL RACER · 单文件版 v1.0</div>
</header>

<div id="wrap">
  <canvas id="game" width="480" height="640"></canvas>
</div>

<div id="hint">
  操作：<span class="kbd">←</span><span class="kbd">→</span> / <span class="kbd">A</span><span class="kbd">D</span> 变道　
  <span class="kbd">↑</span><span class="kbd">W</span> 加速　<span class="kbd">↓</span><span class="kbd">S</span> 减速　
  <span class="kbd">空格</span> 开始/重开　<span class="kbd">P</span> 暂停　<span class="kbd">M</span> 静音<br>
  手机：按住屏幕左/右半区即可变道。<b>无需安装、无需联网，双击本文件即可开玩！</b>
</div>

<footer>像素飙车 Pixel Racer · 纯 Canvas 像素风 · 本地运行，无任何外部依赖</footer>

<script>
(function () {
  'use strict';

  // ================= 画布 =================
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var W = canvas.width, H = canvas.height;

  // ================= 像素调色板 =================
  var PALETTE = {
    R: '#e23b3b', r: '#a11f1f', Y: '#ffd23f', W: '#e8e8e8',
    B: '#1b1b2f', C: '#4a90e2', c: '#b9e6ff', G: '#6be06b',
    g: '#d7ffd0', O: '#f4a340', o: '#ffe9c2', P: '#c58af9',
    p: '#eed9ff', S: '#c0c0c0'
  };

  // ================= 车辆像素图案（16 x 18） =================
  var CAR_BASE = [
    '................',
    '....BBBBBBBB....',
    '...BWYYYYYYWB...',
    '...BWYYYYYYWB...',
    '...BBBBBBBBBB...',
    '..RRRRRRRRRRRR..',
    '..RRRRRRRRRRRR..',
    '..RRRRRRRRRRRR..',
    '..RRRYYYYYYRRR..',
    '..RRYYYYYYYYRR..',
    '..RRRYYYYYYRRR..',
    '..RRRRRRRRRRRR..',
    '..RRRRRRRRRRRR..',
    '.RRRRRRRRRRRRRR.',
    '.RRRRRRRRRRRRRR.',
    'BB..RRRRRRRR..BB',
    'BB..RRRRRRRR..BB',
    '................'
  ];
  var PLAYER_CAR = CAR_BASE;

  // 敌人车辆：对同一模板换色生成（蓝 / 绿 / 橙 / 紫）
  var ENEMY_SPECS = [
    { body: 'C', glass: 'c' },
    { body: 'G', glass: 'g' },
    { body: 'O', glass: 'o' },
    { body: 'P', glass: 'p' }
  ];
  function buildEnemy(spec) {
    var rows = [];
    for (var i = 0; i < CAR_BASE.length; i++) {
      rows.push(CAR_BASE[i]
        .replace(/R/g, spec.body)
        .replace(/r/g, spec.body)
        .replace(/W/g, spec.glass)
        .replace(/Y/g, spec.glass));
    }
    return rows;
  }
  var ENEMY_CARS = [];
  for (var si = 0; si < ENEMY_SPECS.length; si++) {
    ENEMY_CARS.push(buildEnemy(ENEMY_SPECS[si]));
  }

  var PIX = 3;                 // 每个像素格放大倍数
  var CAR_W = CAR_BASE[0].length * PIX;  // 48
  var CAR_H = CAR_BASE.length * PIX;     // 54

  // ================= 道路参数 =================
  var ROAD_W = 300;
  var ROAD_L = (W - ROAD_W) / 2;
  var LANES = 3;
  var LANE_W = ROAD_W / LANES;
  var MARK_CYCLE = 66;         // 虚线循环周期
  var GRASS = '#2d7a3a';
  var GRASS_D = '#256a31';
  var ROAD_C = '#3c3c44';
  var EDGE = '#f2f2f2';

  function laneX(i) { return ROAD_L + LANE_W * (i + 0.5); }
  function mod(n, m) { return ((n % m) + m) % m; }

  // ================= 游戏状态 =================
  var state = 'menu';   // menu | play | pause | over
  var score = 0;
  var hi = 0;
  var speed = 0;
  var dist = 0;
  var playerX = W / 2;
  var enemies = [];
  var coins = [];
  var parts = [];
  var markings = 0;
  var roadside = 0;
  var spawnTimer = 0;
  var coinTimer = 0;
  var shake = 0;
  var overFlash = 0;
  var last = 0;
  var boost = false;
  var PLAYER_Y = H - 130;

  try { hi = parseInt(localStorage.getItem('pixelRacerHi'), 10) || 0; } catch (e) { hi = 0; }

  // ================= 输入 =================
  var keys = {};
  var touchDir = 0;
  var muted = false;

  function leftHeld()  { return keys['ArrowLeft'] || keys['a'] || keys['A'] || touchDir < 0; }
  function rightHeld() { return keys['ArrowRight'] || keys['d'] || keys['D'] || touchDir > 0; }
  function upHeld()    { return keys['ArrowUp'] || keys['w'] || keys['W']; }

  // ================= 音频（WebAudio，程序生成） =================
  var AC = null;
  function audio() {
    if (!AC) {
      try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; }
    }
    if (AC && AC.state === 'suspended') { AC.resume(); }
    return AC;
  }
  function tone(f, dur, type, vol, slide) {
    if (muted) return;
    var ac = audio();
    if (!ac) return;
    try {
      var o = ac.createOscillator();
      var g = ac.createGain();
      o.type = type || 'square';
      o.frequency.setValueAtTime(f, ac.currentTime);
      if (slide) { o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), ac.currentTime + dur); }
      g.gain.setValueAtTime(vol || 0.12, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
      o.connect(g); g.connect(ac.destination);
      o.start();
      o.stop(ac.currentTime + dur);
    } catch (e) { /* 忽略音频错误 */ }
  }
  var sfx = {
    click: function () { tone(520, 0.08, 'square', 0.08); },
    start: function () { tone(440, 0.12, 'square', 0.1); setTimeout(function () { tone(660, 0.15, 'square', 0.1); }, 110); },
    coin:  function () { tone(880, 0.08, 'square', 0.1); setTimeout(function () { tone(1320, 0.12, 'square', 0.1); }, 60); },
    crash: function () { tone(200, 0.5, 'sawtooth', 0.2, -120); },
    over:  function () { tone(300, 0.3, 'sawtooth', 0.12, -100); }
  };

  // ================= 流程控制 =================
  function resetRun() {
    score = 0; dist = 0; speed = 220;
    enemies = []; coins = []; parts = [];
    spawnTimer = 0.7; coinTimer = 2.0;
    playerX = W / 2; shake = 0; overFlash = 0; boost = false;
  }

  function startGame() {
    audio();
    resetRun();
    state = 'play';
    sfx.start();
  }

  function crash() {
    state = 'over';
    overFlash = 1;
    shake = 0.5;
    sfx.crash();
    for (var i = 0; i < 42; i++) {
      parts.push({
        x: playerX, y: PLAYER_Y,
        vx: (Math.random() - 0.5) * 380,
        vy: -Math.random() * 440 - 60,
        life: 0.5 + Math.random() * 0.6,
        col: (i % 3) ? '#ffd23f' : '#ff5a3c'
      });
    }
    var s = Math.floor(score);
    if (s > hi) {
      hi = s;
      try { localStorage.setItem('pixelRacerHi', String(hi)); } catch (e) { /* 忽略 */ }
    }
    sfx.over();
  }

  // ================= 生成 =================
  function spawnEnemy() {
    var lane = Math.floor(Math.random() * LANES);
    if (enemies.length) {
      var lastLane = enemies[enemies.length - 1].lane;
      if (Math.random() < 0.6) {
        var others = [];
        for (var i = 0; i < LANES; i++) { if (i !== lastLane) { others.push(i); } }
        lane = others[Math.floor(Math.random() * others.length)];
      }
    }
    var pat = ENEMY_CARS[Math.floor(Math.random() * ENEMY_CARS.length)];
    enemies.push({ lane: lane, x: laneX(lane), y: -CAR_H, pat: pat });
  }

  function spawnCoin() {
    var lane = Math.floor(Math.random() * LANES);
    coins.push({ x: laneX(lane), y: -30, taken: false });
  }

  // ================= 更新 =================
  function update(dt) {
    if (state === 'play') {
      boost = upHeld();
      speed = Math.min(560, speed + 9 * dt);
      var eff = speed * (boost ? 1.22 : 1);
      dist += eff * dt;
      score += eff * dt * 0.02;
      markings = mod(markings + eff * dt, MARK_CYCLE);
      roadside += eff * dt;

      // 玩家横向移动
      var dir = (rightHeld() ? 1 : 0) - (leftHeld() ? 1 : 0);
      playerX += dir * 430 * dt;
      var minX = ROAD_L + CAR_W / 2 - 2;
      var maxX = ROAD_L + ROAD_W - CAR_W / 2 + 2;
      if (playerX < minX) { playerX = minX; }
      if (playerX > maxX) { playerX = maxX; }

      // 敌人与金币随路面滚动
      for (var i = 0; i < enemies.length; i++) {
        enemies[i].y += eff * 0.82 * dt;
        enemies[i].x = laneX(enemies[i].lane);
      }
      enemies = enemies.filter(function (e) { return e.y < H + CAR_H; });
      for (var j = 0; j < coins.length; j++) { coins[j].y += eff * 0.82 * dt; }
      coins = coins.filter(function (c) { return c.y < H + 30; });

      // 生成节奏随速度加快
      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        spawnEnemy();
        var base = 1.15 - (speed - 220) / 340 * 0.55;
        spawnTimer = Math.max(0.42, base * (0.85 + Math.random() * 0.3));
      }
      coinTimer -= dt;
      if (coinTimer <= 0) {
        if (coins.length < 3) { spawnCoin(); }
        coinTimer = 1.4 + Math.random() * 1.6;
      }

      // 碰撞检测（AABB，带一点宽容）
      for (var k = 0; k < enemies.length; k++) {
        var e = enemies[k];
        if (Math.abs(e.x - playerX) < CAR_W - 8 && Math.abs(e.y - PLAYER_Y) < CAR_H - 6) {
          crash();
          break;
        }
      }

      // 金币收集
      coins = coins.filter(function (c) {
        if (Math.abs(c.x - playerX) < 40 && Math.abs(c.y - PLAYER_Y) < 40) {
          score += 100;
          sfx.coin();
          return false;
        }
        return true;
      });
    }

    // 粒子与特效（任何状态都更新）
    for (var p = 0; p < parts.length; p++) {
      parts[p].x += parts[p].vx * dt;
      parts[p].y += parts[p].vy * dt;
      parts[p].vy += 320 * dt;
      parts[p].life -= dt;
    }
    parts = parts.filter(function (p) { return p.life > 0; });
    if (shake > 0) { shake -= dt; }
    if (overFlash > 0) { overFlash -= dt; }
  }

  // ================= 绘制 =================
  function drawPattern(pat, cx, cy) {
    var w = pat[0].length, h = pat.length;
    var x0 = Math.round(cx - w * PIX / 2);
    var y0 = Math.round(cy - h * PIX / 2);
    for (var y = 0; y < h; y++) {
      for (var x = 0; x < w; x++) {
        var ch = pat[y][x];
        if (ch === '.') { continue; }
        var col = PALETTE[ch];
        if (!col) { continue; }
        ctx.fillStyle = col;
        ctx.fillRect(x0 + x * PIX, y0 + y * PIX, PIX, PIX);
      }
    }
  }

  function drawBackdrop() {
    ctx.fillStyle = GRASS;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = GRASS_D;
    for (var y = -100; y < H; y += 40) {
      for (var x = 0; x < W; x += 40) {
        if (((x / 40) + (y / 40)) % 2 === 0) { ctx.fillRect(x, y, 40, 40); }
      }
    }
  }

  function drawRoadside() {
    // 路旁树木（纯装饰）
    for (var side = -1; side <= 1; side += 2) {
      var baseX = (side === -1) ? ROAD_L / 2 : W - ROAD_L / 2;
      for (var k = 0; k < 6; k++) {
        var y = mod(k * 200 - roadside * 0.7, H + 320) - 160;
        var x = baseX + side * mod(k * 53, 26) - 12;
        ctx.fillStyle = '#5a3d1f';
        ctx.fillRect(x - 3, y + 10, 6, 8);
        ctx.fillStyle = '#1f7a33';
        ctx.fillRect(x - 10, y - 8, 20, 20);
        ctx.fillStyle = '#2b9a44';
        ctx.fillRect(x - 7, y - 14, 14, 14);
      }
    }
  }

  function drawRoad() {
    ctx.fillStyle = '#8a8a90';
    ctx.fillRect(ROAD_L - 8, 0, ROAD_W + 16, H);
    ctx.fillStyle = ROAD_C;
    ctx.fillRect(ROAD_L, 0, ROAD_W, H);
    ctx.fillStyle = EDGE;
    ctx.fillRect(ROAD_L + 2, 0, 4, H);
    ctx.fillRect(ROAD_L + ROAD_W - 6, 0, 4, H);
    ctx.fillStyle = '#e8e8d0';
    var dashH = 36, gap = 30;
    for (var i = 1; i < LANES; i++) {
      var x = ROAD_L + LANE_W * i - 2;
      var yy = -markings;
      while (yy < H) {
        ctx.fillRect(x, yy, 4, dashH);
        yy += dashH + gap;
      }
    }
  }

  function drawPlayer() {
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.beginPath();
    ctx.ellipse(playerX, PLAYER_Y + CAR_H / 2 - 6, 24, 8, 0, 0, Math.PI * 2);
    ctx.fill();
    drawPattern(PLAYER_CAR, playerX, PLAYER_Y);
  }

  function drawEnemies() {
    for (var i = 0; i < enemies.length; i++) {
      var e = enemies[i];
      ctx.fillStyle = 'rgba(0,0,0,.30)';
      ctx.fillRect(e.x - 20, e.y + CAR_H / 2 - 4, 40, 7);
      drawPattern(e.pat, e.x, e.y);
    }
  }

  function drawCoins() {
    var t = Date.now() / 300;
    for (var i = 0; i < coins.length; i++) {
      var c = coins[i];
      var sx = Math.abs(Math.sin(t + i));
      ctx.fillStyle = 'rgba(0,0,0,.25)';
      ctx.beginPath(); ctx.ellipse(c.x, c.y + 12, 12, 5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.save();
      ctx.translate(c.x, c.y);
      ctx.scale(0.5 + 0.5 * sx, 1);
      ctx.fillStyle = '#8a6a10';
      ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffd23f';
      ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#b3541e';
      ctx.font = 'bold 14px monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('¥', 0, 1);
      ctx.restore();
    }
  }

  function drawParticles() {
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 2));
      ctx.fillStyle = p.col;
      ctx.fillRect(p.x - 3, p.y - 3, 6, 6);
    }
    ctx.globalAlpha = 1;
  }

  function drawHud() {
    if (state === 'menu') { return; }
    ctx.fillStyle = 'rgba(0,0,0,.5)';
    ctx.fillRect(0, 0, W, 34);
    ctx.font = 'bold 18px "Courier New", monospace';
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    ctx.fillStyle = '#fff';
    ctx.fillText('分数 ' + Math.floor(score), 10, 19);
    ctx.textAlign = 'right';
    ctx.fillText('时速 ' + Math.round(speed / 5), W - 10, 19);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffd23f';
    ctx.fillText('最高 ' + hi, W / 2, 19);
  }

  function panel(title, lines, footer) {
    ctx.fillStyle = 'rgba(8,8,16,.78)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ffd23f';
    ctx.font = 'bold 40px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(title, W / 2, 130);
    ctx.font = 'bold 17px "Courier New", monospace';
    ctx.fillStyle = '#fff';
    for (var i = 0; i < lines.length; i++) {
      ctx.fillText(lines[i], W / 2, 210 + i * 34);
    }
    if (Math.floor(Date.now() / 450) % 2 === 0) {
      ctx.fillStyle = '#6be06b';
      ctx.font = 'bold 20px "Courier New", monospace';
      ctx.fillText(footer, W / 2, 400);
    }
    // 小字说明
    ctx.fillStyle = '#9aa';
    ctx.font = '14px "Courier New", monospace';
    ctx.fillText('空格/回车：开始  P：暂停  M：静音', W / 2, 560);
  }

  function drawMenu() {
    drawPattern(PLAYER_CAR, W / 2, 320);
    panel('像素飙车', [
      '躲避来车，收集金币，越跑越快！',
      '← → 或 A D 变道 · ↑ 加速',
      '手机：按住屏幕左右半区变道'
    ], '按 空格 / 回车 开始');
  }

  function drawOver() {
    ctx.fillStyle = 'rgba(40,0,0,' + (0.35 + overFlash * 0.3) + ')';
    ctx.fillRect(0, 0, W, H);
    panel('游戏结束', [
      '本局分数：' + Math.floor(score),
      '最高纪录：' + hi,
      overFlash > 0.5 ? '💥 撞车了！' : '再接再厉！'
    ], '按 空格 / R 再来一局');
  }

  function drawPause() {
    panel('已暂停', ['按 P 或 Esc 继续'], '游戏暂停中…');
  }

  function draw() {
    ctx.save();
    if (shake > 0) {
      ctx.translate((Math.random() - 0.5) * 8 * shake, (Math.random() - 0.5) * 8 * shake);
    }
    drawBackdrop();
    drawRoadside();
    drawRoad();
    drawCoins();
    drawEnemies();
    if (state !== 'menu') { drawPlayer(); }
    drawParticles();
    drawHud();
    ctx.restore();

    if (state === 'menu') { drawMenu(); }
    else if (state === 'over') { drawOver(); }
    else if (state === 'pause') { drawPause(); }
  }

  // ================= 输入绑定 =================
  window.addEventListener('keydown', function (e) {
    var k = e.key;
    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].indexOf(k) >= 0) { e.preventDefault(); }
    keys[k] = true;

    if (k === ' ' || k === 'Enter') {
      if (state === 'menu' || state === 'over') { startGame(); }
      else if (state === 'pause') { state = 'play'; }
    }
    if ((k === 'r' || k === 'R') && state === 'over') { startGame(); }
    if (k === 'p' || k === 'P' || k === 'Escape') {
      if (state === 'play') { state = 'pause'; }
      else if (state === 'pause') { state = 'play'; }
    }
    if (k === 'm' || k === 'M') { muted = !muted; sfx.click(); }
    audio();
  });
  window.addEventListener('keyup', function (e) { keys[e.key] = false; });

  canvas.addEventListener('pointerdown', function (e) {
    audio();
    if (state === 'menu' || state === 'over') { startGame(); return; }
    if (state === 'pause') { state = 'play'; return; }
    var r = canvas.getBoundingClientRect();
    var x = (e.clientX - r.left) / r.width * W;
    touchDir = (x < W / 2) ? -1 : 1;
  });
  window.addEventListener('pointerup', function () { touchDir = 0; });
  window.addEventListener('pointercancel', function () { touchDir = 0; });

  // ================= 主循环 =================
  function frame(t) {
    var dt = Math.min(0.05, (t - last) / 1000 || 0.016);
    last = t;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  resetRun();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
