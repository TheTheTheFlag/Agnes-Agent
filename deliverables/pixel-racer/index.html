<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="PIXEL RACER — 像素风格无尽赛车小游戏（单文件、零依赖）">
<title>PIXEL RACER — 像素赛车</title>
<style>
  /* ============ 渲染容器：像素化整数倍放大，禁止模糊 ============ */
  html, body {
    margin: 0; padding: 0;
    background: #101216;
    height: 100%;
    overflow: hidden;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #wrap {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  canvas#game {
    display: block;
    width: min(520px, 100vw, calc(96vh * 2 / 3));
    height: auto;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    touch-action: none;
    background: #101216;
    border: 2px solid #2a2e38;
    box-shadow: 0 0 24px rgba(0,0,0,.8);
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="320" height="480"></canvas></div>
<script>
"use strict";
/* ============================================================================
 * PIXEL RACER v1.4 — 像素风格无尽赛车（单文件实现）
 * 依据设计文档: deliverables/pixel-racer/design/game-design.md
 * 模块划分（对应子任务要求）:
 *   [M1] 渲染模块     —— 像素画布 / 自绘 5×7 像素字体 / 背景赛道 / 车辆精灵 / 粒子特效
 *   [M2] 玩家操控模块 —— 键盘多键输入 + 触摸拖拽双通道
 *   [M3] 实体与生成   —— 敌方车（6 色 + 12% 大车）/ 金币 / 装饰树 / 草斑
 *   [M4] 碰撞检测模块 —— AABB 宽容判定（碰撞盒小于贴图）/ 无敌期穿透
 *   [M5] 计分与计时   —— 里程计分 / 超车 +10 / 金币 +50 / 最高分持久化 / 难度曲线
 *   [M6] 音频模块     —— WebAudio 合成音效（零外部资源）
 *   [M7] 状态机与主循环 —— menu / playing / paused / over
 * ========================================================================== */

/* ======================= [0] 全局配置常量 ======================= */
const CFG = {
  W: 320, H: 480,                       // 逻辑分辨率 320×480
  ROAD_W: 200, ROAD_X: 60, LANES: 4,    // 赛道宽 200，居中，4 车道
  SCROLL: 1.2,                          // 像素滚动系数：km/h → px/s
  PLAYER: {
    w: 12, h: 24, hw: 3, hh: 6,         // 贴图 12×24，碰撞盒 6×12（宽容判定）
    y: 384, move: 192,                  // 固定纵向位置，横向 192px/s ≈ 3.2px/帧@60fps
    cruise: 100,                        // 巡航 100 km/h
    maxBase: 175, maxTop: 260,          // 最高速 175→260（随里程线性）
    accel: 45, brake: 70,               // 加速 / 刹车
    lives: 3, invincible: 2.2           // 生命 3，无敌 2.2s
  },
  ENEMY: {
    w: 12, h: 24, hw: 6, hh: 12,
    bigW: 16, bigH: 32, bigChance: 0.12,
    speedMin: 35, speedMax: 130,
    colors: ['#8a8a93','#7a5aa0','#3aa8b0','#e07a2a','#3a6ac8','#c85a8a']
  },
  SCORE: { drive: 0.05, overtake: 10, coin: 50 },
  SPAWN: { start: 1.5, end: 0.55, distForMax: 6000 },  // 生成间隔 1.5s→0.55s
  COIN: { size: 8 },
  PLAYER_COLORS: ['#d22','#26a','#2a8','#db0'],
  UI: { white:'#ffffff', gold:'#ffd23f', warn:'#ff5a5a' }
};

/* ======================= [M1] 渲染模块 ======================= */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// --- 自绘 5×7 像素字体（A–Z / 0–9 / 常用符号），逐位渲染 ---
const FONT = {
  A:['01110','10001','10001','11111','10001','10001','10001'],
  B:['11110','10001','10001','11110','10001','10001','11110'],
  C:['01111','10000','10000','10000','10000','10000','01111'],
  D:['11110','10001','10001','10001','10001','10001','11110'],
  E:['11111','10000','10000','11110','10000','10000','11111'],
  F:['11111','10000','10000','11110','10000','10000','10000'],
  G:['01111','10000','10000','10111','10001','10001','01111'],
  H:['10001','10001','10001','11111','10001','10001','10001'],
  I:['01110','00100','00100','00100','00100','00100','01110'],
  J:['00111','00010','00010','00010','00010','10010','01100'],
  K:['10001','10010','10100','11000','10100','10010','10001'],
  L:['10000','10000','10000','10000','10000','10000','11111'],
  M:['10001','11011','10101','10101','10001','10001','10001'],
  N:['10001','11001','10101','10011','10001','10001','10001'],
  O:['01110','10001','10001','10001','10001','10001','01110'],
  P:['11110','10001','10001','11110','10000','10000','10000'],
  Q:['01110','10001','10001','10001','10101','10010','01101'],
  R:['11110','10001','10001','11110','10100','10010','10001'],
  S:['01111','10000','10000','01110','00001','00001','11110'],
  T:['11111','00100','00100','00100','00100','00100','00100'],
  U:['10001','10001','10001','10001','10001','10001','01110'],
  V:['10001','10001','10001','10001','10001','01010','00100'],
  W:['10001','10001','10001','10101','10101','11011','10001'],
  X:['10001','10001','01010','00100','01010','10001','10001'],
  Y:['10001','10001','01010','00100','00100','00100','00100'],
  Z:['11111','00001','00010','00100','01000','10000','11111'],
  '?':['01110','10001','00001','00110','00100','00000','00100'],
  '0':['01110','10001','10011','10101','11001','10001','01110'],
  '1':['00100','01100','00100','00100','00100','00100','01110'],
  '2':['01110','10001','00001','00110','01000','10000','11111'],
  '3':['11110','00001','00001','01110','00001','00001','11110'],
  '4':['00010','00110','01010','10010','11111','00010','00010'],
  '5':['11111','10000','10000','11110','00001','00001','11110'],
  '6':['01110','10000','10000','11110','10001','10001','01110'],
  '7':['11111','00001','00010','00100','01000','01000','01000'],
  '8':['01110','10001','10001','01110','10001','10001','01110'],
  '9':['01110','10001','10001','01111','00001','00001','01110'],
  ' ':['00000','00000','00000','00000','00000','00000','00000'],
  ':':['00000','00100','00100','00000','00100','00100','00000'],
  '.':['00000','00000','00000','00000','00000','01100','01100'],
  '!':['00100','00100','00100','00100','00100','00000','00100'],
  '-':['00000','00000','00000','01110','00000','00000','00000'],
  '+':['00000','00100','00100','11111','00100','00100','00000'],
  '/':['00001','00010','00100','01000','10000','00000','00000'],
  '(':['00010','00100','01000','01000','01000','00100','00010'],
  ')':['01000','00100','00010','00010','00010','00100','01000'],
  "'":['00100','00100','00100','00000','00000','00000','00000'],
  '%':['11001','11010','00010','00100','01000','01011','10011']
};

/** 绘制像素文字。align: left|center|right；scale 整数倍。 */
function drawText(text, x, y, color, scale = 1, align = 'left') {
  const s = String(text).toUpperCase();
  const charW = 6 * scale, charH = 7 * scale;
  const width = s.length * charW;
  let ox = x;
  if (align === 'center') ox = x - width / 2;
  else if (align === 'right') ox = x - width;
  ctx.fillStyle = color;
  for (let i = 0; i < s.length; i++) {
    const glyph = FONT[s[i]] || FONT['?'] || FONT[' '];
    for (let r = 0; r < 7; r++) {
      const row = glyph[r];
      for (let c = 0; c < 5; c++) {
        if (row[c] === '1') {
          ctx.fillRect(Math.round(ox + i * charW + c * scale),
                       Math.round(y + r * scale), scale, scale);
        }
      }
    }
  }
  return width;
}

/** 系统字体文本（用于像素字体无法覆盖的中文/箭头等符号行），保持像素风。 */
function drawSysText(text, x, y, color, size, align) {
  ctx.save();
  ctx.font = (size || 12) + 'px "Courier New", monospace';
  ctx.textBaseline = 'top';
  ctx.fillStyle = color;
  if (align === 'center') x -= ctx.measureText(text).width / 2;
  else if (align === 'right') x -= ctx.measureText(text).width;
  ctx.fillText(text, Math.round(x), Math.round(y));
  ctx.restore();
}

// --- 像素心形（生命 HUD） ---
const HEART = ['0110110','1111111','1111111','0111110','0011100','0001000'];
function drawHeart(x, y, scale, filled) {
  ctx.fillStyle = filled ? '#ff5a5a' : '#3a3d44';
  for (let r = 0; r < 6; r++) {
    for (let c = 0; c < 7; c++) {
      if (HEART[r][c] === '1') ctx.fillRect(x + c * scale, y + r * scale, scale, scale);
    }
  }
}

// --- 背景层：草地 / 草斑 / 行道树 / 路肩 / 车道线（滚动取模循环） ---
let grassSpots = [];  // {x, y, c} 伪随机草斑
(function initGrass() {
  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 70; i++) {
    const side = rnd() < 0.5 ? 0 : 1;            // 0 左侧草地 1 右侧草地
    grassSpots.push({
      x: Math.floor(side === 0 ? rnd() * (CFG.ROAD_X - 4) : CFG.ROAD_X + CFG.ROAD_W + 4 + rnd() * (CFG.W - CFG.ROAD_X - CFG.ROAD_W - 8)),
      y: Math.floor(rnd() * CFG.H),
      c: rnd() < 0.5 ? '#3fa64f' : '#2d7a3a'
    });
  }
})();

let trees = [];  // 行道树 {x, y}，每 150px 一棵
for (let y = 0; y < CFG.H + 40; y += 150) {
  const side = (y / 150) % 2 === 0 ? 0 : 1;
  trees.push({ x: side === 0 ? 30 : CFG.W - 30, y });
}

function drawTree(x, y) {
  ctx.fillStyle = '#5a3a1a';                       // 树干
  ctx.fillRect(x - 1, y + 6, 2, 6);
  ctx.fillStyle = '#1e5a2e';                       // 下层树冠
  ctx.fillRect(x - 5, y, 10, 8);
  ctx.fillStyle = '#2a7a3e';                       // 上层树冠
  ctx.fillRect(x - 3, y - 4, 6, 6);
}

/** 背景滚动：offset 为滚动像素（取模循环） */
function drawBackground(offset) {
  // 草地
  ctx.fillStyle = '#2d7a3a';
  ctx.fillRect(0, 0, CFG.W, CFG.H);
  ctx.fillStyle = '#3fa64f';
  for (const s of grassSpots) {
    const y = ((s.y - offset) % CFG.H + CFG.H) % CFG.H;
    ctx.fillRect(s.x, y, 2, 2);
  }
  // 行道树
  for (const t of trees) {
    const y = ((t.y - offset) % (CFG.H + 40) + CFG.H + 40) % (CFG.H + 40) - 20;
    if (y > -30 && y < CFG.H + 10) drawTree(t.x, y);
  }
  // 路肩：红/白 24px 交替块，随路面滚动
  const shoulderW = 8, shoulderX0 = CFG.ROAD_X - shoulderW, shoulderX1 = CFG.ROAD_X + CFG.ROAD_W;
  for (let i = 0; i < CFG.H / 24 + 2; i++) {
    const y = (i * 24 - (offset % 24) + CFG.H) % CFG.H - 24;
    const color = Math.floor((i + Math.floor(offset / 24)) % 2) === 0 ? '#e03a3a' : '#f2f2f2';
    ctx.fillStyle = color;
    ctx.fillRect(shoulderX0, y, shoulderW, 24);
    ctx.fillRect(shoulderX1, y, shoulderW, 24);
  }
  // 沥青路面 + 轻微明暗车道带
  ctx.fillStyle = '#3a3d44';
  ctx.fillRect(CFG.ROAD_X, 0, CFG.ROAD_W, CFG.H);
  ctx.fillStyle = '#2f323a';
  for (let l = 1; l < CFG.LANES; l++) {
    ctx.fillRect(CFG.ROAD_X + l * (CFG.ROAD_W / CFG.LANES) - 2, 0, 4, CFG.H);
  }
  // 车道虚线：18px 段 + 18px 间隔，无缝循环
  ctx.fillStyle = 'rgba(232,232,232,0.55)';
  const laneW = CFG.ROAD_W / CFG.LANES;
  for (let l = 1; l < CFG.LANES; l++) {
    const x = CFG.ROAD_X + l * laneW - 1;
    for (let i = 0; i < CFG.H / 36 + 2; i++) {
      const y = i * 36 - (offset % 36);
      if (y > -18 && y < CFG.H) ctx.fillRect(x, y, 2, 18);
    }
  }
}

// --- 车辆精灵（程序化像素绘制） ---
const COL_WHEEL = '#14161a', COL_WIND = '#1c2b3a', COL_LAMP = '#ffe9a0', COL_TAIL = '#e03a3a';
function drawCar(x, y, w, h, body, isPlayer) {
  const hw = w / 2, hh = h / 2;
  const cx = Math.round(x), cy = Math.round(y);
  const l = cx - hw, t = cy - hh;
  // 车轮
  ctx.fillStyle = COL_WHEEL;
  ctx.fillRect(l, t + hh - 7, 2, 5);            // 后轮左
  ctx.fillRect(l + w - 2, t + hh - 7, 2, 5);    // 后轮右
  ctx.fillRect(l, t + 2, 2, 5);                 // 前轮左
  ctx.fillRect(l + w - 2, t + 2, 2, 5);         // 前轮右
  // 车身
  ctx.fillStyle = body;
  ctx.fillRect(l + 2, t, w - 4, h);
  ctx.fillRect(l, t + 6, w, h - 12);            // 车身中段加宽
  // 引擎盖高光
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.fillRect(l + 2, t + h - 8, w - 4, 2);
  // 挡风玻璃
  ctx.fillStyle = COL_WIND;
  ctx.fillRect(l + 3, t + 3, w - 6, 4);
  if (isPlayer) {
    // 前大灯
    ctx.fillStyle = COL_LAMP;
    ctx.fillRect(l + 2, t, 2, 1); ctx.fillRect(l + w - 4, t, 2, 1);
  }
  // 尾灯
  ctx.fillStyle = COL_TAIL;
  ctx.fillRect(l + 2, t + h - 2, 2, 1);
  ctx.fillRect(l + w - 4, t + h - 2, 2, 1);
}

// --- 金币 ---
function drawCoin(x, y, size, glow) {
  ctx.fillStyle = glow ? '#fff7c0' : '#ffd23f';
  ctx.fillRect(Math.round(x), Math.round(y), size, size);
  ctx.fillStyle = '#ffd23f';
  ctx.fillRect(Math.round(x), Math.round(y), size, 2);       // 高光条
}

// --- 粒子特效（2px 方块） ---
let particles = [];
function spawnParticles(x, y, color, n, spd) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const v = (0.4 + Math.random() * 0.8) * (spd || 90);
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.35 + Math.random() * 0.3, color });
  }
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}
function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 3));
    ctx.fillStyle = p.color;
    ctx.fillRect(Math.round(p.x), Math.round(p.y), 2, 2);
  }
  ctx.globalAlpha = 1;
}

// --- 屏幕震动 ---
let shake = 0;
function addShake(t) { shake = Math.max(shake, t); }

/* ======================= [M2] 玩家操控模块 ======================= */
const keys = {};
let muted = false;
let colorIdx = 0;                       // 玩家配色（菜单 ←/→ 切换）

const KEYMAP = {
  ArrowLeft: 'left', KeyA: 'left',
  ArrowRight: 'right', KeyD: 'right',
  ArrowUp: 'accel', KeyW: 'accel', Space: 'accel',
  ArrowDown: 'brake', KeyS: 'brake'
};

function unlockAudio() { initAudio(); }

window.addEventListener('keydown', (e) => {
  unlockAudio();
  if (e.code === 'KeyM') { muted = !muted; beep(440, 0.05, 'square', muted ? 0 : 0.2); }
  if (e.code === 'KeyP' || e.code === 'Escape') {
    if (state === 'playing') { setState('paused'); beep(300, 0.08, 'square', 0.15); }
    else if (state === 'paused') { setState('playing'); beep(400, 0.08, 'square', 0.15); }
  }
  if (KEYMAP[e.code]) keys[e.code] = true;
  // 菜单态：←/→ 切换颜色；Enter/空格 开始
  if (state === 'menu') {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') { colorIdx = (colorIdx + CFG.PLAYER_COLORS.length - 1) % CFG.PLAYER_COLORS.length; beep(330, 0.05, 'square', 0.2); }
    if (e.code === 'ArrowRight' || e.code === 'KeyD') { colorIdx = (colorIdx + 1) % CFG.PLAYER_COLORS.length; beep(330, 0.05, 'square', 0.2); }
    if (e.code === 'Enter' || e.code === 'Space') startGame();
  }
  if (state === 'over') {
    if (e.code === 'Enter' || e.code === 'Space') startGame();
  }
  e.preventDefault();
});
window.addEventListener('keyup', (e) => { delete keys[e.code]; });

// 触摸拖拽：手指横向拖动 → 车辆跟随；菜单/结算轻触开始
let touchActive = false, lastTouchX = 0;
canvas.addEventListener('pointerdown', (e) => {
  unlockAudio();
  if (state === 'menu' || state === 'over') { startGame(); return; }
  if (state === 'playing' || state === 'paused') {
    if (state === 'paused') { setState('playing'); return; }
    touchActive = true; lastTouchX = e.clientX;
  }
});
canvas.addEventListener('pointermove', (e) => {
  if (!touchActive || state !== 'playing') return;
  const scale = CFG.W / canvas.clientWidth;
  const dx = (e.clientX - lastTouchX) * scale;
  lastTouchX = e.clientX;
  player.x += dx;
  clampPlayerX();
});
const endTouch = () => { touchActive = false; };
canvas.addEventListener('pointerup', endTouch);
canvas.addEventListener('pointercancel', endTouch);

/* ======================= [M3] 实体与生成 ======================= */
const player = {
  x: CFG.W / 2 - CFG.PLAYER.w / 2,
  y: CFG.PLAYER.y, w: CFG.PLAYER.w, h: CFG.PLAYER.h
};
let enemies = [];       // {x,y,w,h,hw,hh,color,speed,big,overtaken}
let coinItems = [];     // {x,y}
let spawnTimer = 0, coinTimer = 0;
let scrollOffset = 0;

function laneCenter(l) { return CFG.ROAD_X + (l + 0.5) * (CFG.ROAD_W / CFG.LANES); }

function clampPlayerX() {
  const minX = CFG.ROAD_X + 8, maxX = CFG.ROAD_X + CFG.ROAD_W - 8 - player.w;
  player.x = Math.max(minX, Math.min(maxX, player.x));
}

/** 生成敌方车：固定车道直行；确保生成区（顶部 120px）相邻车道留缝（逃生路线） */
function spawnEnemy() {
  const big = Math.random() < CFG.ENEMY.bigChance;
  const w = big ? CFG.ENEMY.bigW : CFG.ENEMY.w;
  const h = big ? CFG.ENEMY.bigH : CFG.ENEMY.h;
  const candidates = [0, 1, 2, 3].sort(() => Math.random() - 0.5);
  for (const lane of candidates) {
    let blocked = false;
    for (const en of enemies) {
      const el = Math.round((en.x - CFG.ROAD_X) / (CFG.ROAD_W / CFG.LANES));
      if (en.y < 120 && Math.abs(el - lane) <= 1) { blocked = true; break; }
    }
    if (!blocked) {
      const speed = CFG.ENEMY.speedMin + Math.random() * (CFG.ENEMY.speedMax - CFG.ENEMY.speedMin);
      enemies.push({
        x: laneCenter(lane) - w / 2, y: -h - 10,
        w, h, hw: w / 2, hh: h / 2,
        color: CFG.ENEMY.colors[Math.floor(Math.random() * CFG.ENEMY.colors.length)],
        speed: big ? speed * 0.7 : speed, big, overtaken: false
      });
      return true;
    }
  }
  return false;   // 无安全车道，跳过本帧生成
}

function spawnCoin() {
  const lane = Math.floor(Math.random() * CFG.LANES);
  coinItems.push({ x: laneCenter(lane) - CFG.COIN.size / 2, y: -10 });
}

/* ======================= [M4] 碰撞检测模块 ======================= */
/** AABB：cx/cy 为车中心，hw/hh 为半宽高（宽容判定） */
function hit(cx, cy, hw, hh, ex, ey, ew, eh) {
  return Math.abs(cx - (ex + ew / 2)) < hw + ew / 2 &&
         Math.abs(cy - (ey + eh / 2)) < hh + eh / 2;
}

function checkCollisions() {
  if (invincible > 0) return;                       // 无敌期自由穿车
  const pcx = player.x + player.w / 2, pcy = player.y + player.h / 2;
  for (let i = enemies.length - 1; i >= 0; i--) {
    const en = enemies[i];
    if (hit(pcx, pcy, CFG.PLAYER.hw, CFG.PLAYER.hh, en.x, en.y, en.w, en.h)) {
      onCrash(en);
      break;
    }
  }
  // 金币拾取（不计无敌）
  for (let i = coinItems.length - 1; i >= 0; i--) {
    const c = coinItems[i];
    if (hit(pcx, pcy, 8, 10, c.x + CFG.COIN.size / 2, c.y + CFG.COIN.size / 2, CFG.COIN.size, CFG.COIN.size)) {
      score += CFG.SCORE.coin; coins++;
      spawnParticles(c.x + CFG.COIN.size / 2, c.y + CFG.COIN.size / 2, '#ffd23f', 10);
      beep(880, 0.07, 'square', 0.25); beep(1320, 0.09, 'square', 0.25);
      coinItems.splice(i, 1);
    }
  }
}

/* ======================= [M5] 计分与计时 ======================= */
let state = 'menu';
let score = 0, coins = 0, lives = 3, speed = 0;
let distance = 0, overtakes = 0, runTime = 0;
let invincible = 0, newRecord = false;
let best = 0;

try { best = parseInt(localStorage.getItem('pixelracer.best') || '0', 10) || 0; } catch (e) { best = 0; }

function saveBest() {
  if (score > best) {
    best = score; newRecord = true;
    try { localStorage.setItem('pixelracer.best', String(best)); } catch (e) { /* 隐私模式忽略 */ }
  }
}

// --- 难度曲线（里程驱动） ---
function difficulty() { return Math.min(1, distance / CFG.SPAWN.distForMax); }
function maxSpeed()   { return CFG.PLAYER.maxBase + (CFG.PLAYER.maxTop - CFG.PLAYER.maxBase) * difficulty(); }
function spawnGap()   { return CFG.SPAWN.start - (CFG.SPAWN.start - CFG.SPAWN.end) * difficulty(); }

function startGame() {
  score = 0; coins = 0; lives = CFG.PLAYER.lives; speed = 0;
  distance = 0; overtakes = 0; runTime = 0; invincible = 0; newRecord = false;
  enemies = []; coinItems = []; particles = [];
  spawnTimer = 0.8; coinTimer = 1.0;
  player.x = CFG.W / 2 - player.w / 2;
  shake = 0;
  setState('playing');
}

/** 撞车惩罚：-1 命、速度清零、2.2s 无敌闪烁、火花爆炸、屏幕震动 */
function onCrash(en) {
  lives--;
  speed = 0;
  invincible = CFG.PLAYER.invincible;
  addShake(0.45);
  spawnParticles(player.x + player.w / 2, player.y + player.h / 2, '#ff5a5a', 26, 140);
  spawnParticles(player.x + player.w / 2, player.y + player.h / 2, '#ffd23f', 14, 110);
  beep(140, 0.22, 'sawtooth', 0.35);
  beep(90, 0.3, 'square', 0.3);
  if (lives <= 0) {
    saveBest();
    setState('over');
  }
}

/* ======================= [M6] 音频模块（WebAudio 合成） ======================= */
let actx = null;
function initAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
  } catch (e) { /* 无音频环境静默降级 */ }
}
function beep(freq, dur, type, vol, slideTo) {
  if (muted || !actx) return;
  const t = actx.currentTime;
  const osc = actx.createOscillator(), g = actx.createGain();
  osc.type = type || 'square';
  osc.frequency.setValueAtTime(freq, t);
  if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol || 0.2, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  osc.connect(g); g.connect(actx.destination);
  osc.start(t); osc.stop(t + dur);
}

/* ======================= [M7] 状态机与主循环 ======================= */
function setState(s) { state = s; }

/* ---------- 更新逻辑（计时驱动） ---------- */
let lastTime = performance.now();

function update(dt) {
  runTime += dt;

  if (state === 'menu' || state === 'playing') {
    // 巡航/加速/刹车（M5 计时）
    const maxSp = maxSpeed();
    if (keys.accel) {
      speed = Math.min(maxSp, speed + CFG.PLAYER.accel * dt);
      if (state === 'menu') speed = CFG.PLAYER.cruise;   // 菜单背景匀速
    } else if (keys.brake) {
      speed = Math.max(20, speed - CFG.PLAYER.brake * dt);
    } else {
      // 自动回到巡航；撞车后从 0 快速恢复
      const target = speed < CFG.PLAYER.cruise ? CFG.PLAYER.cruise : CFG.PLAYER.cruise;
      speed += (target - speed) * Math.min(1, dt * 2.2);
      if (Math.abs(speed - target) < 0.5) speed = target;
    }

    // 玩家横向移动
    if (state === 'playing') {
      const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
      player.x += dir * CFG.PLAYER.move * dt;
      clampPlayerX();
    }

    // 背景与实体滚动
    const scroll = speed * CFG.SCROLL;
    scrollOffset += scroll * dt;

    // 敌方车移动（相对速度）：玩家快 → 车流下移；玩家慢 → 车流上移
    for (let i = enemies.length - 1; i >= 0; i--) {
      const en = enemies[i];
      en.y += (speed - en.speed) * CFG.SCROLL * dt;
      // 超车判定：敌方完全越过玩家车顶 → +10（仅一次）
      if (!en.overtaken && en.y + en.h < player.y - player.h / 2 - 14) {
        en.overtaken = true;
        if (state === 'playing') {
          score += CFG.SCORE.overtake; overtakes++;
          beep(520, 0.06, 'square', 0.18); beep(700, 0.06, 'square', 0.15);
        }
      }
      if (en.y > CFG.H + 40) enemies.splice(i, 1);
    }

    // 金币移动
    for (let i = coinItems.length - 1; i >= 0; i--) {
      coinItems[i].y += scroll * dt;
      if (coinItems[i].y > CFG.H + 10) coinItems.splice(i, 1);
    }

    // 生成节奏
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnEnemy();
      spawnTimer = spawnGap() * (0.75 + Math.random() * 0.5);
    }
    coinTimer -= dt;
    if (coinTimer <= 0) {
      spawnCoin();
      coinTimer = 1.1 + Math.random() * 1.3;
    }

    // 碰撞检测（M4，仅 playing 态）
    if (state === 'playing') checkCollisions();

    // 里程计分（M5）：+0.05 × 速度 / 秒
    if (state === 'playing') {
      distance += speed * (1000 / 3600) * dt;
      score += CFG.SCORE.drive * speed * dt;
    }
  }

  // 无敌计时
  if (invincible > 0) invincible -= dt;

  // 粒子 / 震动
  updateParticles(dt);
  if (shake > 0) shake = Math.max(0, shake - dt * 2.5);
}

/* ---------- 渲染 ---------- */
function render() {
  ctx.save();
  if (shake > 0) {
    ctx.translate(Math.round((Math.random() - 0.5) * shake * 16),
                  Math.round((Math.random() - 0.5) * shake * 16));
  }

  drawBackground(scrollOffset);

  // 金币
  const glow = Math.sin(runTime * 6) > 0;
  for (const c of coinItems) drawCoin(c.x, c.y, CFG.COIN.size, glow);

  // 敌方车
  for (const en of enemies) drawCar(en.x, en.y, en.w, en.h, en.color, false);

  // 玩家车（无敌期 12Hz 闪烁）
  const blink = invincible > 0 && Math.floor(runTime * 12) % 2 === 0;
  if (state !== 'over' && !blink) {
    const tilt = Math.max(0, speed - CFG.PLAYER.cruise) / 60;   // 加速视觉前倾
    drawCar(player.x, player.y - tilt, player.w, player.h, CFG.PLAYER_COLORS[colorIdx], true);
  }

  drawParticles();

  // HUD（playing / paused）
  if (state === 'playing' || state === 'paused') drawHUD();

  // 状态遮罩
  if (state === 'menu') drawMenu();
  else if (state === 'paused') drawPaused();
  else if (state === 'over') drawOver();

  ctx.restore();
}

function drawHUD() {
  const U = CFG.UI;
  // 顶栏：SCORE / COINS / BEST / 声音
  drawText('SCORE', 6, 6, U.white, 1);
  drawText(String(Math.floor(score)).padStart(6, '0'), 6, 16, U.gold, 2);
  drawText('COINS ' + coins, CFG.W - 6, 6, U.gold, 1, 'right');
  drawText('BEST ' + Math.max(best, Math.floor(score)), CFG.W - 6, 16, U.white, 1, 'right');
  drawText(muted ? 'M:OFF' : 'M:ON', CFG.W - 6, 26, '#8a8a93', 1, 'right');

  // 底部中央速度
  drawText(Math.round(speed) + ' KM/H', CFG.W / 2, CFG.H - 26, U.white, 2, 'center');
  drawText('MAX ' + Math.round(maxSpeed()), CFG.W / 2, CFG.H - 12, '#8a8a93', 1, 'center');

  // 左侧垂直速度条（绿→黄→红）
  const barX = 4, barY = CFG.H - 132, barW = 4, barH = 120;
  const ratio = Math.min(1, speed / maxSpeed());
  ctx.fillStyle = '#22252c';
  ctx.fillRect(barX, barY, barW, barH);
  ctx.fillStyle = ratio < 0.55 ? '#3fa64f' : ratio < 0.85 ? '#ffd23f' : '#ff5a5a';
  ctx.fillRect(barX, barY + barH - Math.round(barH * ratio), barW, Math.round(barH * ratio));

  // 左下生命心形
  for (let i = 0; i < CFG.PLAYER.lives; i++) {
    drawHeart(6 + i * 18, CFG.H - 46, 2, i < lives);
  }
}

function drawMenu() {
  ctx.fillStyle = 'rgba(10,12,16,0.55)';
  ctx.fillRect(0, 0, CFG.W, CFG.H);
  drawText('PIXEL', CFG.W / 2, 90, '#ffd23f', 4, 'center');
  drawText('RACER', CFG.W / 2, 126, '#ffffff', 4, 'center');
  drawText('像素风格无尽赛车', CFG.W / 2, 172, '#8a8a93', 1, 'center');

  // 配色选择预览
  drawCar(CFG.W / 2 - 24, 210, 48, 24, CFG.PLAYER_COLORS[colorIdx], true);
  drawText('<   COLOR   >', CFG.W / 2, 252, U_WHITE(), 1, 'center');
  drawText('←→ 切换配色', CFG.W / 2, 268, '#8a8a93', 1, 'center');

  drawText('↑ 加速  ↓ 刹车  ←→ 转向', CFG.W / 2, 300, U_WHITE(), 1, 'center');
  drawText('P 暂停   M 声音  触摸可拖拽', CFG.W / 2, 314, '#8a8a93', 1, 'center');

  if (Math.floor(runTime * 2) % 2 === 0) {
    drawText('PRESS ENTER / TAP TO START', CFG.W / 2, 366, '#ff5a5a', 1, 'center');
  }
  if (best > 0) drawText('BEST ' + best, CFG.W / 2, 396, '#ffd23f', 1, 'center');
}

function U_WHITE() { return CFG.UI.white; }

function drawPaused() {
  ctx.fillStyle = 'rgba(10,12,16,0.65)';
  ctx.fillRect(0, 0, CFG.W, CFG.H);
  drawText('PAUSED', CFG.W / 2, 200, '#ffffff', 3, 'center');
  drawText('P / ESC 继续', CFG.W / 2, 250, '#8a8a93', 1, 'center');
}

function drawOver() {
  ctx.fillStyle = 'rgba(10,12,16,0.72)';
  ctx.fillRect(0, 0, CFG.W, CFG.H);
  drawText('GAME', CFG.W / 2, 60, '#ff5a5a', 4, 'center');
  drawText('OVER', CFG.W / 2, 96, '#ff5a5a', 4, 'center');
  if (newRecord) drawText('NEW RECORD!', CFG.W / 2, 138, '#ffd23f', 2, 'center');

  const rows = [
    ['SCORE', String(Math.floor(score)), '#ffd23f'],
    ['BEST', String(best), '#ffffff'],
    ['COINS', String(coins), '#ffffff'],
    ['DIST', Math.floor(distance) + ' M', '#ffffff'],
    ['OVERTAKE', String(overtakes), '#ffffff'],
    ['TIME', fmtTime(runTime), '#ffffff']
  ];
  rows.forEach((r, i) => {
    drawText(r[0], CFG.W / 2 - 80, 170 + i * 20, '#8a8a93', 1, 'left');
    drawText(r[1], CFG.W / 2 + 80, 170 + i * 20, r[2], 1, 'right');
  });
  if (Math.floor(runTime * 2) % 2 === 0) {
    drawText('PRESS ENTER / TAP TO RETRY', CFG.W / 2, 330, '#ff5a5a', 1, 'center');
  }
}

function fmtTime(t) {
  const m = Math.floor(t / 60), s = Math.floor(t % 60);
  return m + ':' + String(s).padStart(2, '0');
}

/* ---------- 主循环（requestAnimationFrame 计时） ---------- */
function frame(now) {
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > 0.05) dt = 0.05;      // 切后台/卡顿防跳帧
  update(dt);
  render();
  requestAnimationFrame(frame);
}

/* 菜单态预置演示车流：让背景“活”起来 */
(function seedDemo() {
  for (let i = 0; i < 3; i++) {
    const lane = i % CFG.LANES;
    const w = CFG.ENEMY.w, h = CFG.ENEMY.h;
    enemies.push({
      x: laneCenter(lane) - w / 2, y: 60 + i * 130,
      w, h, hw: w / 2, hh: h / 2,
      color: CFG.ENEMY.colors[i % CFG.ENEMY.colors.length],
      speed: 60 + i * 15, big: false, overtaken: true
    });
  }
})();

requestAnimationFrame((t) => { lastTime = t; requestAnimationFrame(frame); });
</script>
