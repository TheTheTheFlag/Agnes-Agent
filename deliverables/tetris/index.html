<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>俄罗斯方块 Tetris</title>
<style>
  :root {
    --bg: #10131a;
    --panel: #1a1f2b;
    --panel-border: #2a3244;
    --accent: #4cc9f0;
    --text: #e6ebf5;
    --muted: #8b97ad;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    min-height: 100%;
    background: radial-gradient(circle at 50% 0%, #1b2233 0%, var(--bg) 70%);
    color: var(--text);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  .wrap {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 24px 12px;
  }
  h1 {
    margin: 0;
    font-size: 22px;
    letter-spacing: 4px;
    font-weight: 600;
    color: var(--accent);
    text-shadow: 0 0 18px rgba(76,201,240,.35);
  }
  .game {
    display: flex;
    gap: 18px;
    align-items: flex-start;
  }
  .board-holder {
    position: relative;
    border-radius: 12px;
    padding: 8px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    box-shadow: 0 12px 40px rgba(0,0,0,.5);
  }
  canvas {
    display: block;
    border-radius: 6px;
    background: #0b0e14;
  }
  .side {
    width: 150px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 12px;
  }
  .card .label {
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .card .value {
    font-size: 26px;
    font-weight: 700;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  #nextCanvas {
    display: block;
    margin: 0 auto;
    background: #0b0e14;
    border-radius: 6px;
  }
  .controls {
    display: flex;
    gap: 10px;
    width: 100%;
    max-width: 420px;
  }
  button {
    flex: 1;
    cursor: pointer;
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    color: #06121a;
    background: linear-gradient(180deg, #6fe0ff, var(--accent));
    border: none;
    border-radius: 10px;
    padding: 11px 10px;
    transition: transform .08s ease, filter .15s ease;
  }
  button.secondary {
    color: var(--text);
    background: linear-gradient(180deg, #2c3548, #232b3a);
    border: 1px solid var(--panel-border);
  }
  button:hover { filter: brightness(1.08); }
  button:active { transform: scale(.97); }
  .hint {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.7;
    max-width: 420px;
    text-align: center;
  }
  .hint b { color: var(--text); font-weight: 600; }
  /* 覆盖层 */
  .overlay {
    position: absolute;
    inset: 8px;
    border-radius: 6px;
    background: rgba(6,9,14,.82);
    backdrop-filter: blur(3px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-align: center;
    padding: 16px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s ease;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .overlay .big {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 2px;
    color: var(--accent);
  }
  .overlay .sub { font-size: 13px; color: var(--muted); }
  .overlay button { max-width: 160px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>T E T R I S</h1>
  <div class="game">
    <div class="board-holder">
      <canvas id="board" width="300" height="600"></canvas>
      <div class="overlay show" id="overlay">
        <div class="big" id="overlayTitle">俄罗斯方块</div>
        <div class="sub" id="overlaySub">按「开始 / 重开」或 P 键开始游戏</div>
        <button id="overlayBtn">开始游戏</button>
      </div>
    </div>
    <div class="side">
      <div class="card">
        <div class="label">分数</div>
        <div class="value" id="score">0</div>
      </div>
      <div class="card">
        <div class="label">等级</div>
        <div class="value" id="level">1</div>
      </div>
      <div class="card">
        <div class="label">消行</div>
        <div class="value" id="lines">0</div>
      </div>
      <div class="card">
        <div class="label">下一块</div>
        <canvas id="nextCanvas" width="120" height="120"></canvas>
      </div>
    </div>
  </div>
  <div class="controls">
    <button id="restartBtn">开始 / 重开</button>
    <button id="pauseBtn" class="secondary">暂停 (P)</button>
  </div>
  <div class="hint">
    <b>←</b> / <b>→</b> 移动 &nbsp;|&nbsp; <b>↓</b> 加速下落 &nbsp;|&nbsp; <b>↑</b> 旋转 &nbsp;|&nbsp; <b>空格</b> 硬降 &nbsp;|&nbsp; <b>P</b> 暂停
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ============ 常量配置 ============ */
  const COLS = 10;
  const ROWS = 20;
  const CELL = 30;               // 单元格像素（画布 300x600）
  const NEXT_CELL = 24;          // 预览画布单元格

  // 7 种方块形状（用二维数组定义，便于旋转）
  const SHAPES = {
    I: [[1, 1, 1, 1]],
    O: [[1, 1],
        [1, 1]],
    T: [[0, 1, 0],
        [1, 1, 1]],
    S: [[0, 1, 1],
        [1, 1, 0]],
    Z: [[1, 1, 0],
        [0, 1, 1]],
    J: [[1, 0, 0],
        [1, 1, 1]],
    L: [[0, 0, 1],
        [1, 1, 1]]
  };

  const COLORS = {
    I: "#4cc9f0",
    O: "#ffd166",
    T: "#b388ff",
    S: "#4ade80",
    Z: "#f87171",
    J: "#60a5fa",
    L: "#fb923c"
  };

  const TYPES = Object.keys(SHAPES);

  // 每级所需消行数 & 各消行数基础分
  const LINES_PER_LEVEL = 10;
  const LINE_SCORES = { 1: 100, 2: 300, 3: 500, 4: 800 };

  /* ============ 画布与 DOM ============ */
  const boardCanvas = document.getElementById("board");
  const bctx = boardCanvas.getContext("2d");
  const nextCanvas = document.getElementById("nextCanvas");
  const nctx = nextCanvas.getContext("2d");

  const scoreEl = document.getElementById("score");
  const levelEl = document.getElementById("level");
  const linesEl = document.getElementById("lines");
  const overlay = document.getElementById("overlay");
  const overlayTitle = document.getElementById("overlayTitle");
  const overlaySub = document.getElementById("overlaySub");
  const overlayBtn = document.getElementById("overlayBtn");
  const restartBtn = document.getElementById("restartBtn");
  const pauseBtn = document.getElementById("pauseBtn");

  /* ============ 游戏状态 ============ */
  let board = [];          // 已固定的方块矩阵
  let current = null;      // 当前活动方块 {type, matrix, x, y}
  let nextType = null;     // 下一块类型
  let score = 0;
  let lines = 0;
  let level = 1;
  let running = false;     // 游戏进行中
  let paused = false;
  let gameOver = false;
  let rafId = null;
  let dropCounter = 0;     // 下落计时累加（毫秒）
  let lastTime = 0;
  let dropInterval = 800;  // 当前下落间隔（毫秒），随等级变小

  /* ============ 工具函数 ============ */
  function createEmptyBoard() {
    const b = [];
    for (let r = 0; r < ROWS; r++) {
      b.push(new Array(COLS).fill(null));
    }
    return b;
  }

  // 深拷贝矩阵
  function cloneMatrix(m) {
    return m.map(function (row) { return row.slice(); });
  }

  // 顺时针旋转矩阵 90°
  function rotateMatrix(m) {
    const rows = m.length;
    const cols = m[0].length;
    const out = [];
    for (let c = 0; c < cols; c++) {
      out.push([]);
      for (let r = rows - 1; r >= 0; r--) {
        out[c].push(m[r][c]);
      }
    }
    return out;
  }

  // 随机生成一个方块类型（用 bag 随机保证分布均匀）
  let bag = [];
  function randomType() {
    if (bag.length === 0) {
      bag = TYPES.slice();
      // 洗牌
      for (let i = bag.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const t = bag[i]; bag[i] = bag[j]; bag[j] = t;
      }
    }
    return bag.pop();
  }

  // 根据类型创建一个新方块对象（初始位置在顶部居中）
  function makePiece(type) {
    const matrix = cloneMatrix(SHAPES[type]);
    const x = Math.floor((COLS - matrix[0].length) / 2);
    return { type: type, matrix: matrix, x: x, y: 0 };
  }

  /* ============ 碰撞检测 ============ */
  function collide(matrix, px, py) {
    for (let r = 0; r < matrix.length; r++) {
      for (let c = 0; c < matrix[r].length; c++) {
        if (!matrix[r][c]) continue;
        const x = px + c;
        const y = py + r;
        // 边界检测
        if (x < 0 || x >= COLS || y >= ROWS) return true;
        // 与已固定方块碰撞（y<0 时允许，方块从上方进入）
        if (y >= 0 && board[y][x]) return true;
      }
    }
    return false;
  }

  /* ============ 操作：移动 / 旋转 / 下落 ============ */
  function move(dx) {
    if (!current) return;
    if (!collide(current.matrix, current.x + dx, current.y)) {
      current.x += dx;
      draw();
    }
  }

  function rotate() {
    if (!current) return;
    const rotated = rotateMatrix(current.matrix);
    // 简单墙踢：尝试向左/向右微调以完成旋转
    const kicks = [0, -1, 1, -2, 2];
    for (let i = 0; i < kicks.length; i++) {
      const nx = current.x + kicks[i];
      if (!collide(rotated, nx, current.y)) {
        current.matrix = rotated;
        current.x = nx;
        draw();
        return;
      }
    }
  }

  function softDrop() {
    if (!current || paused || gameOver) return;
    if (!collide(current.matrix, current.x, current.y + 1)) {
      current.y += 1;
      draw();
    } else {
      lockPiece();
    }
  }

  function hardDrop() {
    if (!current || paused || gameOver) return;
    let moved = 0;
    while (!collide(current.matrix, current.x, current.y + 1)) {
      current.y += 1;
      moved++;
    }
    score += moved * 2; // 硬降奖励
    lockPiece();
    updateHUD();
    draw();
  }

  /* ============ 固定方块 + 消行 ============ */
  function lockPiece() {
    const m = current.matrix;
    for (let r = 0; r < m.length; r++) {
      for (let c = 0; c < m[r].length; c++) {
        if (m[r][c]) {
          const y = current.y + r;
          const x = current.x + c;
          if (y >= 0) board[y][x] = current.type;
        }
      }
    }
    clearLines();
    spawnPiece();
  }

  function clearLines() {
    let cleared = 0;
    for (let r = ROWS - 1; r >= 0; r--) {
      if (board[r].every(function (cell) { return cell !== null; })) {
        board.splice(r, 1);
        board.unshift(new Array(COLS).fill(null));
        cleared++;
        r++; // 重新检查同一行（原上一行已下移）
      }
    }
    if (cleared > 0) {
      lines += cleared;
      score += (LINE_SCORES[cleared] || 0) * level;
      const newLevel = Math.floor(lines / LINES_PER_LEVEL) + 1;
      if (newLevel !== level) {
        level = newLevel;
        dropInterval = Math.max(80, 800 - (level - 1) * 70);
      }
      updateHUD();
    }
  }

  /* ============ 生成新方块 / 判定游戏结束 ============ */
  function spawnPiece() {
    const type = nextType || randomType();
    nextType = randomType();
    current = makePiece(type);
    drawNext();
    // 出生即碰撞 => 游戏结束
    if (collide(current.matrix, current.x, current.y)) {
      endGame();
    }
  }

  /* ============ 渲染 ============ */
  function drawCell(ctx, x, y, size, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x, y, size, size);
    // 高光 & 描边，提升质感
    ctx.fillStyle = "rgba(255,255,255,.28)";
    ctx.fillRect(x, y, size, Math.max(2, size * 0.14));
    ctx.fillStyle = "rgba(255,255,255,.14)";
    ctx.fillRect(x, y, Math.max(2, size * 0.14), size);
    ctx.fillStyle = "rgba(0,0,0,.28)";
    ctx.fillRect(x, y + size - Math.max(2, size * 0.14), size, Math.max(2, size * 0.14));
    ctx.strokeStyle = "rgba(0,0,0,.35)";
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, y + 0.5, size - 1, size - 1);
  }

  function drawGrid() {
    bctx.strokeStyle = "rgba(255,255,255,.045)";
    bctx.lineWidth = 1;
    for (let x = 0; x <= COLS; x++) {
      bctx.beginPath();
      bctx.moveTo(x * CELL + 0.5, 0);
      bctx.lineTo(x * CELL + 0.5, ROWS * CELL);
      bctx.stroke();
    }
    for (let y = 0; y <= ROWS; y++) {
      bctx.beginPath();
      bctx.moveTo(0, y * CELL + 0.5);
      bctx.lineTo(COLS * CELL, y * CELL + 0.5);
      bctx.stroke();
    }
  }

  function draw() {
    // 背景
    bctx.fillStyle = "#0b0e14";
    bctx.fillRect(0, 0, boardCanvas.width, boardCanvas.height);
    drawGrid();

    // 已固定的方块
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        if (board[r][c]) {
          drawCell(bctx, c * CELL, r * CELL, CELL, COLORS[board[r][c]]);
        }
      }
    }

    // 幽灵方块（落点提示）
    if (current && !gameOver) {
      let gy = current.y;
      while (!collide(current.matrix, current.x, gy + 1)) gy++;
      drawGhost(current.matrix, current.x, gy);
    }

    // 当前方块
    if (current && !gameOver) {
      const m = current.matrix;
      for (let r = 0; r < m.length; r++) {
        for (let c = 0; c < m[r].length; c++) {
          if (m[r][c]) {
            const y = current.y + r;
            const x = current.x + c;
            if (y >= 0) drawCell(bctx, x * CELL, y * CELL, CELL, COLORS[current.type]);
          }
        }
      }
    }
  }

  function drawGhost(matrix, px, py) {
    for (let r = 0; r < matrix.length; r++) {
      for (let c = 0; c < matrix[r].length; c++) {
        if (matrix[r][c]) {
          const y = py + r;
          const x = px + c;
          if (y >= 0) {
            bctx.fillStyle = "rgba(76,201,240,.12)";
            bctx.fillRect(x * CELL, y * CELL, CELL, CELL);
            bctx.strokeStyle = "rgba(76,201,240,.5)";
            bctx.lineWidth = 1;
            bctx.strokeRect(x * CELL + 0.5, y * CELL + 0.5, CELL - 1, CELL - 1);
          }
        }
      }
    }
  }

  function drawNext() {
    nctx.fillStyle = "#0b0e14";
    nctx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
    if (!nextType) return;
    const m = SHAPES[nextType];
    const cols = m[0].length;
    const rows = m.length;
    const offX = (nextCanvas.width - cols * NEXT_CELL) / 2;
    const offY = (nextCanvas.height - rows * NEXT_CELL) / 2;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (m[r][c]) {
          drawCell(nctx, offX + c * NEXT_CELL, offY + r * NEXT_CELL, NEXT_CELL, COLORS[nextType]);
        }
      }
    }
  }

  function updateHUD() {
    scoreEl.textContent = String(score);
    levelEl.textContent = String(level);
    linesEl.textContent = String(lines);
  }

  /* ============ 游戏循环（requestAnimationFrame） ============ */
  function loop(time) {
    if (!running) return;
    if (lastTime === 0) lastTime = time;
    const delta = time - lastTime;
    lastTime = time;

    if (!paused && !gameOver) {
      dropCounter += delta;
      if (dropCounter >= dropInterval) {
        dropCounter = 0;
        stepDown();
      }
    }
    rafId = requestAnimationFrame(loop);
  }

  function stepDown() {
    if (!current) return;
    if (!collide(current.matrix, current.x, current.y + 1)) {
      current.y += 1;
    } else {
      lockPiece();
    }
    draw();
  }

  /* ============ 开始 / 暂停 / 结束 / 重开 ============ */
  function startGame() {
    board = createEmptyBoard();
    score = 0;
    lines = 0;
    level = 1;
    dropInterval = 800;
    dropCounter = 0;
    lastTime = 0;
    gameOver = false;
    paused = false;
    bag = [];
    current = null;
    nextType = null;
    spawnPiece();
    updateHUD();
    draw();
    hideOverlay();
    pauseBtn.textContent = "暂停 (P)";
    running = true;
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);
  }

  function togglePause() {
    if (gameOver || !running) return;
    paused = !paused;
    if (paused) {
      pauseBtn.textContent = "继续 (P)";
      showOverlay("已暂停", "按 P 或点击按钮继续游戏", "继续游戏");
    } else {
      pauseBtn.textContent = "暂停 (P)";
      hideOverlay();
      lastTime = 0; // 避免暂停恢复后大量时间累积
    }
  }

  function endGame() {
    gameOver = true;
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
    showOverlay("游戏结束", "本局得分：" + score + "　等级：" + level, "重新开始");
  }

  /* ============ Overlay 控制 ============ */
  let overlayMode = "start"; // start | paused | over
  function showOverlay(title, sub, btnText) {
    overlayTitle.textContent = title;
    overlaySub.textContent = sub;
    overlayBtn.textContent = btnText;
    overlay.classList.add("show");
    if (title === "已暂停") overlayMode = "paused";
    else if (title === "游戏结束") overlayMode = "over";
    else overlayMode = "start";
  }
  function hideOverlay() {
    overlay.classList.remove("show");
  }

  function handleOverlayBtn() {
    if (overlayMode === "paused") {
      togglePause();
    } else {
      startGame();
    }
  }

  /* ============ 键盘控制 ============ */
  const KEY_LEFT = "ArrowLeft";
  const KEY_RIGHT = "ArrowRight";
  const KEY_DOWN = "ArrowDown";
  const KEY_UP = "ArrowUp";
  const KEY_SPACE = " ";
  let softRepeatTimer = null;

  document.addEventListener("keydown", function (e) {
    const k = e.key;

    // 暂停键：任意状态可用
    if (k === "p" || k === "P") {
      e.preventDefault();
      if (gameOver) return;
      if (!running) { startGame(); return; }
      togglePause();
      return;
    }

    // 未开始 / 已结束：空格或回车开始
    if (!running || gameOver) {
      if (k === " " || k === "Enter") {
        e.preventDefault();
        startGame();
      }
      return;
    }
    if (paused) return;

    switch (k) {
      case KEY_LEFT:
        e.preventDefault();
        move(-1);
        break;
      case KEY_RIGHT:
        e.preventDefault();
        move(1);
        break;
      case KEY_UP:
        e.preventDefault();
        rotate();
        break;
      case KEY_DOWN:
        e.preventDefault();
        softDrop();
        break;
      case KEY_SPACE:
        e.preventDefault();
        hardDrop();
        break;
      default:
        break;
    }
  });

  /* ============ 按钮事件 ============ */
  restartBtn.addEventListener("click", startGame);
  pauseBtn.addEventListener("click", function () {
    if (!running && !gameOver) { startGame(); return; }
    togglePause();
  });
  overlayBtn.addEventListener("click", handleOverlayBtn);

  /* ============ 初始化 ============ */
  board = createEmptyBoard();
  draw();
  drawNext();
  updateHUD();

  // 暴露给控制台便于调试（可选）
  window.__tetris = {
    startGame: startGame,
    getState: function () {
      return { score: score, level: level, lines: lines, gameOver: gameOver, paused: paused, running: running };
    }
  };
})();
</script>
</body>
</html>
