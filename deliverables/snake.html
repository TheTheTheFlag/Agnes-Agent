<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>贪吃蛇 · 提瓦特特供版</title><style>* { margin: 0; padding: 0; box-sizing: border-box; }body { background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; color: #fff; }.game-wrap { text-align: center; }h1 { font-size: 28px; margin-bottom: 12px; letter-spacing: 6px; text-shadow: 0 0 14px rgba(120,200,255,.8); }.info { display: flex; justify-content: space-between; width: 440px; margin: 0 auto 10px; font-size: 15px; }.info span { background: rgba(255,255,255,.12); padding: 4px 16px; border-radius: 20px; }canvas { background: #101427; border: 2px solid rgba(120,200,255,.5); border-radius: 10px; box-shadow: 0 0 30px rgba(80,140,255,.35); display: block; }.controls { margin-top: 16px; }.controls button { background: linear-gradient(135deg, #667eea, #764ba2); border: none; color: #fff; font-size: 16px; padding: 10px 30px; margin: 0 6px; border-radius: 24px; cursor: pointer; transition: transform .15s, box-shadow .15s; }.controls button:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(102,126,234,.6); }.controls button:active { transform: translateY(0); }.tip { margin-top: 12px; font-size: 13px; color: rgba(255,255,255,.6); }</style></head><body><div class="game-wrap"><h1>🐍 贪吃蛇</h1><div class="info"><span>分数：<b id="score">0</b></span><span>最高分：<b id="best">0</b></span><span id="state">未开始</span></div><canvas id="game" width="440" height="440"></canvas><div class="controls"><button id="btnStart">开始</button><button id="btnRestart">重新开始</button></div><div class="tip">方向键 / WASD 控制移动 · 空格暂停</div></div><script>(function () { const canvas = document.getElementById("game"); const ctx = canvas.getContext("2d"); const scoreEl = document.getElementById("score"); const bestEl = document.getElementById("best"); const stateEl = document.getElementById("state"); const btnStart = document.getElementById("btnStart"); const btnRestart = document.getElementById("btnRestart"); const GRID = 20; const CELL = canvas.width / GRID; let snake, dir, nextDir, food, score, best, timer, running, paused, speed; best = parseInt(localStorage.getItem("snake_best") || "0", 10); bestEl.textContent = best; function reset() { snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}]; dir = {x: 1, y: 0}; nextDir = {x: 1, y: 0}; score = 0; speed = 150; running = false; paused = false; scoreEl.textContent = "0"; stateEl.textContent = "未开始"; btnStart.textContent = "开始"; spawnFood(); draw(); } function spawnFood() { while (true) { food = {x: Math.floor(Math.random() * GRID), y: Math.floor(Math.random() * GRID)}; if (!snake.some(s => s.x === food.x && s.y === food.y)) break; } } function start() { if (running) { paused = !paused; stateEl.textContent = paused ? "已暂停" : "游戏中"; btnStart.textContent = paused ? "继续" : "暂停"; return; } running = true; paused = false; stateEl.textContent = "游戏中"; btnStart.textContent = "暂停"; loop(); } function loop() { clearTimeout(timer); if (!running || paused) return; update(); draw(); timer = setTimeout(loop, speed); } function update() { dir = nextDir; const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y}; if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) return gameOver(); if (snake.some(s => s.x === head.x && s.y === head.y)) return gameOver(); snake.unshift(head); if (head.x === food.x && head.y === food.y) { score++; scoreEl.textContent = score; if (score > best) { best = score; bestEl.textContent = best; localStorage.setItem("snake_best", best); } speed = Math.max(60, 150 - score * 3); spawnFood(); } else { snake.pop(); } } function gameOver() { running = false; clearTimeout(timer); stateEl.textContent = "游戏结束"; btnStart.textContent = "开始"; draw(); ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.fillStyle = "#ff6b6b"; ctx.font = "bold 44px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("游戏结束", canvas.width / 2, canvas.height / 2 - 16); ctx.fillStyle = "#fff"; ctx.font = "20px sans-serif"; ctx.fillText("得分：" + score + "（点击重新开始）", canvas.width / 2, canvas.height / 2 + 30); } function draw() { ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.strokeStyle = "rgba(255,255,255,.06)"; ctx.lineWidth = 1; for (let i = 1; i < GRID; i++) { ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(canvas.width, i * CELL); ctx.stroke(); } const fx = food.x * CELL + CELL / 2, fy = food.y * CELL + CELL / 2; ctx.fillStyle = "#ff4757"; ctx.beginPath(); ctx.arc(fx, fy, CELL / 2 - 3, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = "rgba(255,255,255,.85)"; ctx.beginPath(); ctx.arc(fx - 3, fy - 4, 2.5, 0, Math.PI * 2); ctx.fill(); snake.forEach((s, i) => { const pad = 1; const x = s.x * CELL + pad, y = s.y * CELL + pad, w = CELL - pad * 2; if (i === 0) { ctx.fillStyle = "#5ad8a6"; ctx.shadowColor = "#5ad8a6"; ctx.shadowBlur = 8; } else { ctx.fillStyle = i % 2 === 0 ? "#3bb78f" : "#2fa36f"; ctx.shadowBlur = 0; } ctx.fillRect(x, y, w, w); ctx.shadowBlur = 0; }); const head = snake[0]; const hx = head.x * CELL, hy = head.y * CELL; ctx.fillStyle = "#fff"; const ex = dir.x * 5, ey = dir.y * 5; ctx.beginPath(); ctx.arc(hx + CELL / 2 + ex - 3, hy + CELL / 2 + ey - 3, 2.5, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(hx + CELL / 2 + ex + 3, hy + CELL / 2 + ey - 3, 2.5, 0, Math.PI * 2); ctx.fill(); } document.addEventListener("keydown", e => { const map = { ArrowUp: {x: 0, y: -1}, ArrowDown: {x: 0, y: 1}, ArrowLeft: {x: -1, y: 0}, ArrowRight: {x: 1, y: 0}, w: {x: 0, y: -1}, s: {x: 0, y: 1}, a: {x: -1, y: 0}, d: {x: 1, y: 0}, W: {x: 0, y: -1}, S: {x: 0, y: 1}, A: {x: -1, y: 0}, D: {x: 1, y: 0} }; if (e.key === " ") { e.preventDefault(); if (running) start(); return; } const nd = map[e.key]; if (!nd) return; e.preventDefault(); if (nd.x === -dir.x && nd.y === -dir.y) return; nextDir = nd; }); btnStart.addEventListener("click", start); btnRestart.addEventListener("click", () => { clearTimeout(timer); reset(); }); reset(); })();</script></body></html>
