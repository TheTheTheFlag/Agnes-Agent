<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>贪吃蛇游戏</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      color: #eee;
    }
    h1 { margin-bottom: 12px; font-size: 28px; color: #0ff; text-shadow: 0 0 10px #0ff; }
    #score-board {
      font-size: 20px;
      margin-bottom: 10px;
      color: #fff;
    }
    #score-board span { color: #0f0; font-weight: bold; }
    canvas {
      border: 2px solid #0ff;
      box-shadow: 0 0 20px rgba(0,255,255,0.3);
      background: #0d0d1a;
    }
    #message {
      margin-top: 14px;
      font-size: 16px;
      color: #aaa;
      height: 22px;
    }
    #controls {
      margin-top: 10px;
      font-size: 13px;
      color: #888;
    }
  </style>
</head>
<body>
  <h1>🐍 贪吃蛇</h1>
  <div id="score-board">得分：<span id="score">0</span></div>
  <canvas id="game" width="400" height="400"></canvas>
  <div id="message">按 空格键 或 点击开始</div>
  <div id="controls">方向键控制移动 | 空格键 开始/暂停</div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const msgEl = document.getElementById('message');

    const GRID = 20;
    const COLS = canvas.width / GRID;
    const ROWS = canvas.height / GRID;
    const SPEED = 120; // ms per frame

    let snake, dir, nextDir, food, score, alive, started, loop;

    function init() {
      snake = [{ x: 10, y: 10 }];
      dir = { x: 1, y: 0 };
      nextDir = { ...dir };
      score = 0;
      alive = true;
      started = false;
      scoreEl.textContent = 0;
      msgEl.textContent = '按 空格键 或 点击开始';
      placeFood();
      draw();
    }

    function placeFood() {
      while (true) {
        food = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
        if (!snake.some(s => s.x === food.x && s.y === food.y)) break;
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // grid lines (subtle)
      ctx.strokeStyle = '#1a1a3e';
      ctx.lineWidth = 0.5;
      for (let x = 0; x <= COLS; x++) {
        ctx.beginPath(); ctx.moveTo(x * GRID, 0); ctx.lineTo(x * GRID, canvas.height); ctx.stroke();
      }
      for (let y = 0; y <= ROWS; y++) {
        ctx.beginPath(); ctx.moveTo(0, y * GRID); ctx.lineTo(canvas.width, y * GRID); ctx.stroke();
      }

      // food
      ctx.fillStyle = '#f33';
      ctx.shadowColor = '#f33';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(food.x * GRID + GRID / 2, food.y * GRID + GRID / 2, GRID / 2 - 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // snake
      snake.forEach((s, i) => {
        const ratio = i / snake.length;
        ctx.fillStyle = i === 0 ? '#0f0' : `rgb(${Math.floor(0 + ratio * 0)}, ${Math.floor(200 - ratio * 100)}, ${Math.floor(100 - ratio * 50)})`;
        ctx.shadowColor = i === 0 ? '#0f0' : 'transparent';
        ctx.shadowBlur = i === 0 ? 8 : 0;
        ctx.fillRect(s.x * GRID + 1, s.y * GRID + 1, GRID - 2, GRID - 2);
      });
      ctx.shadowBlur = 0;
    }

    function step() {
      if (!alive || !started) return;
      dir = { ...nextDir };
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // wall collision
      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) { die(); return; }
      // self collision
      if (snake.some(s => s.x === head.x && s.y === head.y)) { die(); return; }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        placeFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function die() {
      alive = false;
      msgEl.textContent = `游戏结束！得分：${score}  按空格重试`;
      msgEl.style.color = '#f44';
    }

    function start() {
      if (!started) {
        started = true;
        msgEl.style.color = '#aaa';
        msgEl.textContent = '';
        loop = setInterval(step, SPEED);
      }
    }

    document.addEventListener('keydown', e => {
      if (e.key === ' ') {
        e.preventDefault();
        if (!alive) { init(); return; }
        start();
        return;
      }
      const { x, y } = dir;
      switch (e.key) {
        case 'ArrowUp':    if (y !== 1)  nextDir = { x: 0, y: -1 }; break;
        case 'ArrowDown':  if (y !== -1) nextDir = { x: 0, y: 1 };  break;
        case 'ArrowLeft':  if (x !== 1)  nextDir = { x: -1, y: 0 }; break;
        case 'ArrowRight': if (x !== -1) nextDir = { x: 1, y: 0 };  break;
      }
    });

    canvas.addEventListener('click', () => {
      if (!alive) { init(); return; }
      start();
    });

    init();
  </script>
</body>
</html>
