[project]
name = "agnes-agent"
version = "0.1.0"
description = "Agnes Agent — 分层记忆 + 工具调用 + 沉浸式调试面板的 LangGraph 智能体"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dashscope>=1.27.0",
    "fastapi>=0.141.1",
    "ipython>=9.16.1",
    "langchain>=1.3.16",
    "langchain-alibaba>=0.1.1",
    "langchain-anthropic>=1.6.1",
    "langchain-community>=0.4.2",
    "langchain-dashscope>=0.1.8",
    "langchain-deepseek>=1.1.0",
    "langchain-openai>=1.6.0",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langsmith>=0.11.1",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.52.4",
    "ormsgpack>=1.7.0",
    "requests>=2.31.0",
]

[dependency-groups]
dev = [
    "langgraph-cli>=0.4.31",
]

[project.scripts]
agnes-agent = "app.main:main"
